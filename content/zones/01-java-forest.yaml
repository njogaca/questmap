      - slug: java-4-lab-rest
        type: lab
        title: "Lab: API REST de órdenes con validación y errores"
        required: true
        estimated_min: 120
        skills: { java: 0.7, microservices_gcp: 0.1, testing: 0.1, git: 0.1 }
        payload:
          goal: "Exponer tu `OrderService` del nivel 3 como API REST con validación, manejo de errores, dos profiles y logs."
          steps:
            - title: Repositorio en memoria
              body: "Crea `InMemoryOrderRepository` (anotado con `@Repository`) que implemente `OrderRepository` con un `ConcurrentHashMap<String, Order>`. Anota `OrderService` con `@Service`."
            - title: DTO con validación
              body: "Crea `record CreateOrderRequest(@NotBlank String customer, @Positive double total) {}` (paquete `jakarta.validation.constraints`)."
            - title: Controller
              body: "`@RestController @RequestMapping(\"/orders\")` con:\n- `POST /orders` → recibe `@Valid @RequestBody CreateOrderRequest`, devuelve 201 Created con la orden.\n- `GET /orders/{id}` → devuelve la orden o 404."
            - title: Errores en un solo lugar
              body: "Crea una clase `@RestControllerAdvice` con `@ExceptionHandler(OrderNotFoundException.class)` → 404 y `@ExceptionHandler(MethodArgumentNotValidException.class)` → 400. Devuelve un JSON simple: `{\"error\": \"...\"}` (o usa `ProblemDetail` de Spring)."
            - title: Profiles y logs
              body: "En `src/main/resources/application.properties` pon `app.greeting=hola desde default`; crea `application-dev.properties` con `app.greeting=hola desde dev` y `logging.level.com.questmap=DEBUG`. Agrega un `log.info` al crear una orden (usa `LoggerFactory.getLogger(...)` de SLF4J)."
            - title: Ejecuta con el profile dev y prueba
              commands:
                - ".\\mvnw.cmd spring-boot:run \"-Dspring-boot.run.profiles=dev\""
                - "# En otra ventana de PowerShell:"
                - "Invoke-RestMethod -Method Post -Uri http://localhost:8080/orders -ContentType 'application/json' -Body '{\"customer\":\"ana\",\"total\":120}'"
                - "Invoke-RestMethod -Method Post -Uri http://localhost:8080/orders -ContentType 'application/json' -Body '{\"customer\":\"\",\"total\":-5}' -SkipHttpErrorCheck -StatusCodeVariable sc; $sc"
                - "Invoke-RestMethod http://localhost:8080/orders/no-existe -SkipHttpErrorCheck -StatusCodeVariable sc; $sc"
            - title: Prueba del controller y commit
              body: "Agrega una prueba con `@WebMvcTest(OrderController.class)` y `MockMvc` que verifique que un POST inválido devuelve 400 (ver la guía 'Testing the Web Layer')."
              commands:
                - ".\\mvnw.cmd test"
                - "git add .; git commit -m \"orders: REST API with validation and error handling\""
          expected: "POST válido → JSON con id (201). POST inválido → 400 con mensaje. GET inexistente → 404. En la consola de la app ves tu log de 'orden creada'."
          checklist:
            - "POST válido devuelve 201 con la orden"
            - "POST inválido devuelve 400 con un mensaje entendible"
            - "GET de un id inexistente devuelve 404"
            - "El profile dev cambia el nivel de log (veo mis DEBUG)"
            - "Tengo al menos una prueba con MockMvc y todas pasan"
            - "Hice commit"
          hints:
            - "Si `@Valid` no hace nada, revisa que el proyecto tenga la dependencia `validation` (la incluimos al generarlo)."
            - "Para devolver 201: `return ResponseEntity.status(HttpStatus.CREATED).body(order);`"
            - "`-SkipHttpErrorCheck` y `-StatusCodeVariable` requieren PowerShell 7 (`pwsh`)."
          evidence_hint: "Pega la salida de los 3 Invoke-RestMethod (con los códigos 400 y 404) y el resumen de `.\\mvnw.cmd test`."

      - slug: java-4-quiz
        type: quiz
        title: Quiz — Spring Boot REST
        required: true
        estimated_min: 15
        skills: { java: 1.0 }
        questions:
          - slug: j4-q1
            type: mcq
            prompt: "¿Qué código HTTP corresponde a 'recurso creado'?"
            options: ["200 OK", "201 Created", "204 No Content", "202 Accepted"]
            answer: 1
            explanation: "201 indica que se creó un recurso (idealmente con el header `Location`). 202 = aceptado para procesar después (útil en flujos asíncronos)."
            skill: java
            difficulty: 1
          - slug: j4-q2
            type: mcq
            prompt: "El cliente envía un JSON con `total: -5` y tu validación lo rechaza. ¿Qué código devuelves?"
            options: ["500", "404", "400", "409"]
            answer: 2
            explanation: "400 Bad Request: el error es del cliente (datos inválidos). 500 es error del servidor; 409 es conflicto con el estado actual."
            skill: java
            difficulty: 1
          - slug: j4-q3
            type: tf
            prompt: "La inyección por constructor es la forma recomendada en Spring porque permite campos `final` y facilita las pruebas."
            answer: true
            explanation: "Con inyección por constructor las dependencias son obligatorias e inmutables, y en las pruebas puedes pasar mocks sin reflexión."
            skill: java
            difficulty: 1
          - slug: j4-q4
            type: mcq
            prompt: "¿Para qué sirve `@RestControllerAdvice`?"
            options: ["Para definir rutas", "Para centralizar el manejo de excepciones de todos los controllers", "Para configurar la base de datos", "Para documentar la API"]
            answer: 1
            explanation: "Evita repetir try/catch en cada endpoint: un solo lugar traduce excepciones a respuestas HTTP coherentes."
            skill: java
            difficulty: 1
          - slug: j4-q5
            type: fill
            prompt: "Para activar el profile `dev` al arrancar: `java -jar app.jar --spring.profiles.______=dev`"
            answer: ["active"]
            explanation: "`spring.profiles.active` decide qué `application-{profile}.properties` se carga además del base."
            skill: java
            difficulty: 2
          - slug: j4-q6
            type: mcq
            prompt: "¿Qué ofrece Spring Boot Actuator?"
            options:
              - "Un ORM para bases de datos"
              - "Endpoints operativos como /actuator/health y métricas"
              - "Un servidor de mensajería"
              - "Autenticación con OAuth2"
            answer: 1
            explanation: "Actuator expone salud, info y métricas (vía Micrometer). Lo usarás en el Observatory con Prometheus."
            skill: java
            difficulty: 1
          - slug: j4-q7
            type: mcq
            prompt: "Un GET a `/orders/{id}` debe ser idempotente. ¿Qué significa?"
            options:
              - "Que siempre devuelve 200"
              - "Que repetir la misma petición no cambia el estado del servidor más allá de la primera vez"
              - "Que es más rápido"
              - "Que requiere autenticación"
            answer: 1
            explanation: "Idempotente = hacerlo 1 o N veces deja el mismo efecto. GET, PUT y DELETE deberían serlo; POST normalmente no. Este concepto vuelve fuerte en Event Harbor."
            skill: java
            difficulty: 2
          - slug: j4-q8
            type: order
            prompt: "Ordena el recorrido de una petición POST /orders en Spring Boot:"
            options:
              - "El DispatcherServlet recibe la petición HTTP"
              - "Jackson convierte el JSON en CreateOrderRequest"
              - "Bean Validation revisa @NotBlank/@Positive"
              - "El controller llama a OrderService"
              - "Se devuelve la respuesta 201 en JSON"
            answer: [0, 1, 2, 3, 4]
            explanation: "La validación ocurre antes de entrar a tu método; si falla, nunca se llama al servicio y el advice devuelve 400."
            skill: java
            difficulty: 2

