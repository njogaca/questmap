      - slug: m0-n5-ejercicio
        type: lab
        title: "Ejercicio — Validaciones y reporte de pedidos"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-streams, required: false }
        payload:
          proof: commit_or_hours
          goal: "Pedidos que se validan con excepciones propias y un reporte calculado con streams."
          spec:
            context: |
              Contabilidad encontró pedidos vacíos y líneas con cantidad cero dentro del sistema, y
              nadie sabe cuándo entraron. Piden dos cosas: que un pedido inválido no pueda guardarse
              y que el motivo quede claro, y un reporte de ventas que hoy sacan contando a mano.
            requirements:
              - "`PedidoInvalidoException` es una excepción propia que extiende `RuntimeException` y recibe el mensaje en el constructor."
              - "`Pedido.validar()` no devuelve nada: lanza `PedidoInvalidoException` si el pedido rompe alguna regla."
              - "`RepositorioPedidos.agregar` llama a `validar()` antes de guardar. Un pedido inválido nunca queda en el almacén."
              - "`ReportePedidos.totalVendido(List<Pedido> pedidos)` devuelve un `double` con la suma de los totales."
              - "`ReportePedidos.pedidoMasGrande(List<Pedido> pedidos)` devuelve un `Optional<Pedido>` con el de mayor total."
              - "`ReportePedidos.totalPorCliente(List<Pedido> pedidos)` devuelve un `Map<String, Double>` de correo del cliente a suma de sus totales."
              - "`main` arma varios pedidos, intenta guardar uno inválido, muestra el error e imprime el reporte de los válidos."
            inputs:
              - { name: "pedidos", type: "List<Pedido>", desc: "Pedidos ya validados, por ejemplo `repositorio.listarTodos()`. Puede venir vacía." }
            outputs:
              - { name: "totalVendido", type: "double", desc: "`0.0` con lista vacía." }
              - { name: "pedidoMasGrande", type: "Optional<Pedido>", desc: "`Optional.empty()` con lista vacía. Si hay empate, el primero de la lista." }
              - { name: "totalPorCliente", type: "Map<String, Double>", desc: "Una entrada por correo. Mapa vacío con lista vacía." }
              - { name: "mensaje de error", type: "String", desc: "Lo que imprime `main` al atrapar la excepción: `Error: ` seguido del mensaje." }
            rules:
              - "Un pedido sin líneas es inválido. Mensaje: `El pedido <id> no tiene líneas`."
              - "Una línea con cantidad menor que 1 es inválida. Mensaje: `Cantidad inválida para '<producto>' en el pedido <id>: <cantidad>`."
              - "Los tres métodos del reporte se resuelven con streams. No hay `for` ni `while` en `ReportePedidos`."
              - "La excepción se atrapa una sola vez, en `main`. Ningún `catch` queda vacío ni atrapa `Exception` a secas."
              - "El reporte no modifica la lista que recibe."
            examples:
              - title: "Reporte de tres pedidos válidos"
                input: |
                  P-001  ana@example.com   total 85.50
                  P-002  luis@example.com  total 200.00
                  P-003  ana@example.com   total 14.50
                output: |
                  Total vendido: 300.00
                  Pedido más grande: P-002 (200.00)
                  ana@example.com: 100.00
                  luis@example.com: 200.00
              - title: "Intento de guardar un pedido inválido"
                input: |
                  P-004 sin líneas
                  P-005 con la línea Teclado x 0
                output: |
                  Error: El pedido P-004 no tiene líneas
                  Error: Cantidad inválida para 'Teclado' en el pedido P-005: 0
            edge_cases:
              - "Lista vacía: el reporte devuelve `0.0`, `Optional.empty()` y un mapa vacío, sin lanzar nada."
              - "Tras el intento fallido, `repositorio.cantidad()` no cambió."
              - "Una cantidad negativa da el mismo error que una cantidad en cero."
              - "El programa no termina en el primer error: sigue y muestra el reporte."
            out_of_scope:
              - "Reportes por fecha: el pedido todavía no tiene fecha."
              - "Ordenar las entradas de `totalPorCliente` de una forma particular."
              - "Excepciones comprobadas (`extends Exception`)."
          steps:
            - title: "Validaciones"
              body: "Crea una excepción `PedidoInvalidoException`. Lánzala cuando el pedido no tenga líneas o una cantidad sea menor que 1, con un mensaje que diga qué falló."
            - title: "Reporte"
              body: "Con streams calcula el total vendido, el pedido más grande y el total por cliente."
            - title: "Atrapar donde toca"
              body: "Atrapa la excepción en `main` y muestra un mensaje claro. No la atrapes en medio para ignorarla."
          checklist:
            - "Un pedido inválido lanza la excepción propia"
            - "El reporte no usa ciclos for"
            - "Ningún `catch` está vacío"

