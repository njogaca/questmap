slug: event-harbor
title: Event Harbor
order: 2
emoji: "⚓"
map: { x: 390, y: 190 }
prerequisites: [{ zone: java-forest, level: 2 }]
skills: [eda, distributed_systems]
story: >
  Sector 02. Un puerto donde los mensajes llegan y zarpan sin esperar a nadie.
  Tú ya dominabas las colas de IBM MQ; aquí aprenderás el idioma de Google Cloud Pub/Sub
  y por qué en un sistema distribuido "entregar exactamente una vez" es más difícil de lo que parece.

levels:
  # ================================================================ NIVEL 1
  - slug: eda-1-novice
    number: 1
    title: "Novice — Mensajería asíncrona y el mapa MQ → Pub/Sub"
    story: "Llegas al muelle. Ves barcos (mensajes), faros (topics) y capitanes que esperan carga (suscriptores). Mucho te resulta familiar."
    quests:
      - slug: eda-1-learn-async
        type: learn
        title: Pub/Sub vs colas y por qué asíncrono
        required: true
        estimated_min: 45
        skills: { eda: 0.8, distributed_systems: 0.2 }
        resources:
          - { ref: res-pubsub-overview }
          - { ref: res-ddia, required: false }
        payload:
          note_prompt: "Explica con tus palabras la diferencia entre una cola punto a punto y un topic con varias suscripciones. ¿Qué gana un sistema al comunicarse de forma asíncrona?"

      - slug: eda-1-learn-mq-map
        type: learn
        title: "Tu mapa: de IBM MQ a Pub/Sub"
        required: true
        estimated_min: 30
        skills: { eda: 1.0 }
        resources:
          - { ref: res-pubsub-subscriptions }
        payload:
          note_prompt: "Arma tu propio mapa: ¿a qué se parece en Pub/Sub un queue manager, una queue local, un channel y un backout queue? ¿Qué NO tiene equivalente directo?"
          summary_md: |
            Mapa aproximado (no es 1 a 1):
            - Queue manager → el servicio Pub/Sub gestionado de Google (no administras servidores).
            - Queue local (punto a punto) → un topic con UNA subscription consumida por varios workers.
            - Publish/subscribe de MQ → un topic con VARIAS subscriptions (cada una recibe copia).
            - Channel → no existe: la conexión es HTTPS/gRPC con autenticación IAM.
            - Backout queue / BOTHRESH → dead-letter topic + max delivery attempts.
            - MQGET con syncpoint + commit → pull + ack (o push a un endpoint HTTP).

      - slug: eda-1-glossary
        type: glossary
        title: Vocabulario básico de mensajería
        required: true
        estimated_min: 15
        skills: { eda: 1.0 }
        payload:
          terms: [eda-async-messaging, eda-topic, eda-subscription, eda-publisher, eda-subscriber, eda-point-to-point, eda-fan-out, eda-event-vs-command, eda-message-attributes]

      - slug: eda-1-quiz
        type: quiz
        title: Quiz — Mensajería y Pub/Sub básico
        required: true
        estimated_min: 15
        skills: { eda: 0.8, distributed_systems: 0.2 }
        questions:
          - slug: e1-q1
            type: mcq
            prompt: "Un topic de Pub/Sub tiene 3 subscriptions. Se publica 1 mensaje. ¿Cuántas copias se entregan?"
            options: ["1, a la primera subscription que llegue", "3, una por subscription", "Depende del número de suscriptores conectados", "0 hasta que alguien haga ack"]
            answer: 1
            explanation: "Cada subscription recibe su propia copia (fan-out). Dentro de una subscription, si hay varios workers, cada mensaje va normalmente a uno solo de ellos."
            skill: eda
            difficulty: 1
          - slug: e1-q2
            type: mcq
            prompt: "Quieres que 5 workers se repartan el trabajo de un mismo flujo (como varias instancias leyendo una cola MQ). ¿Qué haces?"
            options: ["Un topic con 5 subscriptions", "Un topic con 1 subscription y 5 workers conectados a ella", "5 topics", "Push a 5 URLs"]
            answer: 1
            explanation: "Los workers que comparten una subscription compiten por los mensajes (competing consumers). Cinco subscriptions harían que cada mensaje se procese cinco veces."
            skill: eda
            difficulty: 2
            hint: "¿Repartir o copiar?"
          - slug: e1-q3
            type: tf
            prompt: "En la comunicación asíncrona, quien publica no necesita que el consumidor esté disponible en ese momento."
            answer: true
            explanation: "El broker guarda el mensaje hasta que el consumidor lo procese: desacopla en el tiempo y absorbe picos de carga."
            skill: eda
            difficulty: 1
          - slug: e1-q4
            type: mcq
            prompt: "¿Cuál es un EVENTO (no un comando)?"
            options: ["ChargeCreditCard", "SendWelcomeEmail", "OrderPlaced", "ReserveStock"]
            answer: 2
            explanation: "Un evento describe algo que YA ocurrió (pasado: OrderPlaced) y cualquiera puede reaccionar. Un comando pide a alguien específico que haga algo (imperativo)."
            skill: eda
            difficulty: 1
          - slug: e1-q5
            type: mcq
            prompt: "¿Cuál es el equivalente más cercano a una backout queue de MQ en Pub/Sub?"
            options: ["Una subscription push", "Un dead-letter topic", "Un snapshot", "Un ordering key"]
            answer: 1
            explanation: "Tras N intentos fallidos (max delivery attempts) el mensaje se reenvía al dead-letter topic, igual que MQ lo mueve a la backout queue al superar BOTHRESH."
            skill: eda
            difficulty: 1
          - slug: e1-q6
            type: fill
            prompt: "La operación con la que el suscriptor confirma que procesó un mensaje y Pub/Sub puede dejar de reenviarlo se llama ______ (abreviatura en inglés)."
            answer: ["ack", "acknowledge", "acknowledgement"]
            explanation: "Sin ack, cuando vence el ack deadline, Pub/Sub vuelve a entregar el mensaje."
            skill: eda
            difficulty: 1
          - slug: e1-q7
            type: mcq
            prompt: "¿Para qué sirven los atributos (attributes) de un mensaje?"
            options: ["Para cifrar el contenido", "Metadatos clave-valor (ej. tipo de evento, versión) sin abrir el cuerpo", "Para ordenar los mensajes", "Para elegir la región"]
            answer: 1
            explanation: "Como los headers/propiedades de un mensaje MQ: permiten filtrar o enrutar sin deserializar el payload."
            skill: eda
            difficulty: 1
          - slug: e1-q8
            type: tf
            prompt: "En Pub/Sub tienes que crear y mantener canales (channels) entre aplicaciones, como en IBM MQ."
            answer: false
            explanation: "No hay canales que administrar: los clientes se conectan al servicio por HTTPS/gRPC y la seguridad la da IAM."
            skill: eda
            difficulty: 1

      - slug: eda-1-micro-flashcards
        type: micro
        title: Repaso rápido de mensajería
        required: false
        estimated_min: 10
        skills: { eda: 1.0 }
        payload:
          kind: flashcards
          terms: [eda-topic, eda-subscription, eda-fan-out, eda-event-vs-command]

  # ================================================================ NIVEL 2
  - slug: eda-2-apprentice
    number: 2
    title: "Apprentice — Cloud Pub/Sub con el emulador"
    story: "Construyes tu propio puerto en miniatura: un emulador en Docker donde puedes publicar y recibir sin gastar un centavo."
    quests:
      - slug: eda-2-learn-subscriptions
        type: learn
        title: Pull, push y ack deadline
        required: true
        estimated_min: 40
        skills: { eda: 1.0 }
        resources:
          - { ref: res-pubsub-subscriptions }
          - { ref: res-pubsub-emulator }
        payload:
          note_prompt: "¿Cuándo elegirías una subscription push y cuándo pull? ¿Qué pasa si tu consumidor tarda más que el ack deadline?"

      - slug: eda-2-glossary
        type: glossary
        title: Vocabulario de entrega
        required: true
        estimated_min: 10
        skills: { eda: 1.0 }
        payload:
          terms: [eda-ack, eda-ack-deadline, eda-pull, eda-push, eda-emulator, eda-backlog]

      - slug: eda-2-lab-emulator
        type: lab
        title: "Lab: tu primer topic en el emulador de Pub/Sub"
        required: true
        estimated_min: 60
        skills: { eda: 0.9, distributed_systems: 0.1 }
        payload:
          goal: "Levantar el emulador de Pub/Sub en Docker y, usando solo su API REST con Invoke-RestMethod, crear un topic, dos subscriptions, publicar y recibir mensajes."
          steps:
            - title: Levanta el emulador
              body: "Usamos la imagen oficial de Google Cloud CLI con los emuladores. La primera descarga pesa bastante. Deja esta ventana abierta. Si el tag `:emulators` no existiera, revisa la guía oficial del emulador (recurso del nivel)."
              commands:
                - "docker run --rm --name pubsub-emu -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators gcloud beta emulators pubsub start --project=questmap-lab --host-port=0.0.0.0:8085"
            - title: Variables en otra ventana de PowerShell
              commands:
                - "$base = 'http://localhost:8085/v1/projects/questmap-lab'"
            - title: Crea el topic y dos subscriptions
              body: "`billing-sub` y `shipping-sub` recibirán cada una su copia (fan-out)."
              commands:
                - "Invoke-RestMethod -Method Put -Uri \"$base/topics/orders\""
                - "Invoke-RestMethod -Method Put -Uri \"$base/subscriptions/billing-sub\" -ContentType 'application/json' -Body (@{ topic = 'projects/questmap-lab/topics/orders'; ackDeadlineSeconds = 10 } | ConvertTo-Json)"
                - "Invoke-RestMethod -Method Put -Uri \"$base/subscriptions/shipping-sub\" -ContentType 'application/json' -Body (@{ topic = 'projects/questmap-lab/topics/orders'; ackDeadlineSeconds = 10 } | ConvertTo-Json)"
            - title: Publica un evento OrderPlaced
              body: "El cuerpo del mensaje (`data`) va en Base64. Los atributos viajan aparte."
              commands:
                - "$json = '{\"orderId\":\"o-100\",\"customer\":\"ana\",\"total\":120}'"
                - "$data = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))"
                - "Invoke-RestMethod -Method Post -Uri \"$base/topics/orders:publish\" -ContentType 'application/json' -Body (@{ messages = @(@{ data = $data; attributes = @{ eventType = 'OrderPlaced'; version = '1' } }) } | ConvertTo-Json -Depth 5)"
            - title: Recibe (pull) desde billing-sub y decodifica
              commands:
                - "$r = Invoke-RestMethod -Method Post -Uri \"$base/subscriptions/billing-sub:pull\" -ContentType 'application/json' -Body '{\"maxMessages\":10}'"
                - "$r.receivedMessages | ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_.message.data)); $_.message.attributes }"
            - title: Haz ack
              commands:
                - "$ids = @($r.receivedMessages.ackId)"
                - "Invoke-RestMethod -Method Post -Uri \"$base/subscriptions/billing-sub:acknowledge\" -ContentType 'application/json' -Body (@{ ackIds = $ids } | ConvertTo-Json)"
            - title: Comprueba el fan-out
              body: "Haz pull en `shipping-sub`: debe tener SU PROPIA copia del mismo mensaje, aunque billing ya hizo ack."
              commands:
                - "Invoke-RestMethod -Method Post -Uri \"$base/subscriptions/shipping-sub:pull\" -ContentType 'application/json' -Body '{\"maxMessages\":10}'"
          expected: "El pull en billing-sub muestra el JSON de la orden y los atributos eventType=OrderPlaced, version=1. Después del ack, un nuevo pull en billing-sub viene vacío, pero shipping-sub todavía tiene su copia."
          checklist:
            - "El emulador corre en Docker en el puerto 8085"
            - "Creé el topic `orders` y las dos subscriptions"
            - "Publiqué un mensaje con atributos y lo leí decodificado desde billing-sub"
            - "Después del ack, billing-sub queda vacía"
            - "shipping-sub recibió su propia copia (fan-out)"
          hints:
            - "Si un PUT devuelve 409, el recurso ya existe: no pasa nada, sigue."
            - "Si el pull viene vacío justo después de publicar, espera un segundo y repite."
          evidence_hint: "Pega la salida del pull decodificado de billing-sub y la del pull de shipping-sub."

      - slug: eda-2-quiz
        type: quiz
        title: Quiz — Subscriptions y entrega
        required: true
        estimated_min: 15
        skills: { eda: 1.0 }
        questions:
          - slug: e2-q1
            type: mcq
            prompt: "Tu consumidor tarda 30 s en procesar y el ack deadline es 10 s (sin extensión). ¿Qué pasa?"
            options: ["Pub/Sub espera indefinidamente", "El mensaje se vuelve a entregar y puede procesarse dos veces", "El mensaje se pierde", "Se va al dead-letter topic de inmediato"]
            answer: 1
            explanation: "Al vencer el plazo sin ack, Pub/Sub asume que falló y lo reenvía. Por eso las librerías cliente extienden el plazo automáticamente (lease management) y tu consumidor debe ser idempotente."
            skill: eda
            difficulty: 2
          - slug: e2-q2
            type: mcq
            prompt: "¿Qué caracteriza a una subscription push?"
            options: ["El consumidor pide mensajes cuando quiere", "Pub/Sub envía cada mensaje por HTTP POST a un endpoint", "Solo funciona con el emulador", "Garantiza orden siempre"]
            answer: 1
            explanation: "En push, Pub/Sub llama a tu endpoint (ej. Cloud Run); una respuesta 2xx cuenta como ack. En pull, tu proceso pide mensajes y controla el ritmo."
            skill: eda
            difficulty: 1
          - slug: e2-q3
            type: tf
            prompt: "Para usar el emulador de Pub/Sub necesitas una cuenta de Google Cloud con facturación."
            answer: false
            explanation: "El emulador corre localmente y es gratis. Las librerías cliente lo detectan con la variable `PUBSUB_EMULATOR_HOST`."
            skill: eda
            difficulty: 1
          - slug: e2-q4
            type: fill
            prompt: "Las librerías cliente usan la variable de entorno `PUBSUB_EMULATOR_______` para conectarse al emulador."
            answer: ["HOST"]
            explanation: "`PUBSUB_EMULATOR_HOST=localhost:8085` hace que el cliente hable con el emulador y no con Google Cloud."
            skill: eda
            difficulty: 1
          - slug: e2-q5
            type: mcq
            prompt: "¿Qué es el backlog de una subscription?"
            options: ["Los mensajes publicados pero aún sin ack en esa subscription", "Los logs del servicio", "Los mensajes del dead-letter topic", "El historial de deploys"]
            answer: 0
            explanation: "Es el trabajo pendiente. Un backlog que crece de forma sostenida indica que los consumidores no dan abasto: métrica clave para alertas y autoscaling."
            skill: eda
            difficulty: 1
          - slug: e2-q6
            type: mcq
            prompt: "Pub/Sub por defecto ofrece entrega:"
            options: ["At-most-once", "At-least-once", "Exactly-once siempre", "Best effort sin reintentos"]
            answer: 1
            explanation: "At-least-once: cada mensaje llega una o más veces. Los duplicados son normales y tu consumidor debe tolerarlos."
            skill: eda
            difficulty: 1
          - slug: e2-q7
            type: mcq
            prompt: "Un push endpoint responde 500 a Pub/Sub. ¿Qué ocurre?"
            options: ["El mensaje se descarta", "Se considera no confirmado y se reintenta más tarde", "Pub/Sub cambia a pull", "Se borra la subscription"]
            answer: 1
            explanation: "Cualquier respuesta que no sea éxito equivale a un 'nack': Pub/Sub reintenta con backoff y, si está configurado, al llegar al máximo de intentos lo manda al dead-letter topic."
            skill: eda
            difficulty: 2
          - slug: e2-q8
            type: order
            prompt: "Ordena el ciclo de vida de un mensaje en una subscription pull:"
            options: ["El publisher publica en el topic", "Pub/Sub guarda una copia por subscription", "El subscriber hace pull y recibe el mensaje con un ackId", "El subscriber procesa", "El subscriber envía ack y el mensaje sale del backlog"]
            answer: [0, 1, 2, 3, 4]
            explanation: "Si el paso de ack no llega antes del deadline, el ciclo vuelve al paso 3 (reentrega)."
            skill: eda
            difficulty: 1

  # ================================================================ NIVEL 3
  - slug: eda-3-journeyman
    number: 3
    title: "Journeyman — Reintentos, DLQ, idempotencia y ordering"
    story: "Una tormenta golpea el puerto: mensajes duplicados, desordenados y algunos envenenados. Aprende a sobrevivir sin perder ni duplicar órdenes."
    quests:
      - slug: eda-3-learn-reliability
        type: learn
        title: Dead-letter, reintentos y semánticas de entrega
        required: true
        estimated_min: 45
        skills: { eda: 0.7, distributed_systems: 0.3 }
        resources:
          - { ref: res-pubsub-dead-letter }
          - { ref: res-pubsub-exactly-once }
        payload:
          note_prompt: "¿Por qué 'exactly-once' de Pub/Sub no te libra de diseñar consumidores idempotentes? Menciona al menos un límite que leíste."

      - slug: eda-3-learn-ordering
        type: learn
        title: Ordering keys e idempotencia
        required: true
        estimated_min: 30
        skills: { eda: 0.7, distributed_systems: 0.3 }
        resources:
          - { ref: res-pubsub-ordering }
        payload:
          note_prompt: "Si los eventos OrderCreated y OrderCancelled de la MISMA orden llegan al revés, ¿qué puede pasar? ¿Cómo lo evitarías con ordering keys y qué costo tiene?"

      - slug: eda-3-glossary
        type: glossary
        title: Vocabulario de confiabilidad
        required: true
        estimated_min: 15
        skills: { eda: 0.7, distributed_systems: 0.3 }
        payload:
          terms: [eda-at-least-once, eda-exactly-once, eda-idempotency, eda-idempotency-key, eda-dead-letter-topic, eda-poison-message, eda-retry-backoff, eda-ordering-key]

      - slug: eda-3-lab-redelivery
        type: lab
        title: "Lab: provoca una reentrega y escribe un consumidor idempotente"
        required: true
        estimated_min: 75
        skills: { eda: 0.7, distributed_systems: 0.2, java: 0.1 }
        payload:
          goal: "Ver con tus ojos que sin ack el mensaje vuelve, y escribir un consumidor que procese cada orden UNA sola vez aunque reciba duplicados."
          steps:
            - title: Prepara el emulador
              body: "Levanta el emulador como en el nivel 2 y define `$base`. Crea el topic `payments` y la subscription `payments-sub` con `ackDeadlineSeconds = 10`."
            - title: Publica y NO hagas ack
              commands:
                - "$data = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{\"paymentId\":\"p-1\",\"orderId\":\"o-100\",\"amount\":120}'))"
                - "Invoke-RestMethod -Method Post -Uri \"$base/topics/payments:publish\" -ContentType 'application/json' -Body (@{ messages = @(@{ data = $data }) } | ConvertTo-Json -Depth 5)"
                - "$r1 = Invoke-RestMethod -Method Post -Uri \"$base/subscriptions/payments-sub:pull\" -ContentType 'application/json' -Body '{\"maxMessages\":10}'; $r1.receivedMessages.message.messageId"
            - title: Espera a que venza el ack deadline y vuelve a hacer pull
              commands:
                - "Start-Sleep -Seconds 15"
                - "$r2 = Invoke-RestMethod -Method Post -Uri \"$base/subscriptions/payments-sub:pull\" -ContentType 'application/json' -Body '{\"maxMessages\":10}'; $r2.receivedMessages | Select-Object deliveryAttempt, @{n='messageId';e={$_.message.messageId}}"
            - title: Escribe IdempotentConsumer.java
              body: "Simula lo que vas a hacer en producción. Crea `IdempotentConsumer.java` que:\n1. Recibe una lista de mensajes `record Msg(String messageId, String paymentId, double amount)` con duplicados (el mismo `paymentId` dos o tres veces).\n2. Antes de procesar, revisa si el `paymentId` (la idempotency key de negocio, NO el messageId) ya está en un `Set<String> processed`.\n3. Si ya está: imprime `SKIP duplicate p-1` y 'hace ack'. Si no: 'cobra', lo agrega al set e imprime `CHARGED p-1 120.0`.\n4. Un mensaje con amount negativo es un 'poison message': después de 3 intentos se mueve a una lista `deadLetters`.\n5. Al final imprime el total cobrado y el contenido de `deadLetters`."
              commands:
                - "java IdempotentConsumer.java"
            - title: Commit
              commands:
                - "git add IdempotentConsumer.java; git commit -m \"event-harbor: idempotent consumer\""
          expected: "El segundo pull devuelve el MISMO messageId (reentrega). Tu programa cobra cada paymentId una sola vez, imprime SKIP para los duplicados y deja el mensaje negativo en deadLetters tras 3 intentos."
          checklist:
            - "Vi el mismo messageId en dos pulls (reentrega por ack deadline)"
            - "Mi consumidor usa una clave de negocio (paymentId) para deduplicar"
            - "Los duplicados no cobran dos veces"
            - "El poison message termina en deadLetters después de 3 intentos"
            - "Puedo explicar por qué en producción el set `processed` debe vivir en una base de datos y no en memoria"
          hints:
            - "¿Por qué no deduplicar por messageId? Porque si el PUBLISHER reintenta, publica un mensaje nuevo con otro messageId pero el mismo pago."
            - "Para los intentos: un `Map<String, Integer> attempts` por paymentId; si attempts ≥ 3, mueve a deadLetters."
          evidence_hint: "Pega los dos messageId del paso 3 y la salida de `java IdempotentConsumer.java`."

      - slug: eda-3-quiz
        type: quiz
        title: Quiz — Confiabilidad
        required: true
        estimated_min: 15
        skills: { eda: 0.7, distributed_systems: 0.3 }
        questions:
          - slug: e3-q1
            type: mcq
            prompt: "¿Qué hace idempotente a un consumidor de pagos?"
            options: ["Hacer ack antes de procesar", "Procesar cada pago una sola vez aunque el mensaje llegue varias veces", "Usar push en lugar de pull", "Activar ordering keys"]
            answer: 1
            explanation: "Idempotente = procesar el mismo mensaje N veces deja el mismo resultado que procesarlo una. Se logra con una clave de deduplicación persistida (paymentId) o con operaciones naturalmente idempotentes (upsert)."
            skill: eda
            difficulty: 1
          - slug: e3-q2
            type: tf
            prompt: "Si activas exactly-once delivery en Pub/Sub, ya no necesitas idempotencia en ningún caso."
            answer: false
            explanation: "La garantía tiene límites (solo pull, misma región, y el publisher puede duplicar al reintentar). Además, tu procesamiento puede fallar después de escribir en la BD y antes del ack."
            skill: eda
            difficulty: 2
          - slug: e3-q3
            type: mcq
            prompt: "Un mensaje con JSON corrupto falla siempre. Sin dead-letter topic, ¿qué pasa?"
            options: ["Se descarta solo", "Se reintenta indefinidamente y consume recursos (poison message)", "Pub/Sub lo corrige", "Se pausa el topic"]
            answer: 1
            explanation: "Un poison message nunca se va a procesar bien. El dead-letter topic con max delivery attempts lo aparta para revisarlo sin bloquear al resto."
            skill: eda
            difficulty: 1
          - slug: e3-q4
            type: mcq
            prompt: "¿Qué garantiza un ordering key?"
            options: ["Orden global de todo el topic", "Orden entre los mensajes con la misma clave, en la misma región", "Que no haya duplicados", "Que los mensajes lleguen más rápido"]
            answer: 1
            explanation: "El orden es por clave (ej. orderId), no global. Las demás claves se procesan en paralelo. Costo: menos throughput por clave y, si un mensaje falla, los siguientes de esa clave esperan."
            skill: eda
            difficulty: 2
          - slug: e3-q5
            type: mcq
            prompt: "¿Por qué usar exponential backoff en los reintentos?"
            options: ["Para reintentar más rápido", "Para no saturar un servicio que ya está fallando y darle tiempo a recuperarse", "Para ordenar los mensajes", "Porque Pub/Sub lo exige"]
            answer: 1
            explanation: "Reintentar inmediatamente y en masa (retry storm) puede tumbar al servicio de nuevo. Esperar 1 s, 2 s, 4 s… (con jitter) reparte la carga."
            skill: distributed_systems
            difficulty: 1
          - slug: e3-q6
            type: mcq
            prompt: "¿Cuál es la mejor clave de idempotencia para un evento PaymentRequested?"
            options: ["El messageId de Pub/Sub", "La hora de recepción", "Un paymentId generado por el emisor en el origen del negocio", "Un número aleatorio generado por el consumidor"]
            answer: 2
            explanation: "El messageId cambia si el publisher reintenta (nuevo mensaje, mismo pago). Una clave de negocio estable identifica la intención, sin importar cuántas veces se envió."
            skill: eda
            difficulty: 2
          - slug: e3-q7
            type: fill
            prompt: "La garantía por defecto de Pub/Sub se llama at-______-once."
            answer: ["least"]
            explanation: "At-least-once: puede haber duplicados, nunca pérdidas (mientras el mensaje esté retenido)."
            skill: eda
            difficulty: 1
          - slug: e3-q8
            type: order
            prompt: "Ordena los pasos de un consumidor idempotente seguro:"
            options: ["Recibir el mensaje", "Leer la clave de idempotencia", "Si ya fue procesada: ack y terminar", "Procesar y guardar la clave en la MISMA transacción que el efecto", "Hacer ack"]
            answer: [0, 1, 2, 3, 4]
            explanation: "Guardar la clave junto con el efecto (misma transacción) evita la ventana en la que procesas pero mueres antes de registrar que lo hiciste. El ack va al final."
            skill: eda
            difficulty: 3
            hint: "El ack siempre va después de que el efecto quedó guardado."

