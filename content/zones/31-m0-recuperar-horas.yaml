      - slug: m0-n2-ejercicio
        type: lab
        title: "Ejercicio — Calculadora del total de un pedido"
        xp: 50
        estimated_min: 120
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-basics, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un programa que calcula el total de un pedido a partir de precios y cantidades, con impuesto y descuento."
          spec:
            context: |
              La tienda arma hoy los totales en una hoja de cálculo y se equivoca cuando hay descuento.
              Ventas pide un programa que reciba los precios y las cantidades de un pedido y devuelva
              el desglose que va en la factura. Por ahora los datos van escritos en el código; leerlos
              del teclado es otra tarea.
            requirements:
              - "`calcularSubtotal(double[] precios, int[] cantidades)` devuelve un `double` con la suma de precio por cantidad de cada producto."
              - "`calcularDescuento(double subtotal)` devuelve un `double` con el monto a descontar, que puede ser `0.0`."
              - "`calcularImpuesto(double base)` devuelve un `double` con el impuesto sobre la base que recibe."
              - "`main` declara los datos, llama a los tres métodos, calcula el total e imprime el desglose en cuatro líneas."
              - "Ningún método de cálculo imprime ni lee datos. Solo `main` escribe en consola."
            inputs:
              - { name: "precios", type: "double[]", desc: "Precio unitario de cada producto, sin impuesto. Posición `i` = producto `i`." }
              - { name: "cantidades", type: "int[]", desc: "Unidades de cada producto. Mismo largo y mismo orden que `precios`." }
            outputs:
              - { name: "Subtotal", type: "double", desc: "Suma de precio × cantidad, antes de descuento e impuesto." }
              - { name: "Descuento", type: "double", desc: "Monto descontado. `0.00` si no aplica." }
              - { name: "Impuesto", type: "double", desc: "Impuesto calculado después de restar el descuento." }
              - { name: "Total", type: "double", desc: "Lo que paga el cliente." }
            rules:
              - "Subtotal = suma de `precios[i] * cantidades[i]` para todas las posiciones."
              - "Descuento = 10 % del subtotal solo si el subtotal es **mayor** que 100.00. Con 100.00 exacto no hay descuento."
              - "Impuesto = 19 % de (subtotal − descuento). El impuesto se calcula después del descuento, no antes."
              - "Total = subtotal − descuento + impuesto."
              - "Las tasas (0.10, 0.19) y el umbral (100.00) son constantes con nombre (`static final`), no números sueltos dentro de las fórmulas."
              - "Los valores se imprimen con dos decimales y punto decimal: `String.format(Locale.US, \"%.2f\", valor)`. Se redondea solo al imprimir, nunca en medio del cálculo."
            examples:
              - title: "Con descuento (subtotal mayor que 100)"
                input: |
                  precios    = {25.00, 40.00, 12.50}
                  cantidades = {2, 1, 4}
                output: |
                  Subtotal: 140.00
                  Descuento: 14.00
                  Impuesto: 23.94
                  Total: 149.94
              - title: "Justo en el umbral (sin descuento)"
                input: |
                  precios    = {50.00}
                  cantidades = {2}
                output: |
                  Subtotal: 100.00
                  Descuento: 0.00
                  Impuesto: 19.00
                  Total: 119.00
            edge_cases:
              - "Arreglos vacíos: las cuatro líneas salen en `0.00`."
              - "Arreglos de distinto largo: `main` lo comprueba antes de calcular, imprime `Error: precios y cantidades deben tener el mismo largo` y termina sin desglose."
              - "Una cantidad en `0` es válida: ese producto suma `0.00`."
            out_of_scope:
              - "Leer datos del teclado o de un archivo."
              - "Precios o cantidades negativas. Las validaciones llegan en el nivel 5."
              - "`BigDecimal`. En un sistema real el dinero no se guarda en `double`; aquí se usa a propósito para practicar tipos primitivos."
          steps:
            - title: "Datos de entrada"
              body: "Guarda precios y cantidades en arreglos. Usa `double` para precios e `int` para cantidades."
            - title: "Métodos"
              body: "Escribe un método para el subtotal, otro para el impuesto y otro para el descuento. Cada uno recibe datos y devuelve un resultado; ninguno imprime."
            - title: "Reglas"
              body: "Aplica un descuento del 10 % si el subtotal pasa de 100. Imprime subtotal, descuento, impuesto y total."
          checklist:
            - "El total sale de recorrer los arreglos con un ciclo"
            - "Hay al menos tres métodos con un tipo de retorno"
            - "El descuento solo se aplica cuando corresponde"

