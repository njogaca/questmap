# Mundo 0 de la ruta plan-2027. Cada nivel: glosario + ejercicio + quiz.
# El ejercicio lleva `proof: commit_or_hours`: solo se entrega con un commit o con horas anotadas.
# Glosario y quiz valen 0 puntos en esta ruta (los puntos salen de horas y commits).
slug: m0-recuperar-horas
title: "Mundo 0 · Recuperar horas"
order: 31
emoji: "⏱️"
track: plan-2027
map: { x: 150, y: 440 }
unlocked_from_start: true
prerequisites: []
skills: [core_java, delivery]
story: >
  Fase 0 del plan: del 16 de noviembre al 31 de diciembre de 2026. Volver a programar todos
  los días con Java puro, sin frameworks. Seis niveles cortos y un jefe el 31 de diciembre:
  una app de consola de pedidos con pruebas.

levels:
  # ================================================================ NIVEL 1
  - slug: m0-n1-entorno
    number: 1
    title: "Entorno"
    story: "Objetivo: dejar la máquina lista para trabajar. JDK, editor, Maven y un repositorio en GitHub."
    quests:
      - slug: m0-n1-glosario
        type: glossary
        title: "Glosario — Entorno"
        xp: 0
        estimated_min: 10
        skills: { delivery: 1.0 }
        payload:
          terms: [g-p0-jdk, g-p0-build-tool, g-p0-dependency, g-p0-repository, g-p0-commit]

      - slug: m0-n1-ejercicio
        type: lab
        title: "Ejercicio — Hola mundo subido al repositorio"
        xp: 50
        estimated_min: 90
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-java-getting-started, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un proyecto Maven que imprime un saludo, subido a un repositorio tuyo en GitHub."
          steps:
            - title: "Instala y comprueba"
              body: "Instala el JDK 21, Maven y tu editor. Comprueba las versiones desde la terminal."
              commands: ["java -version", "mvn -version", "git --version"]
            - title: "Crea el proyecto"
              body: "Crea un proyecto Maven con una clase `Main` que imprima un saludo. Compílalo y ejecútalo."
              commands: ["mvn -q compile exec:java \"-Dexec.mainClass=Main\""]
            - title: "Súbelo a GitHub"
              body: "Crea el repositorio en GitHub, agrega un `.gitignore` que excluya `target/` y sube tu primer commit."
          checklist:
            - "`java -version` y `mvn -version` responden sin error"
            - "El programa imprime el saludo"
            - "El repositorio está en GitHub y `target/` no se subió"

      - slug: m0-n1-quiz
        type: quiz
        title: "Quiz — Entorno"
        xp: 0
        estimated_min: 10
        skills: { delivery: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué incluye el JDK que no necesitas solo para ejecutar un programa ya compilado?"
            options: ["El compilador javac", "La máquina virtual", "Las librerías estándar"]
            answer: 0
            explanation: "Para ejecutar basta la máquina virtual y las librerías. El compilador solo hace falta para programar."
            skill: delivery
            difficulty: 1
          - type: mcq
            prompt: "¿En qué archivo declara Maven las dependencias del proyecto?"
            options: ["build.gradle", "pom.xml", "package.json", "settings.json"]
            answer: 1
            explanation: "pom.xml es el archivo de Maven. build.gradle es de Gradle y package.json es de Node."
            skill: delivery
            difficulty: 1
          - type: tf
            prompt: "La carpeta target de Maven debe subirse al repositorio."
            answer: false
            explanation: "target contiene archivos generados al compilar. Se excluye con .gitignore porque cualquiera puede regenerarla."
            skill: delivery
            difficulty: 1
          - type: mcq
            prompt: "¿Qué orden de comandos lleva un cambio local hasta GitHub?"
            options: ["git push, git commit, git add", "git commit, git add, git push", "git add, git commit, git push"]
            answer: 2
            explanation: "Primero eliges los cambios (add), luego guardas la foto (commit) y al final la envías (push)."
            skill: delivery
            difficulty: 1
          - type: mcq
            prompt: "¿Qué describe mejor un commit?"
            options: ["Una copia de seguridad en la nube", "Una foto del proyecto con un mensaje", "Una rama nueva del proyecto"]
            answer: 1
            explanation: "Un commit guarda el estado del proyecto en un momento dado y explica qué cambió."
            skill: delivery
            difficulty: 1

  # ================================================================ NIVEL 2
  - slug: m0-n2-fundamentos
    number: 2
    title: "Tipos, condiciones, ciclos y métodos"
    story: "Objetivo: escribir lógica básica en Java sin mirar apuntes. Variables con tipo, if, for y métodos propios."
    quests:
      - slug: m0-n2-glosario
        type: glossary
        title: "Glosario — Fundamentos del lenguaje"
        xp: 0
        estimated_min: 10
        skills: { core_java: 1.0 }
        payload:
          terms: [g-p0-variable, g-p0-primitive-type, g-p0-loop, g-p0-method]

      - slug: m0-n2-ejercicio
        type: lab
        title: "Ejercicio — Calculadora del total de un pedido"
        xp: 50
        estimated_min: 120
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-basics, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un programa que calcula el total de un pedido a partir de precios y cantidades, con impuesto y descuento."
          steps:
            - title: "Datos de entrada"
              body: "Guarda precios y cantidades en arreglos. Usa `double` para precios e `int` para cantidades."
            - title: "Métodos"
              body: "Escribe un método para el subtotal, otro para el impuesto y otro para el descuento. Cada uno recibe datos y devuelve un resultado; ninguno imprime."
            - title: "Reglas"
              body: "Aplica un descuento del 10 % si el subtotal pasa de 100. Imprime subtotal, descuento, impuesto y total."
          checklist:
            - "El total sale de recorrer los arreglos con un ciclo"
            - "Hay al menos tres métodos con un tipo de retorno"
            - "El descuento solo se aplica cuando corresponde"

      - slug: m0-n2-quiz
        type: quiz
        title: "Quiz — Fundamentos del lenguaje"
        xp: 0
        estimated_min: 12
        skills: { core_java: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué tipo usarías para guardar la cantidad de unidades de un producto?"
            options: ["double", "int", "boolean", "String"]
            answer: 1
            explanation: "Una cantidad de unidades es un número entero. double es para decimales."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Cuánto vale 7 / 2 en Java si los dos números son int?"
            options: ["3.5", "4", "3"]
            answer: 2
            explanation: "La división entre enteros descarta los decimales. Para obtener 3.5 al menos uno debe ser double."
            skill: core_java
            difficulty: 2
          - type: tf
            prompt: "Un método declarado como void devuelve un valor."
            answer: false
            explanation: "void significa que el método no devuelve nada."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Qué ciclo conviene para recorrer todos los elementos de un arreglo?"
            options: ["for", "if", "switch"]
            answer: 0
            explanation: "for repite un bloque para cada elemento. if y switch deciden, no repiten."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Cómo se comparan dos textos (String) por su contenido?"
            options: ["Con ==", "Con equals", "Con ="]
            answer: 1
            explanation: "equals compara el contenido. == compara si son el mismo objeto y = asigna."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué comando de Maven compila el proyecto?"
            options: ["mvn compile", "mvn start", "mvn java"]
            answer: 0
            explanation: "mvn compile compila el código de src/main/java."
            skill: delivery
            difficulty: 1
          - type: tf
            prompt: "Repaso. git commit envía los cambios a GitHub."
            answer: false
            explanation: "commit guarda la foto en tu máquina. Quien la envía a GitHub es git push."
            skill: delivery
            difficulty: 1

  # ================================================================ NIVEL 3
  - slug: m0-n3-clases
    number: 3
    title: "Clases, objetos e interfaces"
    story: "Objetivo: modelar un problema con clases propias en lugar de variables sueltas."
    quests:
      - slug: m0-n3-glosario
        type: glossary
        title: "Glosario — Objetos"
        xp: 0
        estimated_min: 10
        skills: { core_java: 1.0 }
        payload:
          terms: [g-p0-class, g-p0-object, g-p0-constructor, g-p0-interface, g-p0-encapsulation]

      - slug: m0-n3-ejercicio
        type: lab
        title: "Ejercicio — Clases Pedido, Producto y Cliente"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-classes, required: false }
        payload:
          proof: commit_or_hours
          goal: "Tres clases que representan el dominio de pedidos, con sus datos protegidos y un total calculado por el propio pedido."
          steps:
            - title: "Producto y Cliente"
              body: "Crea `Producto` (nombre, precio) y `Cliente` (nombre, correo). Campos `private`, constructor que valide y métodos de lectura."
            - title: "Pedido"
              body: "Crea `Pedido` con un cliente y sus líneas (producto y cantidad). El método `total()` lo calcula el pedido; nadie suma desde fuera."
            - title: "Una interfaz"
              body: "Define una interfaz `Descuento` con un método que reciba el subtotal. Escribe dos implementaciones y aplícalas a un pedido."
          checklist:
            - "Ningún campo es público"
            - "Un precio negativo se rechaza en el constructor"
            - "El pedido acepta cualquier implementación de `Descuento`"

      - slug: m0-n3-quiz
        type: quiz
        title: "Quiz — Objetos"
        xp: 0
        estimated_min: 12
        skills: { core_java: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Cuál es la diferencia entre una clase y un objeto?"
            options: ["Son lo mismo", "La clase es el molde y el objeto es una pieza concreta", "El objeto es el molde y la clase es la pieza"]
            answer: 1
            explanation: "La clase define; el objeto es una instancia creada con new."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Para qué se marca un campo como private?"
            options: ["Para que ocupe menos memoria", "Para que solo la propia clase pueda cambiarlo", "Para que no se pueda leer nunca"]
            answer: 1
            explanation: "private obliga a pasar por los métodos de la clase, que pueden validar el cambio."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Una interfaz dice qué métodos existen, pero no guarda el estado del objeto."
            answer: true
            explanation: "La interfaz es un contrato. El estado vive en las clases que la implementan."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "¿Cuándo se ejecuta el constructor?"
            options: ["Al compilar", "Al crear el objeto con new", "Al terminar el programa"]
            answer: 1
            explanation: "El constructor corre una vez por objeto, en el momento de crearlo."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "Un método recibe un parámetro de tipo Descuento, que es una interfaz. ¿Qué puedes pasarle?"
            options: ["Solo un objeto llamado Descuento", "Cualquier objeto cuya clase implemente Descuento", "Cualquier objeto"]
            answer: 1
            explanation: "Eso es polimorfismo: el método funciona con cualquier implementación del contrato."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué palabra hace que un método devuelva un resultado?"
            options: ["return", "void", "break"]
            answer: 0
            explanation: "return entrega el valor y termina el método."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Repaso. double puede guardar números con decimales."
            answer: true
            explanation: "double es el tipo primitivo habitual para decimales."
            skill: core_java
            difficulty: 1

  # ================================================================ NIVEL 4
  - slug: m0-n4-colecciones
    number: 4
    title: "Colecciones y genéricos"
    story: "Objetivo: guardar y consultar muchos objetos con la colección adecuada para cada caso."
    quests:
