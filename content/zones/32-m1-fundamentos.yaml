  # ================================================================ NIVEL 5
  - slug: m1-n5-validacion
    number: 5
    title: "Validación y manejo de errores"
    story: "Objetivo: que la API rechace datos malos y explique el motivo de forma clara y uniforme."
    quests:
      - slug: m1-n5-glosario
        type: glossary
        title: "Glosario — Validación y errores"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-validation, g-p1-bad-request, g-p1-exception-handler, g-p1-problem-details]

      - slug: m1-n5-ejercicio
        type: lab
        title: "Ejercicio — Respuestas de error claras"
        xp: 50
        estimated_min: 150
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-spring-errors, required: false }
        payload:
          proof: commit_or_hours
          goal: "Entradas validadas y todos los errores de la API con el mismo formato."
          spec:
            context: |
              El equipo web abrió un ticket: mandaron un pedido con cantidad `-3`, la API respondió
              `201` y el total salió negativo. Otro día recibieron un `500` con un stack trace de
              Hibernate en el cuerpo. Piden dos cosas: que la API rechace los datos malos, y que
              todos los errores tengan la misma forma para tratarlos con un solo bloque de código.
            requirements:
              - "`POST /orders` y `PUT /orders/{id}` validan el cuerpo antes de llegar al servicio."
              - "Un cuerpo inválido responde `400` con la lista de todos los campos que fallaron, no solo el primero."
              - "Todos los errores de la API (400, 404, 405, 500) responden con formato Problem Details (RFC 9457) y `Content-Type: application/problem+json`."
              - "Una sola clase con `@RestControllerAdvice` convierte las excepciones en respuestas. Los controladores no tienen `try/catch`."
              - "Un pedido inexistente lanza una excepción propia, `OrderNotFoundException`, que el manejador convierte en `404`."
            inputs:
              - { name: "customerEmail", type: "string", desc: "Obligatorio, con formato de correo, máximo 255 caracteres." }
              - { name: "items", type: "array", desc: "Obligatorio, con al menos 1 línea y máximo 50." }
              - { name: "items[].sku", type: "string", desc: "Obligatorio, no en blanco, máximo 40 caracteres." }
              - { name: "items[].productName", type: "string", desc: "Obligatorio, no en blanco, máximo 120 caracteres." }
              - { name: "items[].unitPrice", type: "number", desc: "Obligatorio, mayor que `0`, máximo dos decimales." }
              - { name: "items[].quantity", type: "integer", desc: "Obligatorio, entre `1` y `1000`." }
            outputs:
              - { name: "type", type: "string (URI)", desc: "Identifica el tipo de problema. `about:blank` si no hay uno específico." }
              - { name: "title", type: "string", desc: "Resumen corto y fijo para ese tipo de error." }
              - { name: "status", type: "integer", desc: "El mismo código HTTP de la respuesta." }
              - { name: "detail", type: "string", desc: "Explicación de este caso concreto, pensada para quien integra." }
              - { name: "instance", type: "string", desc: "La ruta que se pidió." }
              - { name: "errors", type: "array", desc: "Solo en los `400` de validación: objetos con `field` y `message`." }
            rules:
              - "Las reglas van como anotaciones de Bean Validation en `OrderRequest` (`@NotBlank`, `@Email`, `@Size`, `@Positive`, `@Min`, `@Valid` en la lista)."
              - "Ninguna respuesta incluye stack trace, nombres de clases Java ni texto SQL."
              - "Un error inesperado responde `500` con un `detail` genérico. El detalle real va al log del servidor, con el stack trace."
              - "Un pedido rechazado no se guarda."
              - "El nombre de `field` usa la ruta del JSON, por ejemplo `items[0].quantity`."
            examples:
              - title: "Pedido con dos campos inválidos"
                input: |
                  POST /orders
                  Content-Type: application/json

                  {
                    "customerEmail": "no-es-un-correo",
                    "items": [
                      { "sku": "KB-001", "productName": "Teclado", "unitPrice": 40.00, "quantity": 0 }
                    ]
                  }
                output: |
                  HTTP/1.1 400
                  Content-Type: application/problem+json

                  {
                    "type": "about:blank",
                    "title": "Bad Request",
                    "status": 400,
                    "detail": "Validation failed for 2 fields",
                    "instance": "/orders",
                    "errors": [
                      { "field": "customerEmail", "message": "must be a well-formed email address" },
                      { "field": "items[0].quantity", "message": "must be greater than or equal to 1" }
                    ]
                  }
              - title: "Pedido inexistente"
                input: |
                  GET /orders/00000000-0000-0000-0000-000000000000
                output: |
                  HTTP/1.1 404
                  Content-Type: application/problem+json

                  {
                    "type": "about:blank",
                    "title": "Not Found",
                    "status": 404,
                    "detail": "Order 00000000-0000-0000-0000-000000000000 not found",
                    "instance": "/orders/00000000-0000-0000-0000-000000000000"
                  }
            edge_cases:
              - "JSON mal formado (falta una llave): `400` con Problem Details, no `500`."
              - "`items` vacío (`[]`) o ausente: `400` con el campo `items` en `errors`."
              - "`quantity` enviado como texto (`\"dos\"`): `400`."
              - "Un id que no es UUID: `400` con el mismo formato."
              - "Cuerpo vacío en `POST /orders`: `400`."
            out_of_scope:
              - "Mensajes de error traducidos. Van en inglés, como los trae Bean Validation."
              - "Comprobar que el `sku` existe en un catálogo."
              - "Autenticación. Es el nivel 10."
          steps:
            - title: "Valida la entrada"
              body: "Agrega reglas al cuerpo de `POST /orders`: al menos una línea, cantidad mayor que cero y cliente obligatorio."
            - title: "Un solo manejador"
              body: "Crea una clase con `@RestControllerAdvice` que convierta las excepciones en respuestas con formato Problem Details."
            - title: "Sin fugas"
              body: "Comprueba que ningún error devuelve el stack trace al cliente."
          checklist:
            - "Un pedido inválido responde 400 y dice qué campo falló"
            - "Un id inexistente responde 404 con el mismo formato"
            - "Ninguna respuesta muestra el stack trace"

      - slug: m1-n5-quiz
        type: quiz
        title: "Quiz — Validación y errores"
        xp: 0
