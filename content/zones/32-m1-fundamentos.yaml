# Mundo 1 de la ruta plan-2027. Misma forma que el Mundo 0: glosario + ejercicio + quiz por nivel.
# Todo el mundo construye un solo proyecto: OrderBridge, un servicio de pedidos.
slug: m1-fundamentos
title: "Mundo 1 · Fundamentos"
order: 32
emoji: "🧱"
track: plan-2027
map: { x: 340, y: 300 }
unlocked_from_start: false
prerequisites:
  - { zone: m0-recuperar-horas, level: 7 }
skills: [spring_api, sql_data, delivery]
story: >
  Fase 1 del plan: de enero a marzo de 2027. El mismo dominio de pedidos, ahora como un
  servicio de verdad: Spring Boot, PostgreSQL, pruebas, Docker y CI. Doce niveles y un jefe
  el 15 de marzo: la etapa 1 de OrderBridge publicada en GitHub. Se abre al vencer al jefe
  del Mundo 0.

levels:
  # ================================================================ NIVEL 1
  - slug: m1-n1-spring-boot
    number: 1
    title: "Spring Boot, primer endpoint"
    story: "Objetivo: levantar un servicio Spring Boot y responder una petición HTTP."
    quests:
      - slug: m1-n1-glosario
        type: glossary
        title: "Glosario — Spring Boot"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-framework, g-p1-endpoint, g-p1-controller, g-p1-dependency-injection]

      - slug: m1-n1-ejercicio
        type: lab
        title: "Ejercicio — GET de estado del servicio"
        xp: 50
        estimated_min: 120
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-boot-first-app, required: false }
        payload:
          proof: commit_or_hours
          goal: "El proyecto OrderBridge creado con Spring Boot y un endpoint `GET /status` que responde con el nombre y el estado del servicio."
          steps:
            - title: "Crea el proyecto"
              body: "Genera un proyecto Spring Boot con Maven y la dependencia web. Arráncalo."
              commands: ["mvn spring-boot:run"]
            - title: "El endpoint"
              body: "Crea un controlador con `GET /status` que devuelva un JSON con `service` y `status`."
              commands: ["curl http://localhost:8080/status"]
            - title: "Repositorio"
              body: "Crea el repositorio `orderbridge` en GitHub y sube este primer avance."
          checklist:
            - "El servicio arranca sin errores"
            - "`GET /status` responde 200 con un JSON"
            - "El código está en el repositorio"

      - slug: m1-n1-quiz
        type: quiz
        title: "Quiz — Spring Boot"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué anotación convierte una clase en un controlador que devuelve datos y no páginas?"
            options: ["@Service", "@RestController", "@Entity"]
            answer: 1
            explanation: "@RestController recibe peticiones y serializa la respuesta, normalmente a JSON."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿En qué puerto escucha Spring Boot si no configuras nada?"
            options: ["8080", "80", "3000"]
            answer: 0
            explanation: "El valor por defecto es 8080. Se cambia con server.port."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Con inyección de dependencias, cada clase crea con new los objetos que necesita."
            answer: false
            explanation: "Es al revés: Spring construye los objetos y se los entrega a la clase."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué hace @SpringBootApplication en la clase principal?"
            options: ["Crea la base de datos", "Activa la configuración automática y la búsqueda de componentes", "Publica el servicio en internet"]
            answer: 1
            explanation: "Es el punto de arranque: configura Spring según las dependencias y encuentra tus clases."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué define a un endpoint?"
            options: ["Solo la ruta", "El método HTTP y la ruta", "El nombre de la clase"]
            answer: 1
            explanation: "GET /status y POST /status son endpoints distintos."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 2
  - slug: m1-n2-rest
    number: 2
    title: "REST completo"
    story: "Objetivo: exponer las cuatro operaciones básicas sobre pedidos con los métodos y códigos HTTP correctos."
    quests:
      - slug: m1-n2-glosario
        type: glossary
        title: "Glosario — REST"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-rest, g-p1-http-method, g-p1-status-code, g-p1-request-body]

      - slug: m1-n2-ejercicio
        type: lab
        title: "Ejercicio — Crear, leer, actualizar y borrar pedidos"
        xp: 50
        estimated_min: 180
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-spring-rest, required: false }
        payload:
          proof: commit_or_hours
          goal: "Los endpoints de `/orders` para crear, leer, actualizar y borrar, con los pedidos guardados en memoria por ahora."
          steps:
            - title: "Capas"
              body: "Separa controlador, servicio y un almacén en memoria. El controlador no tiene reglas de negocio."
            - title: "Los cinco endpoints"
              body: "`POST /orders`, `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}` y `DELETE /orders/{id}`."
            - title: "Códigos"
              body: "Crear responde 201, borrar responde 204 y un id inexistente responde 404."
          checklist:
            - "Los cinco endpoints responden"
            - "Los códigos HTTP son los correctos"
            - "El controlador solo delega en el servicio"

      - slug: m1-n2-quiz
        type: quiz
        title: "Quiz — REST"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué código devuelve un POST que creó un pedido?"
            options: ["200", "201", "204"]
            answer: 1
            explanation: "201 Created indica que se creó un recurso nuevo."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué método HTTP se usa para borrar el pedido 7?"
            options: ["DELETE /orders/7", "GET /orders/7/delete", "POST /orders/delete"]
            answer: 0
            explanation: "En REST el verbo va en el método, no en la ruta."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Llamar dos veces al mismo GET debe dejar los datos igual que llamarlo una vez."
            answer: true
            explanation: "GET solo lee. No debe cambiar nada en el servidor."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "Piden el pedido 99 y no existe. ¿Qué respondes?"
            options: ["200 con cuerpo vacío", "500", "404"]
            answer: 2
            explanation: "404 dice que el recurso no existe. 500 sería un fallo del servidor, que no es el caso."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación toma el id de la ruta /orders/{id}?"
            options: ["@RequestBody", "@PathVariable", "@Autowired"]
            answer: 1
            explanation: "@PathVariable lee partes de la ruta. @RequestBody lee el cuerpo."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Quién construye los objetos que un controlador necesita?"
            options: ["El propio controlador con new", "Spring", "El navegador"]
            answer: 1
            explanation: "Eso es la inyección de dependencias."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. @RestController devuelve datos, normalmente en JSON."
            answer: true
            explanation: "Spring serializa el objeto de retorno a JSON."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 3
  - slug: m1-n3-jpa
    number: 3
    title: "PostgreSQL con JPA"
    story: "Objetivo: que los pedidos sobrevivan a un reinicio, guardados en PostgreSQL."
    quests:
      - slug: m1-n3-glosario
        type: glossary
        title: "Glosario — Persistencia"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-entity, g-p1-orm, g-p1-primary-key, g-p1-migration]

      - slug: m1-n3-ejercicio
        type: lab
        title: "Ejercicio — Pedidos guardados en base de datos"
        xp: 50
        estimated_min: 180
        skills: { sql_data: 1.0 }
        resources:
          - { ref: res-p-spring-jpa, required: false }
        payload:
          proof: commit_or_hours
          goal: "El almacén en memoria reemplazado por PostgreSQL con Spring Data JPA."
          steps:
            - title: "Base de datos"
              body: "Levanta PostgreSQL en local y configura la conexión en el proyecto."
            - title: "Entidades y repositorio"
              body: "Convierte `Order` y sus líneas en entidades. Crea un repositorio de Spring Data y úsalo desde el servicio."
            - title: "Esquema versionado"
              body: "Crea las tablas con una migración de Flyway en lugar de dejar que Hibernate las genere."
          checklist:
            - "Los pedidos siguen ahí después de reiniciar el servicio"
            - "Las tablas se crean con una migración"
            - "Los endpoints del nivel 2 siguen funcionando igual"

      - slug: m1-n3-quiz
        type: quiz
        title: "Quiz — Persistencia"
        xp: 0
        estimated_min: 12
        skills: { sql_data: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué anotación marca una clase como tabla en JPA?"
            options: ["@Entity", "@Table", "@Repository"]
            answer: 0
            explanation: "@Entity hace que JPA la trate como tabla. @Table solo ajusta el nombre."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación marca el campo que es clave primaria?"
            options: ["@Key", "@Primary", "@Id"]
            answer: 2
            explanation: "@Id identifica la clave primaria de la entidad."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Con Spring Data JPA tienes que escribir a mano la implementación de findById."
            answer: false
            explanation: "Basta declarar la interfaz del repositorio. Spring genera la implementación."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "¿Por qué usar migraciones en lugar de dejar que Hibernate cree las tablas?"
            options: ["Porque es más rápido al arrancar", "Porque cada cambio del esquema queda versionado y repetible", "Porque Hibernate no puede crear tablas"]
            answer: 1
            explanation: "Con migraciones todos los entornos pasan por los mismos cambios, en el mismo orden."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Un pedido tiene muchas líneas. ¿Qué relación es desde el pedido?"
            options: ["@ManyToOne", "@OneToMany", "@OneToOne"]
            answer: 1
            explanation: "Un pedido, muchas líneas. Desde la línea hacia el pedido es @ManyToOne."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué código responde un DELETE correcto que no devuelve contenido?"
            options: ["204", "201", "404"]
            answer: 0
            explanation: "204 No Content: salió bien y no hay cuerpo."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. PUT sirve para reemplazar un recurso existente."
            answer: true
            explanation: "PUT envía la versión completa del recurso."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 4
  - slug: m1-n4-sql
    number: 4
    title: "SQL a mano"
    story: "Objetivo: leer y escribir SQL sin depender del ORM, y saber cuándo una consulta es lenta."
    quests:
      - slug: m1-n4-glosario
        type: glossary
        title: "Glosario — SQL"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-join, g-p1-foreign-key, g-p1-index, g-p1-query-plan]

      - slug: m1-n4-ejercicio
        type: lab
        title: "Ejercicio — Consultas con joins e índices"
        xp: 50
        estimated_min: 180
        skills: { sql_data: 1.0 }
        resources:
          - { ref: res-p-spring-jdbc, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un archivo `queries.sql` con consultas escritas a mano sobre pedidos, y un índice justificado con el plan de la consulta."
          steps:
            - title: "Consultas"
              body: "Escribe cinco consultas: pedidos con su cliente, total por cliente, los tres productos más vendidos, clientes sin pedidos y pedidos de los últimos 7 días."
            - title: "Mide"
              body: "Carga datos de prueba suficientes y mira el plan de una consulta lenta con `EXPLAIN ANALYZE`."
            - title: "Índice"
              body: "Agrega un índice con una migración, vuelve a medir y anota el antes y el después en el README."
          checklist:
            - "Las cinco consultas devuelven el resultado correcto"
            - "Hay al menos un `JOIN` y un `GROUP BY`"
            - "El índice está en una migración y su efecto está anotado"

      - slug: m1-n4-quiz
        type: quiz
        title: "Quiz — SQL"
        xp: 0
        estimated_min: 12
        skills: { sql_data: 1.0 }
        questions:
          - type: mcq
            prompt: "Quieres todos los clientes, tengan pedidos o no. ¿Qué join usas desde clientes?"
            options: ["INNER JOIN", "LEFT JOIN", "CROSS JOIN"]
            answer: 1
            explanation: "LEFT JOIN conserva todas las filas de la tabla izquierda aunque no tengan pareja."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "¿Qué cláusula agrupa filas para calcular un total por cliente?"
            options: ["ORDER BY", "GROUP BY", "WHERE"]
            answer: 1
            explanation: "GROUP BY junta las filas de cada cliente para aplicar SUM o COUNT."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Un índice acelera las lecturas y no tiene ningún costo."
            answer: false
            explanation: "Cada índice hay que mantenerlo en cada escritura y ocupa espacio."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "¿Qué comando muestra cómo PostgreSQL va a ejecutar una consulta?"
            options: ["SHOW", "DESCRIBE", "EXPLAIN"]
            answer: 2
            explanation: "EXPLAIN muestra el plan. Con ANALYZE además la ejecuta y mide."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "¿Qué impide una clave foránea?"
            options: ["Que una línea apunte a un pedido que no existe", "Que haya dos pedidos el mismo día", "Que la tabla crezca demasiado"]
            answer: 0
            explanation: "La base rechaza referencias a filas inexistentes."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "Repaso. ¿Qué es una entidad en JPA?"
            options: ["Una consulta guardada", "Una clase que representa una tabla", "Un índice"]
            answer: 1
            explanation: "Cada objeto de la entidad es una fila."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Repaso. Una migración es un cambio de esquema versionado en el repositorio."
            answer: true
            explanation: "Así todos los entornos aplican los mismos cambios."
            skill: sql_data
            difficulty: 1

  # ================================================================ NIVEL 5
  - slug: m1-n5-validacion
    number: 5
    title: "Validación y manejo de errores"
    story: "Objetivo: que la API rechace datos malos y explique el motivo de forma clara y uniforme."
    quests:
      - slug: m1-n5-glosario
        type: glossary
        title: "Glosario — Validación y errores"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-validation, g-p1-bad-request, g-p1-exception-handler, g-p1-problem-details]

      - slug: m1-n5-ejercicio
        type: lab
        title: "Ejercicio — Respuestas de error claras"
        xp: 50
        estimated_min: 150
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-spring-errors, required: false }
        payload:
          proof: commit_or_hours
          goal: "Entradas validadas y todos los errores de la API con el mismo formato."
          steps:
            - title: "Valida la entrada"
              body: "Agrega reglas al cuerpo de `POST /orders`: al menos una línea, cantidad mayor que cero y cliente obligatorio."
            - title: "Un solo manejador"
              body: "Crea una clase con `@RestControllerAdvice` que convierta las excepciones en respuestas con formato Problem Details."
            - title: "Sin fugas"
              body: "Comprueba que ningún error devuelve el stack trace al cliente."
          checklist:
            - "Un pedido inválido responde 400 y dice qué campo falló"
            - "Un id inexistente responde 404 con el mismo formato"
            - "Ninguna respuesta muestra el stack trace"

      - slug: m1-n5-quiz
        type: quiz
        title: "Quiz — Validación y errores"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "El cliente envía un pedido sin líneas. ¿Qué código corresponde?"
            options: ["500", "400", "404"]
            answer: 1
            explanation: "400: la petición está mal y es responsabilidad de quien la envió."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación activa la validación del cuerpo de la petición?"
            options: ["@Valid", "@Check", "@Verify"]
            answer: 0
            explanation: "@Valid junto a @RequestBody hace que Spring aplique las reglas del objeto."
            skill: spring_api
            difficulty: 2
          - type: tf
            prompt: "Devolver el stack trace al cliente ayuda y no tiene riesgo."
            answer: false
            explanation: "Expone detalles internos del sistema. Va al log, no a la respuesta."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Dónde conviene convertir las excepciones en respuestas HTTP?"
            options: ["En cada método del controlador", "En un manejador central con @RestControllerAdvice", "En el repositorio"]
            answer: 1
            explanation: "Un manejador central garantiza el mismo formato en toda la API."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué diferencia hay entre un 400 y un 500?"
            options: ["Ninguna", "400 es error de quien llama y 500 es error del servidor", "400 es más grave"]
            answer: 1
            explanation: "Los 4xx los corrige el cliente; los 5xx los corriges tú."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "Repaso. ¿Qué join conserva las filas sin pareja de la tabla izquierda?"
            options: ["LEFT JOIN", "INNER JOIN", "Ninguno"]
            answer: 0
            explanation: "LEFT JOIN rellena con NULL lo que falta del lado derecho."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Repaso. EXPLAIN sirve para ver el plan de una consulta."
            answer: true
            explanation: "Muestra los pasos que la base eligió."
            skill: sql_data
            difficulty: 1

  # ================================================================ NIVEL 6
  - slug: m1-n6-integracion
    number: 6
    title: "Pruebas de integración"
    story: "Objetivo: probar la API de punta a punta contra un PostgreSQL de verdad, no contra uno simulado."
    quests:
      - slug: m1-n6-glosario
        type: glossary
        title: "Glosario — Pruebas de integración"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-integration-test, g-p1-test-container, g-p1-test-fixture, g-p1-flaky-test]

      - slug: m1-n6-ejercicio
        type: lab
        title: "Ejercicio — Pruebas contra una base de datos real"
        xp: 50
        estimated_min: 180
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-boot-testcontainers, required: false }
        payload:
          proof: commit_or_hours
          goal: "Pruebas de integración que arrancan el servicio y un PostgreSQL en contenedor, y recorren los endpoints de pedidos."
          steps:
            - title: "Testcontainers"
              body: "Agrega Testcontainers y configura un contenedor de PostgreSQL para las pruebas."
            - title: "Camino feliz"
              body: "Prueba crear un pedido, leerlo, actualizarlo y borrarlo a través de HTTP."
            - title: "Errores"
              body: "Prueba el 400 de un pedido inválido y el 404 de un id inexistente. Cada prueba prepara sus propios datos."
          checklist:
            - "Las pruebas corren con `mvn verify` sin una base instalada a mano"
            - "Hay pruebas del camino feliz y de los errores"
            - "Las pruebas pasan en cualquier orden"

      - slug: m1-n6-quiz
        type: quiz
        title: "Quiz — Pruebas de integración"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué comprueba una prueba de integración que una unitaria no?"
            options: ["La sintaxis del código", "Que varias piezas funcionan juntas", "La velocidad del compilador"]
            answer: 1
            explanation: "Ejercita el endpoint, el servicio y la base reales a la vez."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Por qué probar contra PostgreSQL real y no contra una base en memoria distinta?"
            options: ["Porque es más rápido", "Porque el SQL y los tipos pueden comportarse distinto", "Porque es obligatorio en Spring"]
            answer: 1
            explanation: "Una base distinta puede aceptar cosas que la real rechaza, y al revés."
            skill: spring_api
            difficulty: 2
          - type: tf
            prompt: "Una prueba que a veces pasa y a veces falla sin cambios de código se puede ignorar."
            answer: false
            explanation: "Una prueba inestable esconde un problema real y hace que nadie confíe en el resultado."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación arranca el contexto completo de Spring en una prueba?"
            options: ["@SpringBootTest", "@Test", "@Mock"]
            answer: 0
            explanation: "@SpringBootTest levanta la aplicación como en ejecución normal."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué hace que las pruebas no dependan unas de otras?"
            options: ["Correrlas siempre en el mismo orden", "Que cada una prepare y limpie sus datos", "Tener solo una prueba"]
            answer: 1
            explanation: "Si cada prueba arma su propio estado, el orden deja de importar."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué formato estándar se usa para el cuerpo de un error?"
            options: ["Problem Details", "CSV", "Texto libre"]
            answer: 0
            explanation: "Es un JSON con title, status y detail."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. Un pedido con cantidad cero debe responder 400."
            answer: true
            explanation: "Es un dato inválido enviado por el cliente."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 7
  - slug: m1-n7-transacciones
    number: 7
    title: "Transacciones"
    story: "Objetivo: que una operación de varios pasos quede completa o no quede."
    quests:
      - slug: m1-n7-glosario
        type: glossary
        title: "Glosario — Transacciones"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-transaction, g-p1-rollback, g-p1-atomicity, g-p1-isolation]

      - slug: m1-n7-ejercicio
        type: lab
        title: "Ejercicio — Pedido con varios productos, todo o nada"
