      - slug: arena-3-learn-ai
        type: learn
        title: Uso responsable de asistentes de IA en el desarrollo
        required: true
        estimated_min: 45
        skills:
          ai_tools: 1
        resources:
          - ref: res-claude-code-best-practices
          - ref: res-copilot-best-practices
          - ref: res-owasp-llm-top10
            required: false
        payload:
          note_prompt: "Describe en 5 líneas TU proceso para aceptar código generado por IA en order-platform: qué le das como contexto, cómo lo verificas, qué nunca le pegas y cuándo lo descartas."
          summary_md: |
            La oferta menciona herramientas de IA. En la entrevista no basta con decir "uso Copilot o Claude": quieren ver **criterio**.

            Lo que hace un ingeniero responsable:
            - **Da contexto y una forma de verificar:** pruebas que deben pasar, el estilo del repo, las restricciones ("no new dependencies").
            - **Entiende antes de aceptar:** si no puedes explicar el código, no lo subes.
            - **Verifica con herramientas, no con fe:** tests, linters, revisión de seguridad, correr el código. La IA puede inventar APIs, versiones o flags (**alucinaciones**).
            - **Cuida los datos:** nunca pegas secretos, datos de clientes ni código confidencial en una herramienta no aprobada por la empresa.
            - **Revisa con más cuidado lo crítico:** autenticación, dinero, concurrencia, SQL, manejo de errores.
            - **Es transparente:** en un code review dices qué parte generó la IA si es relevante.

            Respuesta modelo (adáptala): "I use AI assistants to speed up boilerplate, tests and exploration, but I treat their output like a pull request from a new teammate: I read it, I run the tests, and I check edge cases and security. For example, in my capstone project the assistant generated a Pub/Sub consumer that acknowledged messages before processing them; my idempotency test caught it."
      - slug: arena-3-open-ai-review
        type: open_answer
        title: Revisa código generado por IA
        required: true
        estimated_min: 30
        skills:
          ai_tools: 0.6
          java: 0.2
          english: 0.2
        payload:
          prompt_en: |
            An AI assistant generated this Pub/Sub consumer for the payments service. Review it as if it were a pull request: list every problem you find (correctness, reliability, security, testing), explain the risk of each one, and show how you would fix the most important ones.

            ```java
            MessageReceiver receiver = (message, consumer) -> {
                consumer.ack();
                String json = message.getData().toStringUtf8();
                log.info("Received payment: " + json);
                Payment p = new ObjectMapper().readValue(json, Payment.class);
                jdbc.update("INSERT INTO payments VALUES ('" + p.id() + "', " + p.amount() + ")");
                paymentGateway.charge(p.cardNumber(), p.amount());
            };
            ```
          rubric:
            - correctness
            - depth
            - clarity
            - tradeoffs
      - slug: arena-3-quiz
