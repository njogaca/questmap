      - slug: m1-n12-ejercicio
        type: lab
        title: "Ejercicio — Entrevista simulada completa"
        xp: 50
        estimated_min: 90
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-boot-reference, required: false }
        payload:
          proof: commit_or_hours
          goal: "Una entrevista simulada de una hora sobre OrderBridge, en inglés, con sus fallos anotados en el repositorio."
          spec:
            context: |
              En una entrevista técnica real te van a pedir que expliques un proyecto tuyo y van a
              tirar del hilo: por qué esa decisión, qué pasa si falla esto, cómo lo probarías.
              Haber construido OrderBridge no garantiza saber explicarlo en inglés y con el reloj
              corriendo. Este ejercicio encuentra los huecos antes que un entrevistador.
            requirements:
              - "Una sesión de entrevista simulada de 45 a 60 minutos, toda en inglés, hablada y sin leer apuntes."
              - "La sesión cubre los siete temas de la tabla de entradas, con al menos dos preguntas por tema."
              - "Durante la sesión o justo al terminar, se anota cada pregunta que no se respondió bien."
              - "El archivo `docs/mock-interview.md` registra la fecha, la duración, quién o qué entrevistó, y al menos cinco preguntas falladas."
              - "Cada pregunta fallada lleva cuatro partes: la pregunta, lo que respondiste, qué estuvo mal o faltó, y la respuesta corregida en inglés."
              - "El archivo cierra con una lista de tres temas para repasar antes del jefe."
            inputs:
              - { name: "REST", type: "tema", desc: "Métodos, códigos de estado, idempotencia, por qué `201` y `Location`." }
              - { name: "Persistencia", type: "tema", desc: "JPA, relaciones, carga perezosa, por qué Flyway y `ddl-auto=validate`." }
              - { name: "SQL", type: "tema", desc: "Joins, agregaciones, cómo leer un `EXPLAIN ANALYZE`, cuándo sirve un índice." }
              - { name: "Errores", type: "tema", desc: "Validación, Problem Details, qué no se le muestra al cliente." }
              - { name: "Transacciones", type: "tema", desc: "Qué garantiza `@Transactional`, cuándo hay rollback, cómo lo demostraste." }
              - { name: "Pruebas", type: "tema", desc: "Unitarias frente a integración, por qué Testcontainers y no H2." }
              - { name: "Entrega", type: "tema", desc: "Docker en dos etapas, Compose, CI, perfiles y secretos." }
            outputs:
              - { name: "docs/mock-interview.md", type: "Markdown", desc: "El registro de la sesión, subido al repositorio." }
            rules:
              - "La respuesta corregida va en inglés y cabe en un minuto hablado: de tres a cinco frases."
              - "Lo que respondiste se anota tal como salió, sin maquillarlo. El valor está en ver la diferencia."
              - "«No supe qué decir» es una anotación válida. Dejar la pregunta fuera no lo es."
              - "Los fallos de inglés (vocabulario que faltó, una frase que no salió) se anotan igual que los técnicos."
              - "Si quedaron menos de cinco preguntas falladas, la entrevista fue demasiado fácil: repite con preguntas de seguimiento más duras."
            examples:
              - title: "Una entrada del registro"
                lang: "markdown"
                output: |
                  ## Q3. What happens if the third item of an order has no stock?

                  **What I said:** "The order fails and... the database goes back."

                  **What was missing:** I did not say why it goes back, and I could not
                  remember the word "rollback". I did not mention the HTTP status.

                  **Corrected answer:** "Creating the order and decreasing the stock run in
                  one transaction. If any item has insufficient stock, the service throws an
                  unchecked exception, Spring rolls back the whole transaction, and the API
                  returns 409 Conflict. I have an integration test that proves the stock of
                  the other items does not change."
            edge_cases:
              - "Sin una persona que te entreviste: usa una simulación de Interview Arena y responde en voz alta, no escribiendo."
              - "Si te bloqueas más de 30 segundos, di en inglés que no lo sabes, anótalo y sigue. Detener la sesión no cuenta."
              - "Grabar el audio ayuda a anotar después lo que de verdad dijiste. La grabación no se sube al repositorio."
            out_of_scope:
              - "Ejercicios de algoritmos en vivo."
              - "Preguntas de comportamiento («tell me about a time...»)."
              - "Diseño de sistemas a gran escala."
          steps:
            - title: "Haz la entrevista"
              body: "Usa una simulación de Interview Arena o pídele a alguien que te entreviste. Recorre el servicio de punta a punta en inglés."
            - title: "Anota lo que falló"
              body: "Escribe en `docs/mock-interview.md` las preguntas que no supiste responder bien."
            - title: "Cierra los huecos"
              body: "Repasa cada punto anotado y escribe debajo la respuesta corregida."
          checklist:
            - "La entrevista duró al menos 45 minutos"
            - "Las preguntas falladas están anotadas"
            - "Cada una tiene su respuesta corregida"

