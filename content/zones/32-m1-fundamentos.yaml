  # ================================================================ JEFE
  - slug: m1-n13-jefe
    number: 13
    title: "Jefe — OrderBridge etapa 1"
    story: "Fecha: 15 de marzo de 2027. El servicio completo, público y listo para que lo revise otra persona. Vencerlo abre el Mundo 2."
    quests:
      - slug: m1-jefe-orderbridge-etapa-1
        type: lab
        title: "Jefe (15 mar) — Etapa 1 de OrderBridge publicada en GitHub"
        xp: 150
        estimated_min: 600
        skills: { spring_api: 1.0 }
        payload:
          proof: commit_or_hours
          goal: "OrderBridge etapa 1 en un repositorio público de GitHub: API REST de pedidos con PostgreSQL, pruebas, Docker, CI y README en inglés."
          spec:
            context: |
              Es la primera entrega de OrderBridge. A partir de hoy el enlace del repositorio va en
              tu currículum, y quien lo abra lo va a juzgar como juzgaría el trabajo de un
              compañero: lo clona, lo levanta, prueba un par de peticiones y lee el README. Esto
              no es un ejercicio nuevo: es la revisión de aceptación de todo el mundo.
            requirements:
              - "El repositorio `orderbridge` es público en GitHub."
              - "Desde un clon limpio, con Docker como único requisito, el servicio levanta siguiendo solo el README."
              - "La API cumple el contrato de los niveles 1, 2, 5, 7 y 10: `/status`, los cinco endpoints de `/orders`, validación con Problem Details, inventario transaccional y escrituras autenticadas."
              - "Los datos persisten en PostgreSQL y el esquema completo sale de las migraciones de Flyway."
              - "`mvn verify` pasa en local y el workflow de CI está en verde en el commit etiquetado."
              - "El README en inglés tiene todas las secciones del nivel 11 y su diagrama se ve en GitHub."
              - "Existe la etiqueta `v0.1.0` y una release de GitHub con notas cortas de lo que incluye."
            inputs:
              - { name: "un clon limpio", type: "carpeta nueva", desc: "Sin tu `.env`, sin tu `target/` y sin tu base local." }
              - { name: ".env", type: "archivo", desc: "Copiado de `.env.example` y completado con valores propios." }
            outputs:
              - { name: "repositorio", type: "URL pública", desc: "`https://github.com/<usuario>/orderbridge`." }
              - { name: "v0.1.0", type: "etiqueta y release", desc: "Apunta a un commit con CI en verde." }
              - { name: "prueba de humo", type: "consola", desc: "La secuencia del ejemplo responde con los códigos esperados." }
            rules:
              - "Ningún secreto en el repositorio ni en su historial. Revísalo antes de hacerlo público: después ya no hay vuelta atrás."
              - "El repositorio no tiene archivos generados (`target/`), ni archivos del editor, ni código comentado, ni `TODO` sin dueño."
              - "La etiqueta se crea sobre `main`, después de que CI pase. No sobre una rama a medias."
              - "Lo que no llegó a esta etapa se declara en la sección «Roadmap» del README. No se esconde."
              - "Los mensajes de commit de la rama principal se entienden sin abrir el diff."
            examples:
              - title: "Prueba de humo desde un clon limpio"
                input: |
                  git clone https://github.com/<usuario>/orderbridge.git && cd orderbridge
                  cp .env.example .env
                  docker compose up -d --build

                  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/status
                  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/orders
                  curl -s -o /dev/null -w "%{http_code}\n" -X POST http://localhost:8080/orders \
                    -H "Content-Type: application/json" -d '{"customerEmail":"ana@example.com","items":[]}'
                  curl -s -o /dev/null -w "%{http_code}\n" -u "$API_USER:$API_PASSWORD" -X POST http://localhost:8080/orders \
                    -H "Content-Type: application/json" -d '{"customerEmail":"ana@example.com","items":[]}'
                  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/orders/00000000-0000-0000-0000-000000000000
                output: |
                  200    <- /status
                  200    <- lista de pedidos, sin credenciales
                  401    <- escritura sin credenciales
                  400    <- con credenciales, pero el pedido no tiene líneas
                  404    <- pedido inexistente
            edge_cases:
              - "Prueba el clon en otra carpeta o, mejor, en otra máquina. Tu carpeta de trabajo tiene cosas que el repositorio no."
              - "Abre el repositorio en una ventana privada del navegador: así ves lo que ve alguien sin tu sesión."
              - "Si CI falla en el commit de la etiqueta, corrige, borra la etiqueta y vuelve a crearla sobre el commit bueno."
              - "Crea un pedido válido con inventario cargado y otro sin inventario: `201` y `409`."
            out_of_scope:
              - "Desplegar el servicio en la nube."
              - "Mensajería, caché y todo lo que pertenece a las etapas siguientes de OrderBridge."
              - "Funcionalidades nuevas. Si no está en los niveles 1 a 11, no entra en `v0.1.0`."
          steps:
            - title: "Cierra pendientes"
              body: "Repasa los niveles 1 a 11 y termina lo que haya quedado a medias."
            - title: "Prueba desde cero"
              body: "Clona el repositorio en una carpeta limpia y sigue tu propio README sin saltarte nada."
            - title: "Publica"
              body: "Haz público el repositorio y crea la etiqueta `v0.1.0`."
              commands: ["git tag v0.1.0", "git push origin v0.1.0"]
          checklist:
            - "El repositorio es público"
            - "El workflow de CI está en verde"
            - "`docker compose up` levanta todo desde un clon limpio"
            - "El README está en inglés y tiene el diagrama"
            - "Existe la etiqueta `v0.1.0`"
