  # ================================================================ NIVEL 5
  - slug: tundra-5-boss
    number: 5
    title: "Boss — El servicio que no arranca"
    story: "Última escotilla. Te entregan un contenedor que no levanta y un terminal. Nadie te va a decir qué le pasa."
    quests:
      - slug: tundra-5-learn-scripting
        type: learn
        title: Scripts de bash que fallan a tiempo
        required: true
        estimated_min: 30
        skills: { linux: 0.7, cicd: 0.3 }
        resources:
          - { ref: res-linux-bash-strict }
          - { ref: res-linux-shellcheck }
          - { ref: res-linux-man-bash, required: false }
        payload:
          note_prompt: "Explica qué hace cada parte de `set -euo pipefail` y por qué un script de despliegue sin eso es peligroso."
          summary_md: |
            Los cinco hábitos que separan un script de juguete de uno que corre en CI:
            - **Shebang**: `#!/usr/bin/env bash` en la primera línea.
            - **`set -euo pipefail`**: `-e` corta al primer comando que falla, `-u` corta si usas una variable que no existe (adiós a `rm -rf $CARPETA/` con la variable vacía), `pipefail` hace que un error en medio de un pipe cuente como error.
            - **Comillas siempre**: `"$ruta"`, no `$ruta`. Un espacio en un nombre de archivo te rompe el script si no las pones.
            - **Códigos de salida**: `exit 0` si todo fue bien, `exit 1` si no. Es lo único que mira el pipeline para decidir si el paso pasó.
            - **`trap`** para limpiar: `trap 'rm -f "$tmp"' EXIT` borra lo temporal pase lo que pase.

            Y pásalo por **ShellCheck** antes de confiar en él: es el compilador que bash no tiene.

      - slug: tundra-5-lab-healthcheck
        type: lab
        title: "Lab: un script de salud que tu pipeline pueda usar"
        required: true
        estimated_min: 60
        skills: { linux: 0.5, cicd: 0.5 }
        payload:
          goal: "Escribir `check.sh` con bash estricto que verifique que QuestMap responde, devolver el código de salida correcto, pasarlo por ShellCheck y dejarlo listo como paso de un pipeline."
          steps:
            - title: El script
              body: "Créalo dentro de un contenedor con bash y curl, o en tu WSL. Fíjate en el `set`, en las comillas y en los dos códigos de salida."
              commands:
                - "docker run --rm -it -v ${PWD}:/work -w /work debian:bookworm-slim bash"
                - "apt-get update && apt-get install -y curl shellcheck"
                - "cat > check.sh <<'SH'"
                - "#!/usr/bin/env bash"
                - "set -euo pipefail"
                - ""
                - "URL=\"${1:-http://host.docker.internal:3000}\""
                - "ESPERADO=\"${2:-200}\""
                - ""
                - "codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \"$URL\" || echo '000')"
                - ""
                - "if [ \"$codigo\" = \"$ESPERADO\" ]; then"
                - "  echo \"OK   $URL -> $codigo\""
                - "  exit 0"
                - "fi"
                - "echo \"FAIL $URL -> $codigo (esperaba $ESPERADO)\" >&2"
                - "exit 1"
                - "SH"
                - "chmod 755 check.sh"
            - title: Pruébalo en los dos casos
              body: "Primero contra QuestMap (debe pasar), después contra un puerto donde no hay nadie (debe fallar). Mira el código de salida cada vez."
              commands:
                - "./check.sh; echo \"exit=$?\""
                - "./check.sh http://host.docker.internal:9999; echo \"exit=$?\""
                - "./check.sh > /dev/null; echo \"solo el exit code importa: $?\""
            - title: Pásalo por el linter
              body: "ShellCheck te va a señalar cosas aunque el script funcione. Arréglalas: así se revisa un script en un PR."
              commands:
                - "shellcheck check.sh && echo 'sin avisos'"
            - title: Rompe el script a propósito
              body: "Quita el `set -euo pipefail`, cambia `\"$URL\"` por `$URL` y llámalo con una URL con espacios. Mira cómo falla en silencio. Luego devuélveselo."
              commands:
                - "sed -i 's/^set -euo pipefail$/# set -euo pipefail/' check.sh"
                - "./check.sh 'http://host.docker.internal:3000 extra'; echo \"exit=$?\""
                - "sed -i 's/^# set -euo pipefail$/set -euo pipefail/' check.sh"
            - title: Déjalo como healthcheck de verdad
              body: "Así se vería en un docker-compose. No lo agregues al compose de QuestMap: escríbelo en tus notas."
              commands:
                - "exit"
                - "# healthcheck:"
                - "#   test: [\"CMD-SHELL\", \"/app/check.sh http://localhost:3000 200\"]"
                - "#   interval: 10s"
                - "#   timeout: 5s"
                - "#   retries: 3"
          expected: "Contra QuestMap el script imprime `OK … -> 200` y sale con 0; contra el puerto 9999 imprime el FAIL por stderr y sale con 1. Con `> /dev/null` no ves nada y solo queda el código de salida: eso es exactamente lo que lee un pipeline. Sin `set -euo pipefail` y sin comillas, la llamada con espacios no revienta: pasa de largo con un código engañoso, que es el fallo más peligroso de un script de despliegue."
          checklist:
            - "`check.sh` empieza con shebang y `set -euo pipefail`"
            - "Devuelve 0 cuando el servicio responde y 1 cuando no"
            - "El mensaje de error sale por stderr, no por stdout"
            - "ShellCheck no deja avisos"
            - "Vi con mis ojos cómo falla en silencio al quitarle el modo estricto"
          hints:
            - "Si `host.docker.internal` no resuelve, prueba con la IP de tu máquina o corre el script directamente en WSL contra `http://127.0.0.1:3000`."
            - "`curl -w '%{http_code}'` imprime solo el código HTTP; el `|| echo '000'` evita que un fallo de red mate el script antes de que puedas comparar."
            - "El heredoc `<<'SH'` con comillas simples impide que el shell expanda las variables al escribir el archivo: eso es lo que quieres aquí."
          evidence_hint: "Pega tu `check.sh` final, las dos ejecuciones con su código de salida y la salida de shellcheck."

      - slug: tundra-5-quiz
        type: quiz
        title: Quiz — Scripting y cierre de la tundra
        required: true
        estimated_min: 15
        skills: { linux: 1.0 }
        questions:
          - slug: tu5-q1
            type: mcq
            prompt: "¿Qué hace `set -u` en un script?"
            options: [
              "Hace el script más silencioso",
              "Aborta si se usa una variable que no está definida",
              "Actualiza los paquetes",
              "Permite usar comodines"
            ]
            answer: 1
            explanation: "Es lo que evita el clásico `rm -rf \"$DIR/\"` con `$DIR` vacío. Falla pronto en lugar de hacer algo irreversible."
            skill: linux
            difficulty: 2
          - slug: tu5-q2
            type: mcq
            prompt: "Un paso de CI corre tu script y el pipeline queda verde aunque el despliegue falló. ¿Qué es lo más probable?"
            options: [
              "El runner está roto",
              "El script terminó con código 0 aunque un comando interno falló (le falta `set -e` o `pipefail`)",
              "Falta memoria",
              "El log se perdió"
            ]
            answer: 1
            explanation: "El pipeline solo mira el código de salida. Sin `-e`, el script sigue después de un error y acaba devolviendo el 0 del último comando."
            skill: cicd
            difficulty: 2
          - slug: tu5-q3
            type: fill
            prompt: "La primera línea que dice con qué intérprete correr un script se llama ______ y se escribe `#!/usr/bin/env bash`."
            answer: ["shebang"]
            explanation: "Sin ella el sistema decide por su cuenta y puede ejecutarlo con `sh`, donde parte de la sintaxis de bash no existe."
            skill: linux
            difficulty: 1
          - slug: tu5-q4
            type: tf
            prompt: "`echo \"error\" >&2` manda el mensaje a stderr."
            answer: true
            explanation: "Así los mensajes de error no contaminan la salida que otro comando puede estar leyendo por un pipe. Es buena educación de script."
            skill: linux
            difficulty: 2
          - slug: tu5-q5
            type: mcq
            prompt: "¿Por qué se escribe `\"$ruta\"` y no `$ruta`?"
            options: [
              "Por estilo",
              "Porque sin comillas un valor con espacios se parte en varios argumentos",
              "Porque es más rápido",
              "Porque bash lo exige"
            ]
            answer: 1
            explanation: "Sin comillas, `mi archivo.txt` llega como dos argumentos. Es el aviso que más repite ShellCheck (SC2086) y la causa de muchos scripts que fallan solo a veces."
            skill: linux
            difficulty: 2
          - slug: tu5-q6
            type: mcq
            prompt: "Un contenedor no arranca. ¿Cuál es el primer comando?"
            options: [
              "Reconstruir la imagen",
              "`docker logs <contenedor>` y `docker inspect` para ver el código de salida",
              "Reiniciar Docker Desktop",
              "Cambiar la imagen base"
            ]
            answer: 1
            explanation: "Primero lee. El código de salida ya acota: 137 lo mataron, 1 la app falló al arrancar, 126/127 un problema de permisos o de comando no encontrado."
            skill: debugging_rca
            difficulty: 1
          - slug: tu5-q7
            type: mcq
            prompt: "Un contenedor sale con código 127. ¿Qué significa?"
            options: [
              "Se quedó sin memoria",
              "No encontró el comando que intentaba ejecutar",
              "Terminó bien",
              "El healthcheck falló"
            ]
            answer: 1
            explanation: "127 es 'command not found' (126 es 'no se pudo ejecutar', típicamente permisos). Suele ser un ENTRYPOINT mal escrito o un script sin `chmod +x`."
            skill: linux
            difficulty: 3
          - slug: tu5-q8
            type: mcq
            prompt: "¿Para qué sirve `trap 'rm -f \"$tmp\"' EXIT` en un script?"
            options: [
              "Para capturar errores de sintaxis",
              "Para ejecutar la limpieza al salir, pase lo que pase",
              "Para reintentar el comando",
              "Para ignorar las señales"
            ]
            answer: 1
            explanation: "`trap` engancha código a una señal o a la salida del script. Es la forma de no dejar archivos temporales ni procesos huérfanos cuando algo falla."
            skill: linux
            difficulty: 3

      - slug: tundra-5-boss-fight
        type: boss
        title: "Jefe: el servicio que no arranca"
        required: true
        estimated_min: 90
        skills: { linux: 0.7, debugging_rca: 0.1, english: 0.2 }
        payload:
          task: "Te dan un servicio en contenedor que no funciona y solo un terminal. Diagnostica y arregla estos cuatro fallos, uno por uno, dejando por escrito el comando que usaste para identificar cada cual: (1) el contenedor sale de inmediato con código 127; (2) arreglado eso, sale con 137 a los pocos segundos de arrancar; (3) arreglado eso, arranca pero `docker logs` no muestra nada aunque la app sí escribe un archivo de log dentro; (4) arreglado eso, el contenedor tarda 10 segundos exactos en pararse y termina con 137. Entrega: para cada fallo, el síntoma, el comando con el que lo confirmaste, la causa y el arreglo concreto en el Dockerfile o en el compose. Después defiende el diagnóstico en inglés como si fuera una entrevista: te preguntarán por qué 137, qué es PID 1 y por qué los logs van a stdout."
          rubric: [correctness, depth, clarity, tradeoffs]
          interview_focus: [
            "exit codes 126, 127 and 137",
            "PID 1 and signal handling in containers",
            "logs to stdout vs files inside the container",
            "memory limits and the OOM killer",
            "least privilege: non-root user and file permissions"
          ]

