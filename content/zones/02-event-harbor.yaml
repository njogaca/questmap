        resources:
          - { ref: res-ddia }
          - { ref: res-kleppmann-lectures, required: false }
        payload:
          note_prompt: "Resume en 3 bullets cómo diseñarías un flujo OrderPlaced → Payment → Shipping: topics, subscriptions, qué pasa si Payment falla y cómo evitas cobrar dos veces."

      - slug: eda-5-quiz-final
        type: quiz
        title: Examen final — Event Harbor
        required: true
        estimated_min: 20
        skills: { eda: 0.7, distributed_systems: 0.3 }
        questions:
          - slug: e5-q1
            type: mcq
            prompt: "Tu servicio guarda una orden en la BD y luego publica OrderPlaced. A veces se cae entre los dos pasos y el evento nunca sale. ¿Qué patrón lo resuelve?"
            options: ["Retry infinito", "Transactional outbox", "Ordering keys", "Push subscription"]
            answer: 1
            explanation: "Outbox: guardas la orden y el evento en la MISMA transacción (tabla outbox) y un proceso aparte publica lo pendiente. Evita el 'dual write'."
            skill: distributed_systems
            difficulty: 3
          - slug: e5-q2
            type: mcq
            prompt: "¿Qué dato NO debería viajar en un evento OrderPlaced publicado a muchos equipos?"
            options: ["orderId", "Número completo de tarjeta de crédito", "total y currency", "timestamp del evento"]
            answer: 1
            explanation: "Los eventos se replican y se guardan en muchos sistemas. Datos sensibles (PCI/PII) se evitan o se tokenizan."
            skill: eda
            difficulty: 1
          - slug: e5-q3
            type: tf
            prompt: "En una coreografía de eventos no existe un orquestador central: cada servicio reacciona a eventos y publica los suyos."
            answer: true
            explanation: "Coreografía = desacoplada pero difícil de seguir de punta a punta. Orquestación (saga orchestrator) = un coordinador decide los pasos. Ambas son válidas; depende del caso."
            skill: distributed_systems
            difficulty: 2
          - slug: e5-q4
            type: mcq
            prompt: "Cada orden produce Created → Paid → Shipped y el consumidor necesita verlos en ese orden. ¿Qué ordering key usas?"
            options: ["El tipo de evento", "El orderId", "Una constante 'orders'", "El customerId del mes"]
            answer: 1
            explanation: "La clave define el grupo que debe ir en orden. Por orderId mantienes el orden por orden y paralelismo entre órdenes distintas. Una constante convertiría todo en una sola fila lenta."
            skill: eda
            difficulty: 2
          - slug: e5-q5
            type: mcq
            prompt: "El backlog de `payments-sub` crece y el dead-letter topic recibe miles de mensajes desde las 3:00 a. m. ¿Qué revisas primero?"
            options: ["Subir el ack deadline a 10 minutos", "Los mensajes del DLT y los logs/deploys alrededor de las 3:00 para encontrar la causa común", "Borrar el dead-letter topic", "Agregar 50 consumidores"]
            answer: 1
            explanation: "Muchos dead-letters a la vez suelen tener una causa común (deploy, esquema nuevo, dependencia caída). Primero el diagnóstico (RCA); escalar sin entender solo genera más fallos."
            skill: eda
            difficulty: 2
          - slug: e5-q6
            type: mcq
            prompt: "¿Qué ventaja tiene publicar eventos de dominio en lugar de que Shipping llame por HTTP a Orders?"
            options: ["Menor latencia siempre", "Desacoplamiento: Orders no necesita saber quién consume ni estar disponible a la vez", "No hay que manejar errores", "Garantiza consistencia fuerte"]
            answer: 1
            explanation: "Ganas desacoplamiento y resiliencia a costa de consistencia eventual y más complejidad operativa (duplicados, orden, observabilidad)."
            skill: eda
            difficulty: 1
          - slug: e5-q7
            type: fill
            prompt: "Cuando el sistema converge al estado correcto después de un tiempo (y no de inmediato), hablamos de consistencia ______ (en inglés, eventual)."
            answer: ["eventual"]
            explanation: "Eventual consistency: es el precio normal de la comunicación asíncrona. En entrevistas, explica cómo lo comunicas al usuario (ej. 'pago en proceso')."
            skill: distributed_systems
            difficulty: 1
          - slug: e5-q8
            type: mcq
            prompt: "¿Qué métrica de Pub/Sub usarías para alertar que los consumidores se están quedando atrás?"
            options: ["Número de topics", "Antigüedad del mensaje más viejo sin ack (oldest unacked message age)", "Tamaño del código", "Cantidad de IAM roles"]
            answer: 1
            explanation: "La edad del mensaje más viejo sin ack refleja directamente el retraso. Lo verás de nuevo en el Observatory con alertas."
            skill: eda
            difficulty: 2

      - slug: eda-5-boss-fight
        type: boss
        title: "Jefe: diseña el flujo de eventos de órdenes"
