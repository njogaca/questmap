# Las 14 skills de la oferta (sección 1 del SPEC).
#
# target_xp = XP ponderado esperado cuando estén completas TODAS las quests
# `required` de TODAS las zonas que entrenan la skill (sin bonos ni optional).
#
# Historia: en la v1 se estimó con una plantilla típica por nivel (las zonas 4–10 eran
# esqueleto). El 2026-11-05, con todas las zonas publicadas, se reemplazó por el XP
# real: suma de xp × peso de cada quest required publicada (consulta sobre quests +
# quest_skills). Si agregas o cambias quests, recalcula con esa misma suma.
#
# El seed avisa si la suma real de una skill ya publicada se desvía > 15 % de su target_xp.

skills:
