            answer: 1
            explanation: "Sin volumen, los datos mueren con el contenedor."
            skill: delivery
            difficulty: 1
          - type: tf
            prompt: "Dentro de Compose, el servicio app se conecta a la base usando localhost."
            answer: false
            explanation: "Cada contenedor tiene su propio localhost. Se usa el nombre del servicio, por ejemplo db."
            skill: delivery
            difficulty: 2
          - type: mcq
            prompt: "¿Qué gana un Dockerfile en dos etapas?"
            options: ["Una imagen final más pequeña, sin herramientas de compilación", "Que compile dos veces", "Que use dos bases de datos"]
            answer: 0
            explanation: "La etapa final solo copia el resultado, no el compilador ni el código."
            skill: delivery
            difficulty: 2
          - type: mcq
            prompt: "Cambiaste el código y corres docker compose up -d sin más. ¿Qué pasa?"
            options: ["Se recompila sola", "Sigue corriendo la imagen anterior", "Da error"]
            answer: 1
            explanation: "Hace falta --build para reconstruir la imagen con el código nuevo."
            skill: delivery
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué pasa con los cambios de una transacción cuando hay rollback?"
            options: ["Se guardan a medias", "Se deshacen todos", "Se guardan en otra tabla"]
            answer: 1
            explanation: "El rollback deja la base como estaba antes de empezar."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Repaso. @Transactional va normalmente en el servicio."
            answer: true
            explanation: "El servicio agrupa los pasos de una operación de negocio."
            skill: sql_data
            difficulty: 1

  # ================================================================ NIVEL 9
  - slug: m1-n9-ci
    number: 9
    title: "CI con GitHub Actions"
    story: "Objetivo: que las pruebas corran solas en cada commit y avisen cuando algo se rompe."
    quests:
      - slug: m1-n9-glosario
        type: glossary
        title: "Glosario — Integración continua"
        xp: 0
        estimated_min: 10
        skills: { delivery: 1.0 }
        payload:
          terms: [g-p1-ci, g-p1-pipeline, g-p1-workflow, g-p1-build-status]

      - slug: m1-n9-ejercicio
        type: lab
        title: "Ejercicio — Pruebas automáticas en cada commit"
        xp: 50
        estimated_min: 120
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-gha-maven, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un workflow de GitHub Actions que compila y prueba OrderBridge en cada push y en cada pull request."
          spec:
            context: |
              La semana pasada alguien subió a `main` un cambio que no compilaba y nadie lo notó
              hasta el día siguiente. El equipo decide que ningún cambio entra sin que una máquina
              neutral lo compile y corra todas las pruebas. «En mi máquina funciona» deja de ser
              un argumento.
            requirements:
              - "Existe `.github/workflows/ci.yml` con un workflow llamado `CI`."
              - "Se dispara en cada `push` a `main` y en cada `pull_request` contra `main`."
              - "El job corre en `ubuntu-latest`, descarga el código, instala JDK 21 (Temurin) con caché de Maven y ejecuta `mvn -B verify`."
              - "`mvn verify` incluye las pruebas unitarias y las de integración con Testcontainers."
              - "Si una prueba falla o el código no compila, el workflow termina en rojo."
              - "El README muestra la insignia de estado del workflow."
            inputs:
              - { name: "push a main", type: "evento", desc: "Cualquier commit que llegue a la rama principal." }
              - { name: "pull_request", type: "evento", desc: "Abrir o actualizar un pull request contra `main`." }
            outputs:
              - { name: "check del commit", type: "✓ o ✗ en GitHub", desc: "Visible junto a cada commit y en cada pull request." }
              - { name: "log del job", type: "texto", desc: "El `Tests run: ...` de Maven y, si falla, qué prueba falló." }
              - { name: "insignia", type: "imagen en el README", desc: "`passing` en verde para `main`." }
            rules:
              - "El workflow no contiene contraseñas ni tokens escritos. Lo que haga falta va en los secretos del repositorio."
              - "Las acciones se usan con versión fija (`actions/checkout@v4`, `actions/setup-java@v4`), no con `@main`."
              - "Ningún paso lleva `continue-on-error` ni se saltan pruebas (`-DskipTests`) para que quede verde."
              - "El job declara `timeout-minutes`, para que un cuelgue no consuma minutos sin límite."
              - "El workflow declara `permissions: contents: read`: solo necesita leer el código."
            examples:
              - title: "Demostrar que el rojo funciona"
                input: |
                  1. Crea una rama y cambia una aserción para que falle
                  2. git push y abre un pull request
                  3. Mira el check del pull request
                  4. Corrige la aserción y vuelve a subir
                output: |
                  Paso 3:  ✗ CI / build — Failing
                           Tests run: 24, Failures: 1, Errors: 0
                           BUILD FAILURE
                  Paso 4:  ✓ CI / build — Successful
            edge_cases:
              - "Si el workflow pasa en verde con una prueba rota, revisa que el comando sea `verify` y no `compile` o `package -DskipTests`."
              - "Las pruebas de integración necesitan Docker: en `ubuntu-latest` ya viene instalado, no hay que agregar un servicio de PostgreSQL al workflow."
              - "La segunda ejecución debe ser más rápida que la primera. Si no, la caché de Maven no está funcionando."
            out_of_scope:
              - "Despliegue automático y publicación de imágenes."
              - "Matrices de varias versiones de Java o de sistemas operativos."
              - "Análisis estático, cobertura y escaneo de dependencias."
          steps:
            - title: "Workflow"
              body: "Crea `.github/workflows/ci.yml` con JDK 21, caché de Maven y `mvn verify`."
            - title: "Rómpelo a propósito"
              body: "Sube un commit con una prueba que falle y comprueba que el workflow queda en rojo. Luego arréglalo."
            - title: "Insignia"
              body: "Agrega la insignia de estado del workflow al README."
          checklist:
            - "El workflow corre en cada push"
            - "Una prueba rota deja el workflow en rojo"
            - "El README muestra la insignia en verde"

      - slug: m1-n9-quiz
        type: quiz
        title: "Quiz — Integración continua"
        xp: 0
        estimated_min: 12
        skills: { delivery: 1.0 }
        questions:
