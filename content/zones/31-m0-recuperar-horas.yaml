            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "¿Cuándo se ejecuta el constructor?"
            options: ["Al compilar", "Al crear el objeto con new", "Al terminar el programa"]
            answer: 1
            explanation: "El constructor corre una vez por objeto, en el momento de crearlo."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "Un método recibe un parámetro de tipo Descuento, que es una interfaz. ¿Qué puedes pasarle?"
            options: ["Solo un objeto llamado Descuento", "Cualquier objeto cuya clase implemente Descuento", "Cualquier objeto"]
            answer: 1
