  # ================================================================ NIVEL 12
  - slug: m1-n12-repaso
    number: 12
    title: "Repaso"
    story: "Objetivo: explicar en voz alta y en inglés todo lo construido en este mundo, bajo presión de tiempo."
    quests:
      - slug: m1-n12-glosario
        type: glossary
