      - slug: eda-4-lab-java-subscriber
        type: lab
        title: "Lab: suscriptor Java con flow control contra el emulador"
        required: true
        estimated_min: 120
        skills: { eda: 0.6, java: 0.3, distributed_systems: 0.1 }
        payload:
          goal: "Escribir un publisher y un subscriber en Java con la librería oficial `google-cloud-pubsub`, conectados al emulador, y observar el efecto del flow control."
          steps:
            - title: Proyecto Maven
              body: "Genera un proyecto sin dependencias web desde Spring Initializr (o reutiliza uno). En el `pom.xml` agrega en `<dependencyManagement>` el BOM `com.google.cloud:libraries-bom` (tipo `pom`, scope `import`) y en `<dependencies>` `com.google.cloud:google-cloud-pubsub` sin versión. Para la versión del BOM, busca la más reciente en central.sonatype.com (`libraries-bom`)."
              commands:
                - "cd $HOME\\questmap-labs; Invoke-WebRequest \"https://start.spring.io/starter.zip?type=maven-project&language=java&javaVersion=21&groupId=com.questmap&artifactId=harbor&name=harbor&packageName=com.questmap.harbor\" -OutFile harbor.zip; Expand-Archive harbor.zip -DestinationPath harbor; cd harbor"
            - title: Conexión al emulador
              body: |
                Con el emulador no hay credenciales. Crea el canal así y úsalo en Publisher y Subscriber:

                ```java
                ManagedChannel channel = ManagedChannelBuilder.forTarget("localhost:8085").usePlaintext().build();
                TransportChannelProvider channelProvider =
                    FixedTransportChannelProvider.create(GrpcTransportChannel.create(channel));
                CredentialsProvider credentials = NoCredentialsProvider.create();

                Publisher publisher = Publisher.newBuilder(TopicName.of("questmap-lab", "orders"))
                    .setChannelProvider(channelProvider)
                    .setCredentialsProvider(credentials)
                    .build();
                ```
            - title: Publica 200 órdenes
              body: "Un `CommandLineRunner` (o un `main`) publica 200 mensajes JSON con atributo `eventType=OrderPlaced`. Usa `publisher.publish(msg).get()` al final para esperar y luego `publisher.shutdown()`."
            - title: Suscriptor lento con flow control
              body: "El `MessageReceiver` duerme 200 ms (simula una BD lenta), imprime el orderId y hace `consumer.ack()`. Configura:\n\nFlowControlSettings.newBuilder().setMaxOutstandingElementCount(10L).build()\n\ny pásalo con `Subscriber.newBuilder(...).setFlowControlSettings(...)`. Imprime cada segundo cuántos mensajes llevas procesados."
            - title: Experimenta
              body: "Corre dos veces: con `setMaxOutstandingElementCount(10L)` y con `1000L`. Observa la memoria (Administrador de tareas) y cuántos mensajes tiene 'en vuelo' el proceso. Escribe tu conclusión en la evidencia."
              commands:
                - ".\\mvnw.cmd spring-boot:run"
            - title: Tolerant reader
              body: "Publica 5 mensajes nuevos con un campo extra `currency: \"USD\"`. Tu consumidor debe seguir funcionando: si usas Jackson, configura `FAIL_ON_UNKNOWN_PROPERTIES = false` o ignora campos desconocidos."
            - title: Commit
              commands:
                - "git add .; git commit -m \"event-harbor: java subscriber with flow control\""
          expected: "Con 10 elementos en vuelo, el proceso recibe de a pocos y la memoria se mantiene estable; con 1000 recibe una avalancha que espera en memoria. Los mensajes con `currency` se procesan sin errores."
          checklist:
            - "Publisher y subscriber Java funcionan contra el emulador"
            - "Configuré FlowControlSettings y vi la diferencia entre 10 y 1000"
            - "El consumidor tolera un campo nuevo (backward compatible)"
            - "Hice commit"
          hints:
            - "Las clases están en `com.google.api.gax.*`, `io.grpc.*` y `com.google.cloud.pubsub.v1.*`; deja que tu IDE haga los imports."
            - "Recuerda crear antes el topic y la subscription en el emulador (como en el nivel 2) o con `TopicAdminClient`/`SubscriptionAdminClient`."
            - "Si el subscriber termina enseguida, bloquea el hilo principal con `subscriber.startAsync().awaitRunning(); subscriber.awaitTerminated(60, TimeUnit.SECONDS)` (captura el TimeoutException)."
          evidence_hint: "Pega un extracto de la salida con ambos experimentos y tu conclusión en 2–3 líneas."

      - slug: eda-4-quiz
        type: quiz
        title: Quiz — Esquemas y backpressure
        required: true
        estimated_min: 15
        skills: { eda: 0.7, distributed_systems: 0.3 }
        questions:
          - slug: e4-q1
            type: mcq
            prompt: "¿Qué cambio en un evento es backward compatible (los consumidores viejos siguen funcionando)?"
            options: ["Renombrar un campo", "Agregar un campo opcional", "Cambiar el tipo de `total` de número a texto", "Eliminar un campo obligatorio"]
            answer: 1
            explanation: "Agregar un campo opcional no rompe a quien lo ignora. Renombrar o eliminar sí: para eso se publica una versión nueva del evento y se migra de forma gradual."
            skill: eda
            difficulty: 1
          - slug: e4-q2
            type: mcq
            prompt: "¿Qué es backpressure?"
            options: ["Un error de red", "Que el consumidor señale o limite cuánto puede recibir para no saturarse", "Comprimir mensajes", "Reintentar más rápido"]
            answer: 1
            explanation: "Es un mecanismo para que el lado lento marque el ritmo. En Pub/Sub, el flow control del subscriber limita los mensajes 'en vuelo'."
            skill: distributed_systems
            difficulty: 1
          - slug: e4-q3
            type: tf
            prompt: "Si el consumer lag (backlog) crece de forma sostenida, una solución típica es agregar más instancias del consumidor a la misma subscription."
            answer: true
            explanation: "Escalar horizontalmente los competing consumers aumenta el throughput, siempre que la dependencia de abajo (la BD) lo aguante y no uses ordering keys muy concentradas."
            skill: eda
            difficulty: 2
          - slug: e4-q4
            type: mcq
            prompt: "¿Qué es el patrón 'tolerant reader'?"
            options: ["Un lector que ignora los campos que no conoce y usa defaults para los que faltan", "Un consumidor que nunca hace ack", "Un lector con reintentos infinitos", "Un consumidor que solo lee atributos"]
            answer: 0
            explanation: "Ser tolerante en lo que recibes permite que el productor evolucione el esquema sin coordinar un despliegue simultáneo con todos los consumidores."
            skill: eda
            difficulty: 2
          - slug: e4-q5
            type: mcq
            prompt: "Pub/Sub schemas te permiten:"
            options: ["Validar que los mensajes publicados cumplan un esquema Avro o Protocol Buffer", "Ordenar mensajes", "Cifrar mensajes", "Reemplazar IAM"]
            answer: 0
            explanation: "El topic rechaza mensajes que no cumplen el esquema, y puedes crear revisiones para evolucionarlo de forma controlada."
            skill: eda
            difficulty: 1
          - slug: e4-q6
            type: mcq
            prompt: "Tu subscriber tiene flow control de 10 mensajes en vuelo y cada uno tarda 200 ms. ¿Throughput aproximado por instancia?"
            options: ["5 msg/s", "50 msg/s", "500 msg/s", "Ilimitado"]
            answer: 1
            explanation: "10 en paralelo ÷ 0,2 s = 50 mensajes por segundo (si tienes hilos suficientes). Esta cuenta rápida es muy común en entrevistas de diseño."
            skill: distributed_systems
            difficulty: 3
            hint: "Mensajes en paralelo dividido por el tiempo de cada uno."
          - slug: e4-q7
            type: fill
            prompt: "En Jackson, para que tu consumidor no falle con campos desconocidos desactivas `DeserializationFeature.FAIL_ON_UNKNOWN_______`."
            answer: ["PROPERTIES"]
            explanation: "`FAIL_ON_UNKNOWN_PROPERTIES = false` (o `@JsonIgnoreProperties(ignoreUnknown = true)`) es la forma práctica de aplicar el tolerant reader en Java."
            skill: eda
            difficulty: 2
          - slug: e4-q8
            type: order
            prompt: "Ordena un cambio incompatible de evento (renombrar `total` → `amount`) sin romper a nadie:"
            options: ["Publicar OrderPlaced v2 con `amount` (y mantener v1 con `total`)", "Actualizar los consumidores para que entiendan v2", "Cuando todos leen v2, dejar de publicar v1", "Retirar el soporte de v1 en los consumidores"]
            answer: [0, 1, 2, 3]
            explanation: "Expandir y luego contraer (expand/contract): primero conviven ambas versiones, se migra a los consumidores y al final se elimina lo viejo."
            skill: eda
            difficulty: 3

