      - slug: ds-4-quiz
        type: quiz
        title: Quiz — consenso, sagas y backpressure
        required: true
        estimated_min: 20
        skills:
          distributed_systems: 1
        questions:
          - slug: d4-q1
            type: mcq
            prompt: Un cluster Raft tiene 5 nodos. ¿Cuántos pueden caer sin que deje de aceptar escrituras?
            options:
              - "1"
              - "2"
              - "3"
              - "4"
            answer: 1
            explanation: "Necesita mayoría: 3 de 5. Con 2 caídos quedan 3. Con 3 caídos, no hay mayoría."
            skill: distributed_systems
            difficulty: 1
          - slug: d4-q2
            type: mcq
            prompt: ¿Por qué los clusters de consenso suelen tener un número impar de nodos?
            options:
              - Por costo de licencias
              - Porque 4 nodos toleran las mismas caídas que 3 (una), así que el cuarto no suma tolerancia
              - Porque Raft no funciona con pares
              - Por el balanceador de carga
            answer: 1
            explanation: "Mayoría de 4 es 3: tolera 1 caída, igual que 3 nodos. 5 nodos toleran 2."
            skill: distributed_systems
            difficulty: 2
          - slug: d4-q3
            type: mcq
            prompt: ¿Qué problema evita el consenso por mayoría durante una partición?
            options:
              - La latencia
              - "El split-brain: dos líderes aceptando escrituras contradictorias"
              - Los tombstones
              - El replication lag
            answer: 1
            explanation: Solo el lado con mayoría puede elegir líder; el lado minoritario deja de aceptar escrituras.
            skill: distributed_systems
            difficulty: 2
          - slug: d4-q4
            type: mcq
            prompt: En una saga, falla el paso 'reservar inventario' después de cobrar. ¿Qué se hace?
            options:
              - Rollback de la base de datos de payments
              - Ejecutar la compensación del cobro (un reembolso) y marcar la orden como cancelada
              - Reintentar para siempre
              - Nada, el cliente reclamará
            answer: 1
            explanation: Una compensación es una acción nueva que deshace el efecto de negocio; no es un rollback técnico.
            skill: distributed_systems
            difficulty: 1
          - slug: d4-q5
            type: tf
            prompt: "Las sagas dan el mismo aislamiento que una transacción ACID: nadie ve estados intermedios."
            answer: false
            explanation: Otros servicios y usuarios pueden ver estados como PENDING_PAYMENT. Hay que diseñar para eso.
            skill: distributed_systems
            difficulty: 2
          - slug: d4-q6
            type: mcq
            prompt: ¿Cuál es el principal problema del two-phase commit entre microservicios?
            options:
              - Es lento de programar
              - Si el coordinador cae después del prepare, los participantes quedan bloqueados con locks
              - No es atómico
              - No funciona con PostgreSQL
            answer: 1
            explanation: 2PC es atómico pero bloqueante y acopla la disponibilidad de todos los servicios.
            skill: distributed_systems
            difficulty: 2
          - slug: d4-q7
            type: mcq
            prompt: Un servicio sobrecargado empieza a fallar. ¿Qué política de reintentos de los clientes lo ayuda a recuperarse?
            options:
              - Reintentar inmediatamente hasta que funcione
              - Backoff exponencial con jitter, máximo de intentos y retry budget
              - Reintentar en todas las capas
              - Subir los timeouts a 5 minutos
            answer: 1
            explanation: "Lo viste en el lab: los reintentos inmediatos multiplican la carga y alargan la caída."
            skill: distributed_systems
            difficulty: 1
          - slug: d4-q8
            type: mcq
            prompt: ¿Para qué sirve el jitter en el backoff?
            options:
              - Para que los reintentos sean más rápidos
              - Para que los clientes no reintenten todos al mismo tiempo (desincronizarlos)
              - Para cifrar las peticiones
              - Para medir la latencia
            answer: 1
            explanation: Sin jitter, miles de clientes que fallaron juntos vuelven juntos, en oleadas.
            skill: distributed_systems
            difficulty: 1
          - slug: d4-q9
            type: fill
            prompt: Rechazar pronto (con 503 o 429) las peticiones que no podrás atender, en vez de aceptarlas y fallar tarde, se llama load ______.
            answer:
              - shedding
            explanation: Es mejor atender bien al 70 % que mal al 100 %.
            skill: distributed_systems
            difficulty: 1
          - slug: d4-q10
            type: mcq
            prompt: Una llamada pasa por 3 capas (gateway → orders → payments → base de datos) y cada capa hace hasta 3 intentos. En el peor caso, ¿cuántas llamadas llegan a la base de datos?
            options:
              - "3"
              - "9"
              - "27"
              - "81"
            answer: 2
            explanation: "3 × 3 × 3 = 27: los reintentos se multiplican entre capas. Por eso se reintenta en UNA sola capa (normalmente la más cercana al origen del fallo)."
            skill: distributed_systems
            difficulty: 3
  - slug: ds-5-boss
    number: 5
    title: Boss — Preguntas de diseño de sistemas
    story: "En la cima de la ciudadela, el Arquitecto te espera frente a una pizarra en blanco. No quiere la respuesta perfecta: quiere ver cómo piensas, qué preguntas haces y qué sacrificas a propósito."
    quests:
      - slug: ds-5-learn-framework
        type: learn
        title: Cómo responder una pregunta de system design
        required: true
        estimated_min: 45
        skills:
          distributed_systems: 0.7
          english: 0.3
        resources:
          - ref: res-kleppmann-notes
          - ref: res-fowler-dist-patterns
            required: false
        payload:
          note_prompt: "Practica en voz alta (en inglés, con Win+H si quieres dictar) los primeros 5 minutos de 'Design a URL shortener': solo requisitos y estimaciones. Escribe lo que dijiste."
          summary_md: |
            Un guion de 45 minutos que funciona:
            1. **Requisitos (5 min):** funcionales ("el cliente reserva un producto para recoger en tienda") y NO funcionales: escala, latencia (p99), disponibilidad, consistencia. Pregunta, no supongas.
            2. **Estimaciones rápidas (3 min):** peticiones por segundo, tamaño de datos, lectura vs escritura. Redondea sin miedo: 1 día ≈ 100.000 s.
            3. **API (5 min):** 3–5 endpoints o eventos principales.
            4. **Modelo de datos (5 min):** entidades, clave de partición, qué base y por qué.
            5. **Diseño de alto nivel (10 min):** servicios, colas, caches, bases. Dibuja el camino de una petición.
            6. **Profundizar (12 min):** el punto más difícil (consistencia del inventario, hot partitions, idempotencia, fallos).
            7. **Trade-offs y cierre (5 min):** qué sacrificaste, cómo lo monitoreas (SLOs) y qué harías con más tiempo.

            Frases útiles:
            - "Before designing, let me clarify the requirements."
            - "Let's do a quick back-of-the-envelope estimate."
            - "The trade-off here is… I'd choose X because…"
            - "If this component fails, …"
            - "To keep it simple, I'll start with a single region and then discuss multi-region."

            Lo que más evalúan: que hagas preguntas, que justifiques cada elección con un trade-off y que pienses en los fallos. Toda la ciudadela (CAP, quórums, replicación, idempotencia, sagas, backpressure) son tus herramientas para esa conversación.
      - slug: ds-5-glossary
        type: glossary
        title: Vocabulario de diseño de sistemas
        required: true
        estimated_min: 10
        skills:
          distributed_systems: 1
        payload:
          terms:
            - ds-back-of-envelope
            - ds-functional-requirements
            - ds-hot-key
            - ds-fencing-token
            - ds-read-replica-cache
      - slug: ds-5-quiz-final
        type: quiz
        title: Examen final — Distributed Systems Citadel
        required: true
        estimated_min: 25
        skills:
          distributed_systems: 1
        questions:
          - slug: d5-q1
            type: mcq
            prompt: Al empezar una pregunta de system design, ¿qué haces primero?
            options:
              - Dibujar microservicios y Kafka
              - Aclarar requisitos funcionales y no funcionales (escala, latencia, consistencia)
              - Elegir la base de datos
              - Escribir código
            answer: 1
            explanation: Sin requisitos, cualquier diseño es una adivinanza. Los entrevistadores esperan preguntas.
            skill: distributed_systems
            difficulty: 1
          - slug: d5-q2
            type: mcq
            prompt: Un sistema recibe 50 millones de pedidos de consulta de stock al día. ¿Cuántas peticiones por segundo son, aproximadamente, en promedio?
            options:
              - ~50
              - ~500
              - ~5.000
              - ~50.000
            answer: 1
            explanation: "50.000.000 / 100.000 s ≈ 500 por segundo en promedio. El pico puede ser 3–10 veces mayor: diseña para el pico."
            skill: distributed_systems
            difficulty: 2
          - slug: d5-q3
            type: mcq
            prompt: Dos clientes intentan reservar la ÚLTIMA unidad de un producto en la misma tienda al mismo tiempo. ¿Qué diseño evita venderla dos veces?
            options:
              - Leer el stock de una réplica y luego restar
              - Un UPDATE condicional atómico (`UPDATE stock SET qty = qty - 1 WHERE sku = ? AND store = ? AND qty > 0`) en la fuente de verdad, revisando cuántas filas cambió
              - Cachear el stock 5 minutos
              - Last-write-wins
            answer: 1
            explanation: La operación de comparar y restar debe ser atómica y en un lugar con consistencia fuerte. Si cambió 0 filas, no había stock.
            skill: distributed_systems
            difficulty: 2
          - slug: d5-q4
            type: mcq
            prompt: Durante Black Friday, un producto en oferta recibe el 40 % de todas las lecturas. ¿Qué problema es y qué haces?
            options:
              - Split-brain; agregar nodos
              - Hot key; cachear ese producto (con TTL corto) o replicarlo en varias particiones
              - Clock skew; sincronizar NTP
              - Tombstones; compactar
            answer: 1
            explanation: Una clave caliente satura una sola partición aunque el cluster tenga capacidad de sobra.
            skill: distributed_systems
            difficulty: 2
          - slug: d5-q5
            type: mcq
            prompt: Un servicio crea una orden en su base y luego publica `OrderCreated` en Pub/Sub. A veces la orden se guarda pero el evento se pierde. ¿Qué patrón lo resuelve?
            options:
              - Two-phase commit con Pub/Sub
              - "Transactional outbox: guardar el evento en una tabla en la misma transacción y publicarlo después"
              - Reintentar la publicación en un hilo aparte
              - Publicar antes de guardar
            answer: 1
            explanation: La orden y el evento se guardan juntos; un proceso aparte publica la tabla outbox (al-menos-una-vez, con consumidores idempotentes).
            skill: distributed_systems
            difficulty: 2
          - slug: d5-q6
            type: tf
            prompt: En una entrevista de diseño, decir 'el trade-off es que perdemos X a cambio de Y' es una señal positiva.
            answer: true
            explanation: No hay diseños perfectos. Nombrar lo que sacrificas demuestra criterio de ingeniero senior.
            skill: distributed_systems
            difficulty: 1
          - slug: d5-q7
            type: mcq
            prompt: Un proceso que tenía un lock distribuido se pausa 30 s por el garbage collector, el lock expira, otro lo toma… y el primero despierta y escribe. ¿Qué lo evita?
            options:
              - Un lock más largo
              - "Un fencing token: un número que crece con cada lock y que el almacenamiento verifica, rechazando escrituras con un token viejo"
              - Reiniciar el proceso
              - Usar System.currentTimeMillis()
            answer: 1
            explanation: Ningún timeout te protege de pausas largas. El recurso debe rechazar al 'líder zombi' por su token viejo.
            skill: distributed_systems
            difficulty: 3
          - slug: d5-q8
            type: order
            prompt: "Ordena las etapas de una respuesta de system design:"
            options:
              - Requisitos y preguntas
              - Estimaciones rápidas
              - API y modelo de datos
              - Diseño de alto nivel
              - Profundizar en lo más difícil y en los fallos
              - Trade-offs y monitoreo
            answer:
