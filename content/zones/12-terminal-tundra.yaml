  # ================================================================ NIVEL 4
  - slug: tundra-4-veteran
    number: 4
    title: "Veteran — El Linux de los contenedores y de la nube"
    story: "Ahora miras tus propias cabañas con otros ojos: quién es PID 1, con qué usuario corren y qué pasa cuando en la nube no hay terminal que abrir."
    quests:
      - slug: tundra-4-learn-containers
        type: learn
        title: Un contenedor es un proceso Linux (y PID 1 lo cambia todo)
        required: true
        estimated_min: 30
        skills: { linux: 0.7, microservices_gcp: 0.3 }
        resources:
          - { ref: res-linux-docker-dockerfile }
          - { ref: res-linux-docker-exec }
        payload:
          note_prompt: "Explica por qué `CMD mi-app` (forma shell) y `CMD [\"mi-app\"]` (forma exec) se comportan distinto al parar el contenedor, y qué es PID 1."
          summary_md: |
            - Un contenedor no es una máquina virtual: es **un proceso** (y sus hijos) aislado por el kernel. Por eso arranca en milisegundos y por eso comparte el kernel de tu máquina.
            - El proceso que arrancas es **PID 1**, y PID 1 tiene un trato especial: las señales que no atiende explícitamente se ignoran. Si PID 1 no escucha SIGTERM, `docker stop` espera y acaba mandando SIGKILL (código 137).
            - **Forma exec** `CMD ["app", "--flag"]`: tu programa es PID 1 y recibe las señales. **Forma shell** `CMD app --flag`: se ejecuta `/bin/sh -c`, y ese shell suele quedarse como PID 1 y no reenvía nada a tu app.
            - **Capas**: cada instrucción del Dockerfile crea una capa cacheada. Copia primero lo que cambia poco (`package.json`) y después el código, o romperás la caché en cada build.
            - **Tamaño**: `debian` (completa) → `slim` → `alpine` → `distroless`. Cuanto más pequeña, menos superficie de ataque… y menos herramientas para depurar dentro.
            - Tu propia app es un caso de estudio: mira el `CMD` del Dockerfile de QuestMap y luego `docker exec questmap-app-1 cat /proc/1/comm`.

      - slug: tundra-4-learn-hardening
        type: learn
        title: Usuario no-root, permisos y secretos en una imagen
        required: true
        estimated_min: 30
        skills: { linux: 0.5, security: 0.5 }
        resources:
          - { ref: res-linux-docker-best-practices }
          - { ref: res-linux-docker-rootless, required: false }
        payload:
          note_prompt: "¿Qué gana un atacante si tu contenedor corre como root y logra ejecutar código dentro? Nombra tres cosas que harías en el Dockerfile para limitarlo."
          summary_md: |
            - Por defecto un contenedor corre como **root**. Si alguien logra ejecutar código dentro, es root en ese espacio y queda un paso más cerca de tu host.
            - El antídoto son tres líneas: crear un usuario (`RUN useradd -r -u 10001 app`), copiar con su dueño (`COPY --chown=app:app`) y cambiar de usuario (`USER app`) antes del `ENTRYPOINT`.
            - Permisos mínimos: `755` para lo ejecutable, `644` para lo que solo se lee, `600` para claves. Y si puedes, sistema de archivos de solo lectura (`read_only: true` en compose).
            - **Secretos**: una variable de entorno la ve cualquiera que inspeccione el contenedor (`docker inspect`), y un `ARG` queda grabado en la historia de la imagen. Para secretos de verdad, un gestor (Secret Manager en GCP) o un archivo montado.
            - Recuerda lo que viste en el nivel 1: tu `questmap-app-1` ya hace lo correcto (`USER node`), y el de Postgres mantiene sus datos en `drwx------`.

      - slug: tundra-4-learn-cloud
        type: learn
        title: Depurar sin terminal — kubectl, GKE y ssh
        required: true
        estimated_min: 30
        skills: { linux: 0.6, microservices_gcp: 0.4 }
        resources:
          - { ref: res-linux-k8s-debug-pod }
          - { ref: res-linux-kubectl-cheatsheet, required: false }
          - { ref: res-linux-gke-logs, required: false }
        payload:
          note_prompt: "En GKE no puedes 'entrar a la máquina' como en tu laptop. Explica en 3–4 líneas cómo depurarías un pod que se reinicia solo, en orden."
          summary_md: |
            - En la nube las máquinas son ganado, no mascotas: se reemplazan. Por eso lo primero no es entrar, es **leer**.
            - `kubectl logs <pod>` (y `--previous` para el contenedor que murió) → lo que escribió en stdout.
            - `kubectl describe pod <pod>` → los eventos: `OOMKilled`, `CrashLoopBackOff`, el healthcheck que falla. Aquí está la mitad de las respuestas.
            - `kubectl exec -it <pod> -- sh` → un comando dentro, si la imagen trae shell. En una distroless no lo tienes: para eso existen los contenedores efímeros de depuración.
            - En GCP los logs del contenedor acaban en **Cloud Logging**, así que el `grep` del nivel 2 se vuelve una consulta de filtro. La idea es la misma: filtrar, contar, ordenar.
            - `ssh` con par de claves sigue siendo cómo entras a una VM: clave privada en tu máquina con permisos `600`, pública en el servidor.

      - slug: tundra-4-glossary
        type: glossary
        title: Vocabulario de contenedores y nube
        required: true
        estimated_min: 15
        skills: { linux: 1.0 }
        payload:
          terms: [lx-pid1, lx-entrypoint, lx-base-image, lx-distroless, lx-non-root, lx-env-var, lx-ssh-key, lx-kubectl-exec]

      - slug: tundra-4-lab-dockerfile
        type: lab
        title: "Lab: arregla un Dockerfile roto (y mide la diferencia)"
        required: true
        estimated_min: 75
        skills: { linux: 0.6, security: 0.4 }
        payload:
          goal: "Construir a propósito una imagen con los cuatro errores clásicos (root, forma shell, imagen gorda, log a archivo), comprobar cada síntoma con el terminal, arreglarla y medir que el apagado pasa de varios segundos con código 137 a menos de dos segundos con código 0."
          steps:
            - title: Carpeta de trabajo
              body: "Desde PowerShell, FUERA del repo de QuestMap para no mezclar."
              commands:
                - "mkdir $HOME\\tundra-lab; cd $HOME\\tundra-lab"
            - title: El servicio de juguete
              body: "Un servicio que solo espera. Nota que atrapa SIGTERM para apagarse con elegancia."
              commands:
                - "@'"
                - "#!/bin/sh"
                - "trap 'echo \"apagando con calma\"; exit 0' TERM"
                - "echo \"listening\""
                - "while true; do sleep 1; done"
                - "'@ | Set-Content -NoNewline serve.sh"
            - title: El Dockerfile malo
              body: "Cuatro errores a propósito: imagen completa, root, forma shell en el CMD y nada de permisos explícitos."
              commands:
                - "@'"
                - "FROM debian:bookworm"
                - "COPY serve.sh /serve.sh"
                - "RUN chmod 755 /serve.sh"
                - "CMD /serve.sh"
                - "'@ | Set-Content Dockerfile.bad"
                - "docker build -f Dockerfile.bad -t tundra-bad ."
            - title: Diagnostica los síntomas
              body: "Antes de arreglar nada, demuestra cada problema con un comando."
              commands:
                - "docker run -d --name t-bad tundra-bad"
                - "docker exec t-bad cat /proc/1/comm        # ¿quién es PID 1?"
                - "docker exec t-bad id -un                  # ¿con qué usuario corre?"
                - "docker images tundra-bad --format '{{.Size}}'"
                - "Measure-Command { docker stop t-bad }     # cuánto tarda en parar"
                - "docker inspect -f '{{.State.ExitCode}}' t-bad"
            - title: El Dockerfile bueno
              body: "Imagen slim, usuario sin privilegios, dueño explícito al copiar y forma exec en el ENTRYPOINT."
              commands:
                - "@'"
                - "FROM debian:bookworm-slim"
                - "RUN useradd -r -u 10001 app"
                - "COPY --chown=app:app serve.sh /app/serve.sh"
                - "RUN chmod 755 /app/serve.sh"
                - "USER app"
                - "ENTRYPOINT [\"/app/serve.sh\"]"
                - "'@ | Set-Content Dockerfile.good"
                - "docker build -f Dockerfile.good -t tundra-good ."
            - title: Mide la diferencia
              commands:
                - "docker run -d --name t-good tundra-good"
                - "docker exec t-good cat /proc/1/comm"
                - "docker exec t-good id -un"
                - "docker images tundra-good --format '{{.Size}}'"
                - "Measure-Command { docker stop t-good }"
                - "docker inspect -f '{{.State.ExitCode}}' t-good"
                - "docker logs t-good"
            - title: Mira tu propio Dockerfile con esos ojos
              body: "Vuelve al repo de QuestMap, abre el Dockerfile y compara su CMD con lo que acabas de aprender. Anota qué hace bien y qué harías distinto."
              commands:
                - "cd $HOME\\Documents\\Claude_Learn\\Questmap"
                - "docker exec questmap-app-1 cat /proc/1/comm"
                - "docker exec questmap-app-1 id -un"
            - title: Limpia
              commands:
                - "docker rm -f t-bad t-good; docker rmi tundra-bad tundra-good"
          expected: "En la imagen mala PID 1 es `sh` (tu script queda como hijo y nunca recibe la señal), el usuario es `root` y la imagen pesa unos 120 MB; `docker stop` tarda varios segundos y el contenedor acaba con código 137, es decir matado. En la buena PID 1 es `serve.sh`, el usuario es `app`, la imagen ronda los 80 MB, el apagado tarda ~1 segundo y el código de salida es 0; además `docker logs` muestra el mensaje 'apagando con calma', prueba de que la señal llegó. En tu propia app, `/proc/1/comm` responde `npm start` (porque el CMD es la forma `sh -c …`) y el usuario es `node`: lo del usuario está bien resuelto, lo de PID 1 es exactamente el caso que acabas de medir."
          checklist:
            - "Demostré con comandos los cuatro problemas antes de arreglarlos"
            - "Puedo explicar por qué la forma exec recibe las señales y la shell no"
            - "La imagen buena corre como usuario no-root y lo comprobé con `id -un`"
            - "Medí el apagado en los dos casos y sé qué significa el código 137 frente al 0"
            - "Miré el Dockerfile de QuestMap y sé qué le cambiaría"
          hints:
            - "Si `Set-Content` te deja el script con saltos de línea de Windows, el contenedor dirá 'no such file or directory' al arrancar: agrégale `-NoNewline` o conviértelo con `dos2unix` dentro del contenedor."
            - "`Measure-Command` no imprime la salida del comando, solo el tiempo. Mira el campo TotalSeconds."
            - "Si el contenedor malo no arranca, revisa que `serve.sh` tenga permisos de ejecución (`chmod 755`)."
          evidence_hint: "Pega los dos `/proc/1/comm`, los dos `id -un`, los dos tiempos de `docker stop` con su código de salida, y tu Dockerfile bueno."

      - slug: tundra-4-quiz
        type: quiz
        title: Quiz — Contenedores, usuarios y nube
        required: true
        estimated_min: 15
        skills: { linux: 1.0 }
        questions:
          - slug: tu4-q1
            type: mcq
            prompt: "¿Por qué `CMD [\"app\"]` es mejor que `CMD app` para un servicio?"
            options: [
              "Porque arranca más rápido",
              "Porque tu programa queda como PID 1 y recibe SIGTERM directamente",
              "Porque usa menos memoria",
              "Porque permite varios comandos"
            ]
            answer: 1
            explanation: "En forma shell se interpone un `/bin/sh -c` que normalmente queda como PID 1 y no reenvía las señales: el apagado deja de ser limpio y acaba en SIGKILL."
            skill: linux
            difficulty: 2
          - slug: tu4-q2
            type: mcq
            prompt: "Un contenedor tarda siempre 10 segundos exactos en pararse. ¿Qué sospechas?"
            options: [
              "La red está lenta",
              "Su PID 1 no atiende SIGTERM, así que Docker agota el plazo de gracia y manda SIGKILL",
              "La imagen es muy grande",
              "Falta memoria"
            ]
            answer: 1
            explanation: "Ese 'exactamente 10 segundos' es la firma del plazo de gracia agotado. Se arregla con la forma exec, o atrapando la señal (`trap`) en el script de arranque."
            skill: linux
            difficulty: 2
          - slug: tu4-q3
            type: tf
            prompt: "Un contenedor que corre como root es root solo dentro del contenedor, así que no supone ningún riesgo."
            answer: false
            explanation: "Reduce el riesgo, no lo elimina: junto a una mala configuración o una vulnerabilidad del runtime, ser root dentro es el primer escalón para salir. Por eso `USER` no es opcional en producción."
            skill: security
            difficulty: 2
          - slug: tu4-q4
            type: order
            prompt: "Ordena el final de un Dockerfile endurecido."
            options: [
              "RUN useradd -r -u 10001 app",
              "COPY --chown=app:app app.jar /app/app.jar",
              "USER app",
              "ENTRYPOINT [\"java\", \"-jar\", \"/app/app.jar\"]"
            ]
            answer: [0, 1, 2, 3]
            explanation: "Creas el usuario, copias con su dueño, cambias de usuario y entonces declaras el arranque. Si pones `USER` antes del COPY, puede fallar por permisos de escritura."
            skill: security
            difficulty: 2
          - slug: tu4-q5
            type: mcq
            prompt: "No puedes abrir un shell dentro de un pod en producción porque la imagen es distroless. ¿Qué haces?"
            options: [
              "Reconstruir la imagen con bash y desplegar a producción",
              "Leer `kubectl logs` y `kubectl describe pod`, y si hace falta usar un contenedor efímero de depuración",
              "Reiniciar el pod hasta que funcione",
              "Entrar por ssh al nodo"
            ]
            answer: 1
            explanation: "Lo primero son los logs y los eventos; para mirar dentro existen los *ephemeral debug containers*. Meter herramientas en la imagen de producción es ir en contra del motivo por el que es distroless."
            skill: linux
            difficulty: 3
          - slug: tu4-q6
            type: mcq
            prompt: "¿Dónde ve un pod reiniciándose en bucle la causa 'OOMKilled'?"
            options: [
              "En el código de la aplicación",
              "En `kubectl describe pod`, entre los eventos y el último estado del contenedor",
              "En el Dockerfile",
              "En el navegador"
            ]
            answer: 1
            explanation: "`describe` trae los eventos y el `lastState` con la razón y el código de salida. Es el `dmesg | tail` del mundo Kubernetes."
            skill: debugging_rca
            difficulty: 2
          - slug: tu4-q7
            type: mcq
            prompt: "¿Qué permisos debe tener tu clave privada de ssh?"
            options: ["777", "644", "600", "No importa"]
            answer: 2
            explanation: "600: solo su dueño la lee y escribe. Si está más abierta, el cliente de ssh se niega a usarla, y hace bien."
            skill: security
            difficulty: 1
          - slug: tu4-q8
            type: fill
            prompt: "La instrucción del Dockerfile que cambia el usuario con el que corre el proceso es ______."
            answer: ["USER", "user"]
            explanation: "Va después de instalar y copiar, y antes del ENTRYPOINT. Todo lo que venga detrás se ejecuta con ese usuario."
            skill: security
            difficulty: 1

