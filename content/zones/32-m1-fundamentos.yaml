        xp: 50
        estimated_min: 150
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-gh-diagrams, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un README en inglés que explica qué es OrderBridge, cómo se ejecuta y cómo está armado, con un diagrama."
          spec:
            context: |
              Una persona de reclutamiento técnico va a abrir tu repositorio y le va a dedicar unos
              dos minutos. No va a leer el código primero: va a leer el README, y si puede, va a
              copiar los comandos. El lector es alguien que no te conoce, no habla español y no
              puede preguntarte nada.
            requirements:
              - "El `README.md` de la raíz está escrito completo en inglés."
              - "Sección «Overview»: qué es OrderBridge y qué problema resuelve, en dos o tres frases."
              - "Sección «Tech stack»: lenguaje, framework, base de datos y herramientas, con sus versiones."
              - "Sección «Getting started»: requisitos previos y los comandos exactos para levantarlo con Docker Compose."
              - "Sección «API»: una tabla con método, ruta, si requiere autenticación y códigos de respuesta, más un ejemplo de `curl` para crear un pedido."
              - "Sección «Running the tests»: el comando y qué necesita."
              - "Sección «Architecture»: un diagrama Mermaid y un párrafo que lo explica."
              - "Sección «Design decisions»: dos o tres decisiones, cada una con lo que se eligió, la alternativa y lo que se sacrificó."
              - "La insignia de CI del nivel 9 está arriba, junto al título."
            outputs:
              - { name: "README.md", type: "Markdown", desc: "Se lee completo en menos de cinco minutos." }
              - { name: "diagrama", type: "bloque `mermaid`", desc: "GitHub lo dibuja solo. Muestra cliente, API, capas internas y PostgreSQL, con flechas etiquetadas." }
            rules:
              - "Cada comando del README funciona copiado tal cual en un clon limpio. Ninguno depende de algo que solo existe en tu máquina."
              - "Los comandos van en bloques de código con su lenguaje (`bash`, `json`), no en medio de un párrafo."
              - "El README no contiene credenciales reales: remite a `.env.example`."
              - "Las decisiones de diseño dicen el costo. «Usé PostgreSQL porque es bueno» no es una decisión; «PostgreSQL en lugar de H2 en las pruebas: más lentas, pero prueban el motor real» sí."
              - "Inglés simple y directo, en presente. Frases cortas antes que frases elegantes."
              - "No se describe lo que no existe todavía como si existiera. Lo pendiente va en una sección «Roadmap»."
            examples:
              - title: "Tabla de la sección API"
                lang: "markdown"
                output: |
                  | Method | Path         | Auth  | Success | Errors        |
                  |--------|--------------|-------|---------|---------------|
                  | GET    | /status      | No    | 200     | —             |
                  | POST   | /orders      | Basic | 201     | 400, 401, 409 |
                  | GET    | /orders      | No    | 200     | —             |
                  | GET    | /orders/{id} | No    | 200     | 400, 404      |
                  | PUT    | /orders/{id} | Basic | 200     | 400, 401, 404 |
                  | DELETE | /orders/{id} | Basic | 204     | 401, 404      |
              - title: "Una decisión de diseño bien escrita"
                lang: "markdown"
                output: |
                  ### Schema managed by Flyway, not by Hibernate
                  Hibernate only validates the schema (`ddl-auto=validate`); every change is a
                  versioned SQL migration. This costs a few minutes per change, but the schema
                  history is reviewable and production never changes by surprise.
            edge_cases:
              - "Abre el README en GitHub, no solo en el editor: el diagrama Mermaid y las tablas pueden verse bien en local y rotos en la web."
              - "Sigue tu propio «Getting started» en una carpeta limpia. Cada paso que tuviste que improvisar es un paso que falta."
              - "Pásale el README a un corrector de inglés o a alguien que lo lea en voz alta: los errores de gramática restan más de lo que parece."
            out_of_scope:
              - "Documentación OpenAPI o Swagger."
              - "Un sitio de documentación aparte o una wiki."
              - "Traducción al español."
          steps:
            - title: "Lo esencial"
              body: "Escribe en inglés: qué hace el servicio, requisitos previos, cómo ejecutarlo con Docker Compose y cómo correr las pruebas."
            - title: "Diagrama"
              body: "Dibuja con Mermaid las piezas (cliente, API, base de datos) y cómo se comunican."
            - title: "Decisiones"
              body: "Agrega una sección corta con dos o tres decisiones de diseño y lo que se sacrificó en cada una."
          checklist:
            - "Todo el README está en inglés"
            - "Los pasos para ejecutar funcionan copiándolos tal cual"
            - "El diagrama se ve en GitHub"

