zone: bigquery-bay
terms: [ { slug: bq-inner-join, term: INNER JOIN, category: sql, definition_es: Une dos tablas y devuelve solo las filas que tienen coincidencia en ambas., definition_en: Returns only rows that match in both tables., example_en: An inner join drops customers without orders., analogy: "Una fiesta solo para parejas: si no viniste acompañado, no entras.", see_also: [ bq-left-join ] }, { slug: bq-left-join, term: LEFT JOIN, category: sql, definition_es: "Devuelve todas las filas de la tabla izquierda; si no hay coincidencia, las columnas de la derecha vienen NULL.", definition_en: "Keeps all rows from the left table, with NULLs when there is no match.", example_en: Use a left join to include customers with zero orders., analogy: La lista completa de alumnos con su nota; quien no presentó examen aparece con la casilla vacía., see_also: [ bq-inner-join, bq-null ] }, { slug: bq-group-by, term: GROUP BY, category: sql, definition_es: "Agrupa filas con el mismo valor para calcular agregados (SUM, COUNT, AVG) por grupo.", definition_en: Groups rows to compute aggregates per group., example_en: Group by country to count customers., analogy: Separar las monedas por tipo antes de contarlas., see_also: [ bq-having ] }, { slug: bq-having, term: HAVING, category: sql, definition_es: Filtra grupos ya agregados (después del GROUP BY). WHERE filtra filas antes de agrupar., definition_en: Filters groups after aggregation., example_en: HAVING COUNT(*) > 1 keeps only repeated values., analogy: Primero armas los equipos (GROUP BY) y después eliminas a los que tienen menos de 5 jugadores (HAVING)., see_also: [ bq-group-by ] }, { slug: bq-null, term: "NULL", category: sql, definition_es: Valor desconocido o ausente. Cualquier comparación con NULL da desconocido; se usa IS NULL. COUNT(columna) y SUM lo ignoran., definition_en: A missing or unknown value., example_en: "Use IS NULL, not = NULL.", analogy: "Una casilla de un formulario que nadie llenó: no es cero ni vacío, es 'no sabemos'.", see_also: [ bq-left-join ] }, { slug: bq-cte, term: CTE (WITH), category: sql, definition_es: Subconsulta con nombre definida con WITH al inicio de la consulta; hace legibles las consultas largas y se puede reutilizar dentro de ella., definition_en: A named subquery defined with WITH., example_en: I used a CTE to compute paid orders first., analogy: Preparar los ingredientes en recipientes con etiqueta antes de cocinar., see_also: [ bq-group-by ] }, { slug: bq-fan-out-join, term: fan-out (row multiplication), category: sql, definition_es: Cuando un JOIN uno-a-muchos repite filas del lado 'uno' y los agregados posteriores salen inflados., definition_en: A join that duplicates rows and inflates aggregates., example_en: The revenue doubled because of a fan-out join., analogy: Contar a una persona una vez por cada foto en la que aparece., see_also: [ bq-inner-join ] }, { slug: bq-data-warehouse, term: data warehouse, category: bigquery, definition_es: "Base de datos diseñada para analizar grandes volúmenes de datos históricos (reportes, tendencias), no para transacciones de una fila.", definition_en: A database designed for analytics over large historical data., example_en: We load order events into the data warehouse every hour., analogy: "La biblioteca central donde se archiva todo para investigar, distinta de la caja registradora de la tienda.", see_also: [ bq-olap-oltp ] }, { slug: bq-columnar, term: columnar storage, category: bigquery, definition_es: Guardar los datos por columna en lugar de por fila; una consulta lee solo las columnas que usa y se comprime muy bien., definition_en: Storing data by column so queries read only the columns they need., example_en: Columnar storage makes SELECT * expensive., analogy: Una hoja de cálculo donde puedes leer solo la columna de precios sin mirar las demás., see_also: [ bq-bytes-processed ] }, { slug: bq-serverless, term: serverless, category: bigquery, definition_es: "No aprovisionas ni operas servidores: el proveedor asigna el cómputo automáticamente por cada consulta.", definition_en: You don't manage servers; the provider allocates compute., example_en: "BigQuery is serverless, so we never resize clusters.", analogy: Pedir un taxi en lugar de comprar y mantener un carro., see_also: [ bq-slot ] }, { slug: bq-dataset, term: dataset, category: bigquery, definition_es: Contenedor de tablas y vistas dentro de un proyecto; define ubicación (región) y permisos., definition_en: A container of tables inside a project., example_en: Create a dataset called analytics in the US region., analogy: Una carpeta del proyecto con sus propias llaves de acceso. }, { slug: bq-sandbox, term: BigQuery sandbox, category: bigquery, definition_es: "Modo gratuito de BigQuery sin tarjeta: 1 TiB de consultas al mes y 10 GiB de almacenamiento; las tablas expiran a los 60 días.", definition_en: A free BigQuery mode with no credit card required., example_en: I practice window functions in the BigQuery sandbox., analogy: "El área de prueba de un gimnasio: usas las máquinas gratis, pero tu casillero se vacía cada dos meses." }, { slug: bq-bytes-processed, term: bytes processed, category: cost, definition_es: Cantidad de datos que lee una consulta; en el modelo on-demand es lo que se factura., definition_en: "The amount of data a query reads, which drives on-demand cost.", example_en: Partition pruning reduced the bytes processed by 95%., analogy: "El taxímetro: cobra por la distancia recorrida, no por cuántas maletas bajas al final.", see_also: [ bq-dry-run, bq-columnar ] }, { slug: bq-dry-run, term: dry run, category: cost, definition_es: "Ejecutar una consulta en modo validación: estima los bytes que procesará sin ejecutarla ni cobrar.", definition_en: Validates a query and estimates bytes without running it., example_en: Always do a dry run before querying a large table., analogy: Pedir un presupuesto antes de que el mecánico empiece a trabajar., see_also: [ bq-bytes-processed ] }, { slug: bq-olap-oltp, term: OLAP vs OLTP, category: bigquery, definition_es: "OLTP: muchas transacciones pequeñas en tiempo real (crear una orden). OLAP: pocas consultas grandes de análisis (ventas del año por categoría).", definition_en: Transactional workloads vs analytical workloads., example_en: Cassandra serves OLTP; BigQuery serves OLAP., analogy: La caja del supermercado (OLTP) vs la oficina que analiza las ventas del año (OLAP)., see_also: [ bq-data-warehouse ] }, { slug: bq-partition, term: partitioned table, category: performance, definition_es: "Tabla dividida en segmentos (normalmente por día, también por ingesta o rango de enteros) para que las consultas lean solo los que necesitan.", definition_en: "A table divided into segments, usually by date.", example_en: The events table is partitioned by event_date., analogy: "Un archivero con un cajón por día: para el martes no abres los demás.", see_also: [ bq-partition-pruning ] }, { slug: bq-partition-pruning, term: partition pruning, category: performance, definition_es: Cuando el filtro sobre la columna de partición permite a BigQuery saltarse las particiones que no coinciden y leer menos bytes., definition_en: Skipping partitions that don't match the filter., example_en: Partition pruning cut the scan from 2 TB to 40 GB., analogy: Ir directo al cajón correcto en lugar de revisar el archivero entero., see_also: [ bq-partition, bq-bytes-processed ] }, { slug: bq-clustering, term: clustering, category: performance, definition_es: Ordenar los datos de una tabla por hasta 4 columnas para que los filtros sobre ellas lean menos bloques., definition_en: Sorting table data by up to four columns to reduce scanned blocks., example_en: We cluster orders by store_id and status., analogy: "Dentro de cada cajón, las carpetas están en orden alfabético: encuentras rápido la que buscas.", see_also: [ bq-partition ] }, { slug: bq-require-partition-filter, term: require_partition_filter, category: cost, definition_es: Opción de tabla que rechaza consultas que no filtran por la columna de partición. Protege contra escaneos completos accidentales., definition_en: A table option that rejects queries without a partition filter., example_en: Set require_partition_filter on large event tables., analogy: Un cajero que no te deja retirar sin decir de qué cuenta., see_also: [ bq-partition-pruning ] }, { slug: bq-slot, term: slot, category: bigquery, definition_es: Unidad de cómputo de BigQuery (CPU virtual y memoria). Las consultas se reparten entre muchos slots en paralelo., definition_en: A unit of BigQuery compute capacity., example_en: "The query used 2,000 slots for 4 seconds.", analogy: "Cada trabajador de una cuadrilla: más trabajadores, antes se termina la obra.", see_also: [ bq-serverless ] }, { slug: bq-select-star, term: SELECT * (anti-pattern), category: cost, definition_es: "Seleccionar todas las columnas: en un almacén columnar obliga a leer (y pagar) todas, aunque solo uses unas pocas.", definition_en: "Selecting every column, which reads and bills all of them.", example_en: Replace SELECT * with the three columns you need., analogy: Comprar todo el menú del restaurante para comer solo el postre., see_also: [ bq-columnar ] }, { slug: bq-window-function, term: window function, category: sql, definition_es: "Función que calcula sobre un conjunto de filas relacionadas (la ventana, definida con OVER) sin colapsarlas, como hace GROUP BY.", definition_en: A function computed over related rows without collapsing them., example_en: A window function gives each order its rank within the customer., analogy: Comparar a cada alumno con su propio salón sin juntar a todos en un solo promedio., see_also: [ bq-row-number, bq-lag ] }, { slug: bq-row-number, term: ROW_NUMBER / RANK / DENSE_RANK, category: sql, definition_es: "Numeran filas dentro de una ventana. Con empates: ROW_NUMBER no repite (1,2,3,4), RANK repite y salta (1,2,2,4), DENSE_RANK repite sin saltar (1,2,2,3).", definition_en: "Functions that number rows within a window, differing in how they treat ties.", example_en: Use DENSE_RANK to find the second highest value., analogy: Los puestos de una carrera cuando dos corredores llegan empatados., see_also: [ bq-qualify ] }, { slug: bq-lag, term: LAG / LEAD, category: sql, definition_es: Devuelven el valor de la fila anterior (LAG) o siguiente (LEAD) dentro de la ventana; útiles para diferencias entre eventos., definition_en: Access the previous or next row in the window., example_en: LAG gives the date of the customer's previous order., analogy: Mirar la página anterior del diario para ver cuánto cambió algo., see_also: [ bq-window-function ] }, { slug: bq-qualify, term: QUALIFY, category: sql, definition_es: "Cláusula de BigQuery que filtra filas por el resultado de una window function, sin subconsultas.", definition_en: Filters rows by the result of a window function., example_en: QUALIFY ROW_NUMBER() = 1 keeps the latest row per user., analogy: "El HAVING de las ventanas: primero calculas el puesto, después te quedas con los del podio.", see_also: [ bq-row-number ] }, { slug: bq-array, term: ARRAY, category: bigquery, definition_es: Lista ordenada de valores del mismo tipo dentro de una sola celda (ej. las líneas de una orden)., definition_en: An ordered list of values stored in one field., example_en: Each session row has an array of hits., analogy: Una bolsa con varias compras dentro de una sola fila del recibo., see_also: [ bq-unnest, bq-struct ] }, { slug: bq-struct, term: STRUCT, category: bigquery, definition_es: "Campo con subcampos con nombre (como un objeto). Se accede con punto: `totals.transactions`.", definition_en: "A field with named subfields, like an object.", example_en: The address is a struct with city and zip., analogy: Un sobre con varios papeles etiquetados adentro., see_also: [ bq-array ] }, { slug: bq-unnest, term: UNNEST, category: bigquery, definition_es: "Convierte un ARRAY en filas para poder filtrarlas, unirlas o agregarlas.", definition_en: Turns an array into rows., example_en: UNNEST the hits to count page views., analogy: Vaciar la bolsa sobre la mesa para contar cada producto., see_also: [ bq-array ] }, { slug: bq-materialized-view, term: materialized view, category: performance, definition_es: Vista cuyo resultado se guarda y BigQuery mantiene actualizado de forma incremental; acelera y abarata consultas repetidas., definition_en: A precomputed view that BigQuery keeps up to date., example_en: The dashboard reads from a materialized view of daily sales., analogy: Tener el resumen ya escrito en la pizarra en lugar de recalcularlo cada vez que alguien pregunta., see_also: [ bq-partition ] }, { slug: bq-cohort, term: cohort analysis, category: analytics, definition_es: "Agrupar clientes por el momento en que empezaron (ej. mes de primera compra) y seguir su comportamiento en el tiempo, como la retención.", definition_en: Grouping users by start date and tracking their behavior over time., example_en: The cohort analysis shows month-1 retention of 18%., analogy: Seguir a una generación de estudiantes desde que entra hasta que se gradúa., see_also: [ bq-retention ] }, { slug: bq-retention, term: retention rate, category: analytics, definition_es: Porcentaje de clientes que vuelven a comprar (o usar el producto) después de un periodo., definition_en: The share of users who come back after a period., example_en: Retention dropped after the price change., analogy: Cuántos clientes de un restaurante regresan el mes siguiente., see_also: [ bq-cohort ] }, { slug: bq-approx-count-distinct, term: APPROX_COUNT_DISTINCT, category: performance, definition_es: Cuenta valores únicos de forma aproximada (~1 % de error) con mucho menos costo que COUNT(DISTINCT). Ideal para dashboards., definition_en: An approximate distinct count that is much cheaper., example_en: We use APPROX_COUNT_DISTINCT for daily active users., analogy: Estimar el público de un estadio por secciones en lugar de contar persona por persona., see_also: [ bq-select-star ] } ]
