            difficulty: 1
  - slug: gcp-4-expert
    number: 4
    title: Expert — Auth servicio a servicio, secretos y despliegue
    story: En la cima, los servicios hablan entre sí y guardan llaves valiosas. Aprende a que se reconozcan sin contraseñas compartidas y a que ningún secreto termine en git.
    quests:
      - slug: gcp-4-learn-config-secrets
        type: learn
        title: Configuración 12-factor y gestión de secretos
        required: true
        estimated_min: 35
        skills:
          security: 0.6
          microservices_gcp: 0.4
        resources:
          - ref: res-12factor-config
          - ref: res-gcp-secret-manager
          - ref: res-cloud-run-env
            required: false
        payload:
          note_prompt: ¿Por qué la configuración y los secretos no van en el código ni en el repositorio? ¿Qué diferencia hay entre una variable de entorno normal y un secreto en Secret Manager?
      - slug: gcp-4-learn-workload-identity
        type: learn
        title: Identidad de cargas de trabajo y auth entre servicios
        required: true
        estimated_min: 45
        skills:
          security: 0.6
          cicd: 0.2
          microservices_gcp: 0.2
        resources:
          - ref: res-gcp-wif
          - ref: res-cloud-run-s2s
          - ref: res-gh-auth-action
            required: false
        payload:
          note_prompt: Explica cómo `orders` llama de forma segura a un servicio privado `payments` en Cloud Run (identidad, rol y token). Luego explica por qué un pipeline de GitHub Actions no debería usar una llave JSON de service account.
          summary_md: |
            - Servicio a servicio en Cloud Run: `orders` corre con su propia service account; esa cuenta recibe `roles/run.invoker` sobre `payments`; `orders` pide un ID token (con la URL de payments como audience) y lo manda en `Authorization: Bearer`.
            - Sin llaves: el código no guarda credenciales; la plataforma le da la identidad a la carga de trabajo.
            - CI/CD sin llaves: Workload Identity Federation permite que GitHub Actions cambie su token OIDC por credenciales de GCP de corta duración. No hay JSON que se pueda filtrar.
            - Secretos de verdad (API keys de terceros): Secret Manager, con acceso por IAM y versiones; montados como variable o archivo en Cloud Run.
      - slug: gcp-4-glossary
        type: glossary
        title: Vocabulario de seguridad en la nube y despliegue
        required: true
        estimated_min: 10
        skills:
          security: 0.6
          cicd: 0.4
        payload:
          terms:
            - gcp-twelve-factor
            - gcp-secret-manager
            - gcp-wif
            - gcp-id-token
            - gcp-cd
            - gcp-canary
            - gcp-revision
      - slug: gcp-4-lab-config
        type: lab
        title: "Lab: configuración fuera del código y secretos en el pipeline"
        required: true
        estimated_min: 75
        skills:
          security: 0.5
          cicd: 0.3
          microservices_gcp: 0.2
        payload:
          goal: Sacar la configuración de `orders` a variables de entorno, demostrar que ningún secreto llega a git y usar un secreto de GitHub en el pipeline sin exponerlo.
          steps:
            - title: Configuración desde el entorno
              body: |
                Imagina que `orders` llama a un proveedor de fraude. En `application.properties`:

                ```properties
                fraud.api.url=${FRAUD_API_URL:http://localhost:9999}
                fraud.api.key=${FRAUD_API_KEY:}
                ```

                Crea `FraudProperties` con `@ConfigurationProperties(prefix = "fraud.api")` y al arrancar registra un log con la URL y SOLO si la llave está presente (nunca su valor):

                ```java
                log.info("Fraud API {} (key configured: {})", props.url(), !props.key().isBlank());
                ```
            - title: Un .env local que nunca se sube
              commands:
                - Set-Content .env 'FRAUD_API_KEY=local-dev-key'; Add-Content .gitignore '.env'
                - "git status --short   # .env NO debe aparecer"
            - title: Corre el contenedor con la configuración inyectada
              commands:
                - docker build -t orders:local .; docker run --rm -d --name orders-cfg -p 127.0.0.1:8081:8080 --env-file .env -e FRAUD_API_URL=https://fraud.example.test orders:local
                - Start-Sleep -Seconds 15; docker logs orders-cfg | Select-String 'Fraud API'
                - docker rm -f orders-cfg
            - title: Busca secretos en tu historial
              body: Comprueba que la llave nunca entró al repositorio (si aparece, habría que rotarla y limpiar el historial).
              commands:
                - git log -p --all | Select-String 'local-dev-key'
            - title: Un secreto de GitHub en el pipeline
              body: |
                En GitHub: Settings → Secrets and variables → Actions → New repository secret: `FRAUD_API_KEY` con un valor de prueba. En `ci.yml`, agrega al step de pruebas:

                ```yaml
                      - name: Build and test
                        run: ./mvnw -B verify
                        env:
                          FRAUD_API_KEY: ${{ secrets.FRAUD_API_KEY }}
                ```

                Haz push y revisa el log: si algo imprime el secreto, GitHub lo enmascara como `***`.
            - title: (Lectura) Así se desplegaría sin llaves
              body: |
                Un job de despliegue a Cloud Run con Workload Identity Federation se ve así (no hace falta ejecutarlo; requiere configurar el pool de identidades en GCP):

                ```yaml
                  deploy:
                    needs: build
                    runs-on: ubuntu-latest
                    permissions:
                      contents: read
                      id-token: write
                    steps:
                      - uses: actions/checkout@v7
                      - uses: google-github-actions/auth@v3
                        with:
                          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
                          service_account: ${{ vars.DEPLOY_SA }}
                      - run: gcloud run deploy orders --source . --region us-central1 --no-allow-unauthenticated
                ```
          expected: "El log muestra la URL de fraude y 'key configured: true', nunca el valor. `.env` no aparece en git status y la búsqueda en el historial no encuentra la llave. El pipeline sigue en verde usando el secreto de GitHub."
          checklist:
            - La URL y la llave salen de variables de entorno
            - El log nunca imprime el valor de la llave
            - .env está en .gitignore y no está en el historial
            - El pipeline usa el secreto de GitHub y sigue en verde
            - "Puedo explicar por qué el job de despliegue necesita `id-token: write` y no una llave JSON"
          hints:
            - Si `@ConfigurationProperties` no se carga, agrega `@ConfigurationPropertiesScan` a la clase principal o `@EnableConfigurationProperties(FraudProperties.class)`.
            - 'Un record funciona bien: `@ConfigurationProperties(prefix = "fraud.api") public record FraudProperties(String url, String key) {}`.'
          evidence_hint: Pega la línea del log 'Fraud API …', la salida de git status y la URL de la ejecución verde del pipeline.
      - slug: gcp-4-quiz
        type: quiz
        title: Quiz — Seguridad y despliegue en la nube
        required: true
        estimated_min: 15
        skills:
          security: 0.5
          cicd: 0.3
          microservices_gcp: 0.2
        questions:
          - slug: g4-q1
            type: mcq
            prompt: Según 12-factor, ¿dónde va la URL de la base de datos de producción?
            options:
              - En el código
              - En application.properties commiteado
              - En variables de entorno (o un gestor de secretos) del entorno de despliegue
              - En el README
            answer: 2
            explanation: La configuración que cambia entre entornos va en el entorno. El mismo artefacto sirve para dev, staging y prod.
            skill: security
            difficulty: 1
          - slug: g4-q2
            type: mcq
            prompt: "`orders` (Cloud Run) debe llamar a `payments` (Cloud Run, privado). ¿Qué necesita?"
            options:
              - Una contraseña compartida en el código
              - Que su service account tenga roles/run.invoker sobre payments y enviar un ID token en Authorization
              - Que payments sea público
              - Una VPN
            answer: 1
            explanation: Identidad (service account) + autorización (run.invoker) + prueba de identidad (ID token firmado por Google).
            skill: security
            difficulty: 2
          - slug: g4-q3
            type: tf
            prompt: Workload Identity Federation permite que GitHub Actions obtenga credenciales de GCP de corta duración sin guardar una llave JSON de service account.
            answer: true
            explanation: GitHub emite un token OIDC por ejecución y GCP lo cambia por credenciales temporales. Nada de llaves de larga vida que se puedan filtrar.
            skill: security
            difficulty: 2
          - slug: g4-q4
            type: mcq
            prompt: Descubres que una API key se commiteó hace 3 meses. ¿Qué haces primero?
            options:
              - Borrar el commit y listo
              - Revocar/rotar la llave inmediatamente; después limpiar el historial y revisar su uso
              - Hacer el repo privado
              - Nada si nadie se dio cuenta
            answer: 1
            explanation: "Asume que está comprometida: se rota primero. Limpiar el historial no deshace las copias que ya existan."
            skill: security
            difficulty: 1
          - slug: g4-q5
            type: mcq
            prompt: ¿Qué es un despliegue canary?
            options:
              - Desplegar de noche
              - Enviar un pequeño porcentaje del tráfico a la nueva versión y aumentarlo si las métricas están bien
              - Desplegar sin pruebas
              - Desplegar en otra región
            answer: 1
            explanation: En Cloud Run se hace repartiendo tráfico entre revisiones (ej. 5 % a la nueva). Si el error rate sube, vuelves todo a la anterior.
            skill: cicd
            difficulty: 1
          - slug: g4-q6
            type: fill
            prompt: "Para que un job de GitHub Actions pueda pedir un token OIDC necesita el permiso `id-token: ______`."
            answer:
              - write
            explanation: "Sin `id-token: write` el job no puede obtener el token que GCP intercambia por credenciales."
            skill: cicd
            difficulty: 2
          - slug: g4-q7
            type: mcq
            prompt: ¿Qué diferencia hay entre CI y CD?
            options:
              - Ninguna
              - CI integra y verifica cada cambio; CD lleva automáticamente los cambios verificados a un entorno (y a veces a producción)
              - CD es solo para Java
              - CI es manual
            answer: 1
            explanation: "Continuous Delivery: siempre listo para desplegar (con aprobación). Continuous Deployment: despliega solo si todo pasa."
            skill: cicd
            difficulty: 1
          - slug: g4-q8
            type: order
            prompt: "Ordena un despliegue seguro a Cloud Run:"
            options:
              - CI verde (pruebas + imagen)
              - Desplegar una nueva revisión sin tráfico
              - Mover un pequeño % del tráfico (canary)
              - Observar error rate y latencia
              - Subir al 100 % o volver a la revisión anterior
            answer:
              - 0
              - 1
              - 2
              - 3
              - 4
            explanation: Las revisiones inmutables de Cloud Run hacen que el rollback sea mover el tráfico de vuelta, en segundos.
            skill: cicd
            difficulty: 2
  - slug: gcp-5-boss
    number: 5
    title: Boss — Microservicio en GCP con pipeline
    story: "El guardián de los picos quiere ver tu servicio volar: empaquetado, probado por un robot, configurado sin secretos en el código y listo para la nube. Y quiere que se lo expliques en inglés."
    quests:
      - slug: gcp-5-learn-review
        type: learn
        title: Repaso — de mi PC a producción
        required: true
        estimated_min: 30
        skills:
          microservices_gcp: 0.5
          cicd: 0.3
          security: 0.2
        resources:
          - ref: res-cloud-run-java-quickstart
          - ref: res-gcp-wif
            required: false
        payload:
          note_prompt: "Dibuja (en texto o Mermaid) el camino de un commit de `orders` hasta Cloud Run: qué pasa en CI, dónde se guarda la imagen, qué identidad despliega, con qué identidad corre el servicio y cómo harías rollback."
          summary_md: |
            Checklist de un servicio listo para producción en GCP:
            - Imagen multi-stage, no root, que escucha en `$PORT`.
            - CI en cada PR: compila, prueba y construye la imagen; protección de la rama main.
            - CD sin llaves (Workload Identity Federation) y despliegue por revisiones (canary y rollback).
            - El servicio corre con su propia service account de mínimo privilegio.
            - Configuración por entorno y secretos en Secret Manager; nada sensible en git.
            - Privado por defecto (`--no-allow-unauthenticated`) y llamadas entre servicios con ID tokens.
            - Health checks, métricas y alertas (Observatory) y presupuesto con alertas.
      - slug: gcp-5-quiz-final
        type: quiz
        title: Examen final — GCP & Microservices Peaks
        required: true
        estimated_min: 20
        skills:
          microservices_gcp: 0.5
          cicd: 0.25
          security: 0.25
        questions:
          - slug: g5-q1
            type: mcq
            prompt: Una nueva versión de `orders` sube el error rate al 8 % justo después del despliegue. En Cloud Run, ¿cuál es la mitigación más rápida?
            options:
              - Depurar en producción
              - Enviar el 100 % del tráfico a la revisión anterior
              - Borrar el servicio
              - Aumentar las instancias
            answer: 1
            explanation: "Las revisiones son inmutables: el rollback es mover el tráfico en segundos. Después se investiga con calma."
            skill: cicd
            difficulty: 1
          - slug: g5-q2
            type: mcq
            prompt: ¿Cuál es el principal riesgo de dar `roles/editor` a la service account con la que corre tu servicio?
            options:
              - Que sea más lento
              - Si el servicio es comprometido, el atacante puede modificar casi todo el proyecto
              - Que no pueda leer secretos
              - Ninguno
            answer: 1
            explanation: Mínimo privilegio limita el radio de explosión de un incidente de seguridad.
            skill: security
            difficulty: 1
          - slug: g5-q3
            type: tf
            prompt: Separar un monolito en 20 microservices siempre mejora la velocidad del equipo.
            answer: false
            explanation: Los microservicios agregan red, consistencia eventual, observabilidad y despliegues que operar. Convienen cuando hay equipos y dominios independientes; si no, un monolito modular suele ser mejor.
            skill: microservices_gcp
            difficulty: 2
          - slug: g5-q4
            type: mcq
            prompt: "Pregunta de entrevista: '¿Cloud Run o GKE para la API de órdenes de Home Depot?' ¿Mejor estructura de respuesta?"
            options:
              - Siempre GKE porque es más profesional
              - "Depende: Cloud Run si es HTTP sin estado y quieres poca operación; GKE si necesitas control fino, cargas con estado o el estándar de la empresa es Kubernetes. Y explico los trade-offs."
              - Siempre Cloud Run porque es más barato
              - Cualquiera, da igual
            answer: 1
            explanation: Los entrevistadores buscan criterios y trade-offs, no una respuesta absoluta.
            skill: microservices_gcp
            difficulty: 1
          - slug: g5-q5
            type: mcq
            prompt: El pipeline necesita desplegar a GCP. ¿Qué es lo más seguro?
            options:
              - Guardar una llave JSON en el repo
              - Guardar la llave JSON como secreto de GitHub
              - Workload Identity Federation con una service account de despliegue de mínimo privilegio
              - Usar tu cuenta personal
            answer: 2
            explanation: Sin llaves de larga vida y con permisos acotados. La llave como secreto de GitHub es mejor que en el repo, pero sigue siendo una llave que se puede filtrar.
            skill: security
            difficulty: 2
          - slug: g5-q6
            type: fill
            prompt: Repartir una pequeña parte del tráfico a la versión nueva para probarla en producción se llama despliegue ______ (en inglés).
            answer:
              - canary
            explanation: "El nombre viene del canario que usaban los mineros para detectar gases: si algo sale mal, lo ves con poco tráfico afectado."
            skill: cicd
            difficulty: 1
          - slug: g5-q7
            type: mcq
            prompt: En una saga de órdenes, el servicio de envíos recibe dos veces el mismo evento OrderPaid. ¿Qué te protege?
            options:
              - El circuit breaker
              - Un consumidor idempotente con clave de negocio (orderId)
              - El API gateway
              - Cloud Run
            answer: 1
            explanation: "Los patrones se combinan: las sagas sobre mensajería at-least-once necesitan consumidores idempotentes (Event Harbor)."
            skill: microservices_gcp
            difficulty: 2
          - slug: g5-q8
            type: order
            prompt: "Ordena el camino de un cambio hasta producción:"
            options:
              - Pull request con CI verde y revisión de código
              - Merge a main
              - CD construye y publica la imagen en Artifact Registry
              - Despliegue de una nueva revisión con canary
              - Monitoreo y promoción al 100 %
            answer:
              - 0
              - 1
              - 2
              - 3
              - 4
            explanation: "Cada etapa es una red de seguridad: revisión humana, pruebas automáticas, despliegue gradual y observación."
            skill: cicd
            difficulty: 1
