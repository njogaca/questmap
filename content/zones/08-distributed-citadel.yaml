      - slug: ds-5-boss-fight
        type: boss
        title: "Jefe: diseña el sistema de reserva de inventario"
        required: true
        estimated_min: 120
        skills:
          distributed_systems: 0.7
          english: 0.3
        payload:
          task: |
            **Design a "buy online, pick up in store" inventory reservation system for a large home-improvement retailer.**

            Contexto: ~2.000 tiendas, ~1 millón de SKUs por tienda (no todos con stock), las tiendas venden también en caja física. Picos de Black Friday de 10× el tráfico normal. El cliente ve el stock en la página del producto y, al pagar, se reserva la unidad en la tienda elegida; tiene 48 horas para recogerla.

            Entrega un documento (puede ser Markdown en tu repo) con:
            1. **Requisitos:** funcionales y no funcionales, con números (latencia p99 de lectura y de reserva, disponibilidad, consistencia). Escribe las preguntas que le harías al entrevistador y la respuesta que supones.
            2. **Estimaciones:** lecturas y reservas por segundo (promedio y pico), tamaño aproximado de los datos de stock.
            3. **API:** al menos `GET` de stock por SKU y tienda, `POST` de reserva (con idempotencia) y la cancelación o expiración.
            4. **Modelo de datos y particionamiento:** qué base para la fuente de verdad, cuál clave de partición, qué se cachea y con qué TTL.
            5. **Diagrama de alto nivel** (Mermaid o ASCII) con el camino de una lectura y de una reserva.
            6. **Profundiza en 3 puntos:** (a) cómo evitas vender dos veces la última unidad, incluidas las ventas en caja física; (b) qué pasa durante una partición de red entre una tienda y la nube (¿AP o CP para cada operación?); (c) la saga reserva → pago → confirmación, con compensaciones y la expiración a las 48 horas.
            7. **Resiliencia y operación:** backpressure en Black Friday, reintentos, hot keys, y 3 SLOs con su alerta.
            8. **Trade-offs:** al menos 3 decisiones con lo que ganas y lo que pierdes.

            Después, defiéndelo en una mini-entrevista en inglés.
          rubric:
            - correctness
            - depth
            - clarity
            - tradeoffs
          interview_focus:
            - clarifying requirements and estimates
            - consistency choices per operation (CAP/PACELC)
            - preventing overselling and idempotent reservations
            - sagas, compensations and expiration
            - overload handling and hot keys
            - trade-off communication in English
