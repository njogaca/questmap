zone: gcp-peaks
terms: [ { slug: gcp-region-zone, term: region / zone, category: cloud, definition_es: "Región: área geográfica con varios centros de datos (us-central1). Zona: un centro de datos aislado dentro de la región, que funciona como dominio de falla.", definition_en: A region is a geographic area; a zone is an isolated location inside it., example_en: We run three replicas across zones in us-central1., analogy: "Una ciudad (región) con varios edificios separados (zonas): si uno se queda sin luz, los otros siguen." }, { slug: gcp-iam, term: IAM (Identity and Access Management), category: security, definition_es: "El sistema que decide quién (principal) puede hacer qué (rol) sobre qué recurso, mediante políticas.", definition_en: The system that controls who can do what on which resource., example_en: IAM lets the app publish but not delete topics., analogy: "El control de acceso de un edificio: tarjetas distintas abren puertas distintas.", see_also: [ gcp-principal, gcp-role ] }, { slug: gcp-principal, term: principal, category: security, definition_es: "Quien recibe permisos: un usuario, un grupo o una service account.", definition_en: An identity that can be granted access., example_en: The principal is the orders service account., analogy: La persona (o el robot) que lleva la tarjeta de acceso., see_also: [ gcp-iam ] }, { slug: gcp-role, term: role, category: security, definition_es: Conjunto de permisos con nombre (ej. roles/run.invoker) que se asigna a un principal sobre un recurso., definition_en: A named collection of permissions., example_en: Grant the run.invoker role to the caller service., analogy: "El nivel de tu tarjeta: visitante, empleado o mantenimiento.", see_also: [ gcp-least-privilege ] }, { slug: gcp-service-account, term: service account, category: security, definition_es: La identidad de una aplicación o carga de trabajo (no de una persona). Las apps se autentican con ella., definition_en: "An identity used by applications, not humans.", example_en: Each microservice runs with its own service account., analogy: "El gafete de un robot de la fábrica: tiene su propia identificación y sus propios permisos.", see_also: [ gcp-iam ] }, { slug: gcp-least-privilege, term: least privilege, category: security, definition_es: Principio de dar a cada identidad solo los permisos mínimos que necesita para su trabajo., definition_en: Granting only the permissions that are needed., example_en: Least privilege limited the damage of the leaked key., analogy: "Al plomero le das la llave del baño, no la de toda la casa.", see_also: [ gcp-role ] }, { slug: gcp-free-tier, term: free tier, category: cost, definition_es: Cuotas gratuitas mensuales de algunos servicios (ej. 2 millones de peticiones en Cloud Run). Requiere una cuenta de facturación., definition_en: Free monthly usage limits for some products., example_en: The demo stays within the Cloud Run free tier., analogy: "Las primeras horas gratis de un estacionamiento: después empieza a correr el taxímetro.", see_also: [ gcp-budget-alert ] }, { slug: gcp-budget-alert, term: budget alert, category: cost, definition_es: "Presupuesto de Cloud Billing que envía avisos cuando el gasto llega a ciertos porcentajes. Avisa, pero no corta el gasto.", definition_en: A notification when spending reaches a threshold., example_en: Set a budget alert at 50% and 90%., analogy: La alarma del celular cuando gastaste el 80 % de tus datos móviles., see_also: [ gcp-free-tier ] }, { slug: gcp-container-image, term: container image, category: containers, definition_es: "Paquete inmutable con la aplicación y todo lo que necesita para correr (runtime, librerías). Se ejecuta igual en cualquier lugar.", definition_en: An immutable package with an app and its dependencies., example_en: The CI pipeline builds one container image per commit., analogy: "Una lonchera sellada con todo el almuerzo: no dependes de lo que haya en la cocina de destino.", see_also: [ gcp-multi-stage ] }, { slug: gcp-multi-stage, term: multi-stage build, category: containers, definition_es: "Dockerfile con varias etapas: una para compilar (JDK, Maven) y otra final mínima solo para ejecutar (JRE + jar).", definition_en: A Dockerfile that builds in one stage and runs in a smaller one., example_en: The multi-stage build cut the image size in half., analogy: "Cocinar en la cocina grande y llevar a la mesa solo el plato servido, no las ollas.", see_also: [ gcp-container-image ] }, { slug: gcp-cloud-run, term: Cloud Run, category: platforms, definition_es: "Plataforma serverless de GCP que corre contenedores HTTP, escala automáticamente (incluso a cero) y cobra por uso.", definition_en: A serverless platform that runs containers and scales automatically., example_en: We deploy the orders API to Cloud Run., analogy: Un salón de eventos que se arma solo cuando llegan invitados y se desarma cuando se van., see_also: [ gcp-scale-to-zero, gcp-gke ] }, { slug: gcp-gke, term: GKE (Google Kubernetes Engine), category: platforms, definition_es: "Kubernetes administrado por Google. Más control y flexibilidad que Cloud Run, con más trabajo operativo.", definition_en: Managed Kubernetes on Google Cloud., example_en: Stateful workloads run on GKE., analogy: "Tener tu propio taller con herramientas: puedes hacer de todo, pero tú lo mantienes.", analogy_mq: "Parecido a operar OpenShift, que ya conoces: OpenShift está construido sobre Kubernetes.", see_also: [ gcp-cloud-run ] }, { slug: gcp-artifact-registry, term: Artifact Registry, category: platforms, definition_es: "Servicio de GCP para guardar imágenes de contenedor y paquetes (Maven, npm), con acceso controlado por IAM.", definition_en: A GCP service that stores container images and packages., example_en: CI pushes the image to Artifact Registry., analogy: "Una bodega con inventario de cajas ya empacadas, lista para despachar." }, { slug: gcp-scale-to-zero, term: scale to zero, category: platforms, definition_es: "Que el servicio apague todas sus instancias cuando no hay tráfico, para no pagar por capacidad ociosa.", definition_en: Running no instances when there is no traffic., example_en: Scale to zero keeps the staging environment almost free., analogy: Apagar todas las luces de la oficina cuando no hay nadie., see_also: [ gcp-cold-start ] }, { slug: gcp-cold-start, term: cold start, category: platforms, definition_es: La demora extra de la primera petición cuando hay que arrancar una instancia nueva (ej. iniciar la JVM)., definition_en: Extra latency while a new instance starts., example_en: We set min-instances to 1 to avoid cold starts., analogy: "Arrancar el carro en una mañana fría: tarda un poco más en estar listo.", see_also: [ gcp-scale-to-zero ] }, { slug: gcp-microservice, term: microservice, category: architecture, definition_es: "Servicio pequeño, desplegable de forma independiente, dueño de sus datos y enfocado en una capacidad de negocio (órdenes, pagos).", definition_en: "A small, independently deployable service that owns its data.", example_en: The orders microservice owns the orders database., analogy: "Los puestos de un mercado: cada uno vende lo suyo y puede abrir o cerrar sin afectar a los demás.", see_also: [ gcp-api-gateway ] }, { slug: gcp-api-gateway, term: API gateway, category: architecture, definition_es: "Punto de entrada único para los clientes: enruta peticiones, autentica, limita la tasa y termina TLS en el borde.", definition_en: A single entry point that routes and secures client requests., example_en: The API gateway validates the JWT before routing., analogy: "La recepción de un hotel: todos entran por ahí y te dirigen al lugar correcto.", analogy_mq: Cumple el papel que DataPower tenía en el borde de tus integraciones., see_also: [ gcp-microservice ] }, { slug: gcp-circuit-breaker, term: circuit breaker, category: resilience, definition_es: "Mecanismo que deja de llamar a un servicio que falla mucho (estado OPEN), responde rápido con un fallback y luego prueba si se recuperó (HALF_OPEN).", definition_en: Stops calling a failing dependency for a while to prevent cascading failures., example_en: The circuit breaker opened after 50% of payment calls failed., analogy: "El breaker eléctrico de tu casa: corta la corriente antes de que se queme todo.", see_also: [ gcp-saga ] }, { slug: gcp-saga, term: saga, category: architecture, definition_es: "Secuencia de transacciones locales en varios servicios; si un paso falla, se ejecutan acciones compensatorias de los pasos anteriores. Por coreografía (eventos) u orquestación (coordinador).", definition_en: A sequence of local transactions with compensating actions on failure., example_en: The order saga refunds the payment when stock is missing., analogy: "Planear un viaje: si se cancela el hotel, cancelas también el vuelo y el auto ya reservados.", see_also: [ gcp-compensating-action ] }, { slug: gcp-compensating-action, term: compensating action, category: architecture, definition_es: "Acción de negocio que deshace el efecto de un paso ya confirmado (reembolsar, liberar stock). No es un rollback de base de datos.", definition_en: A business action that undoes a completed step., example_en: The compensating action releases the reserved stock., analogy: "Devolver la compra en la tienda: no borras la venta, haces una devolución.", see_also: [ gcp-saga ] }, { slug: gcp-ci, term: CI (continuous integration), category: cicd, definition_es: "Práctica de integrar cambios con frecuencia y verificarlos automáticamente (compilar, probar, empaquetar) en cada push o pull request.", definition_en: Automatically building and testing every change., example_en: CI runs the tests on every pull request., analogy: El control de calidad de una fábrica que revisa cada pieza apenas sale de la máquina., see_also: [ gcp-gh-workflow, gcp-cd ] }, { slug: gcp-gh-workflow, term: GitHub Actions workflow, category: cicd, definition_es: Archivo YAML en `.github/workflows/` que define cuándo se ejecuta (eventos) y qué hace (jobs con steps sobre runners)., definition_en: A YAML file that defines automated jobs triggered by events., example_en: The workflow runs on push and on pull requests., analogy: Una receta que la cocina automática ejecuta cada vez que llega un pedido., see_also: [ gcp-ci ] }, { slug: gcp-twelve-factor, term: twelve-factor app, category: architecture, definition_es: "Conjunto de 12 prácticas para apps en la nube. La más citada: la configuración que cambia entre entornos va en variables de entorno, no en el código.", definition_en: "Twelve practices for cloud-native apps, such as config in the environment.", example_en: "Following twelve-factor, the same image runs in dev and prod.", analogy: "Un electrodoméstico que funciona en cualquier casa: solo cambias el enchufe, no lo rearmas.", see_also: [ gcp-secret-manager ] }, { slug: gcp-secret-manager, term: Secret Manager, category: security, definition_es: "Servicio de GCP para guardar secretos (API keys, contraseñas) con versiones, auditoría y acceso por IAM.", definition_en: A GCP service that stores secrets with versioning and IAM access., example_en: The API key is mounted from Secret Manager., analogy: Una caja fuerte con registro de quién la abrió y cuándo., see_also: [ gcp-twelve-factor ] }, { slug: gcp-wif, term: Workload Identity Federation, category: security, definition_es: "Permite que cargas externas (ej. GitHub Actions) obtengan credenciales temporales de GCP con su propio token, sin llaves de service account.", definition_en: Lets external workloads get short-lived GCP credentials without keys., example_en: Our pipeline deploys with Workload Identity Federation., analogy: "Un pase de visitante del día que te dan en recepción mostrando tu credencial de empresa, en lugar de prestarte una llave de la oficina.", see_also: [ gcp-id-token ] }, { slug: gcp-id-token, term: ID token, category: security, definition_es: Token firmado que prueba la identidad de quien llama (ej. una service account) para una audiencia concreta; Cloud Run lo valida., definition_en: A signed token that proves the caller's identity., example_en: orders sends an ID token when calling payments., analogy: Un gafete con foto y firma que el guardia puede verificar., see_also: [ gcp-wif ] }, { slug: gcp-cd, term: CD (continuous delivery / deployment), category: cicd, definition_es: "Llevar automáticamente los cambios verificados por CI a un entorno. Delivery: listo para producción con aprobación. Deployment: llega solo a producción.", definition_en: Automatically releasing verified changes to an environment., example_en: CD deploys every green build to staging., analogy: "Después del control de calidad, la cinta lleva el producto directo al camión de reparto.", see_also: [ gcp-ci, gcp-canary ] }, { slug: gcp-canary, term: canary deployment, category: cicd, definition_es: "Enviar un pequeño porcentaje del tráfico a la versión nueva, vigilar métricas y aumentar o revertir según resultados.", definition_en: Sending a small share of traffic to a new version first., example_en: The canary got 5% of traffic for 30 minutes., analogy: Probar un platillo nuevo con unas pocas mesas antes de ponerlo en el menú., see_also: [ gcp-revision ] }, { slug: gcp-revision, term: Cloud Run revision, category: platforms, definition_es: Versión inmutable de un servicio de Cloud Run creada en cada despliegue; el tráfico se puede repartir entre revisiones., definition_en: An immutable version of a Cloud Run service., example_en: We rolled back by sending 100% of traffic to the previous revision., analogy: "Las ediciones de un libro: la vieja sigue existiendo aunque publiques una nueva.", see_also: [ gcp-canary ] } ]
