zone: security-fortress
terms: [ { slug: sec-authn, term: authentication (authn), category: identity, definition_es: "Proceso de verificar QUIÉN eres (contraseña, certificado, token, identidad de la plataforma).", definition_en: Verifying who someone is., example_en: Authentication failed because the token had expired., analogy: Mostrar tu cédula en la recepción., see_also: [ sec-authz ] }, { slug: sec-authz, term: authorization (authz), category: identity, definition_es: Decidir QUÉ puede hacer alguien ya identificado sobre un recurso concreto., definition_en: Deciding what an authenticated identity is allowed to do., example_en: Authorization denied the delete because the user is not an admin., analogy: "Ya sabes quién es, pero ¿tiene llave de esa oficina?", see_also: [ sec-authn, sec-scope ] }, { slug: sec-oauth2, term: OAuth 2.0, category: identity, definition_es: Marco de autorización en el que un servidor de autorización emite access tokens para que un cliente acceda a recursos protegidos., definition_en: An authorization framework based on access tokens., example_en: The API is protected with OAuth 2.0 access tokens., analogy: "El valet parking: le das una llave limitada que solo enciende el carro, no abre la cajuela.", see_also: [ sec-oidc, sec-access-token ] }, { slug: sec-oidc, term: OpenID Connect (OIDC), category: identity, definition_es: "Capa de autenticación sobre OAuth 2.0: estandariza el login y entrega un ID token con la identidad del usuario.", definition_en: An identity layer on top of OAuth 2.0., example_en: We use OIDC to sign users in with the corporate identity provider., analogy: OAuth da la llave; OIDC además te entrega una credencial con tu foto y nombre., see_also: [ sec-oauth2 ] }, { slug: sec-jwt, term: JWT (JSON Web Token), category: identity, definition_es: Token con formato header.payload.signature en Base64URL. Está firmado (no se puede alterar sin que se note) pero NO cifrado., definition_en: "A signed token made of header, payload and signature.", example_en: The JWT carries the user id and scopes., analogy: "Un sobre transparente con un sello de cera: todos pueden leer el contenido, pero nadie puede cambiarlo sin romper el sello.", see_also: [ sec-access-token ] }, { slug: sec-access-token, term: access token, category: identity, definition_es: "Token de corta duración que el cliente envía en `Authorization: Bearer` para acceder a una API.", definition_en: A short-lived token used to call an API., example_en: The access token expires after five minutes., analogy: "La pulsera de un evento: te deja entrar hoy, mañana ya no sirve.", see_also: [ sec-jwt, sec-scope ] }, { slug: sec-scope, term: scope, category: identity, definition_es: Permiso concedido a un token (ej. `orders.write`). La API decide qué permite según los scopes del token., definition_en: A permission attached to an access token., example_en: Creating orders requires the orders.write scope., analogy: "Los sellos en tu pase: zona general, backstage, VIP.", see_also: [ sec-authz ] }, { slug: sec-client-credentials, term: client credentials grant, category: identity, definition_es: "Flujo de OAuth 2.0 para servicio a servicio: el cliente se autentica como sí mismo y recibe un access token, sin usuario.", definition_en: An OAuth 2.0 flow for machine-to-machine calls., example_en: The batch job uses the client credentials grant., analogy: "Un mensajero de la empresa que se identifica con su propio gafete, no con el de un empleado.", see_also: [ sec-oauth2 ] }, { slug: sec-pkce, term: Authorization Code + PKCE, category: identity, definition_es: "Flujo recomendado para apps con usuario: el navegador recibe un código y lo cambia por tokens; PKCE evita que alguien que robe el código pueda usarlo.", definition_en: The recommended OAuth flow for apps with users., example_en: The SPA uses authorization code with PKCE., analogy: "Un ticket de guardarropa con una contraseña que solo tú conoces: aunque te roben el ticket, no pueden recoger tu abrigo.", see_also: [ sec-oauth2 ] }, { slug: sec-idp, term: identity provider (IdP), category: identity, definition_es: "Servicio que autentica usuarios o aplicaciones y emite tokens (Keycloak, Okta, Google, Microsoft Entra ID).", definition_en: A service that authenticates identities and issues tokens., example_en: Keycloak is our identity provider in development., analogy: La oficina que emite las credenciales de la empresa., see_also: [ sec-resource-server ] }, { slug: sec-resource-server, term: resource server, category: identity, definition_es: La API que protege recursos y acepta access tokens; valida cada token antes de responder., definition_en: An API that accepts and validates access tokens., example_en: orders is configured as an OAuth 2.0 resource server., analogy: El guardia de cada puerta que revisa la credencial antes de dejarte pasar., see_also: [ sec-idp ] }, { slug: sec-401-403, term: 401 vs 403, category: http, definition_es: "401 Unauthorized: no se pudo confirmar quién eres (sin token o inválido). 403 Forbidden: se sabe quién eres, pero no tienes permiso.", definition_en: 401 means not authenticated; 403 means not allowed., example_en: The reader client gets 403 when it tries to create an order., analogy: "401: el guardia no te reconoce. 403: te reconoce, pero no estás en la lista de esa sala.", see_also: [ sec-authn, sec-authz ] }, { slug: sec-bearer, term: bearer token, category: identity, definition_es: "Token que da acceso a quien lo porte; se envía en `Authorization: Bearer <token>`. Si se filtra, otro lo puede usar, por eso dura poco y viaja por HTTPS.", definition_en: A token that grants access to whoever holds it., example_en: Never log the bearer token., analogy: "Un billete de dinero: quien lo tiene en la mano lo puede gastar.", see_also: [ sec-access-token ] }, { slug: sec-rbac, term: RBAC (role-based access control), category: identity, definition_es: "Control de acceso por roles: los permisos se asignan a roles (admin, operador) y los roles a usuarios o servicios.", definition_en: Granting permissions through roles., example_en: Only the admin role can cancel paid orders., analogy: "En un hospital, lo que puedes hacer depende de si eres médico, enfermera o visitante.", see_also: [ sec-scope ] }, { slug: sec-test-pyramid, term: test pyramid, category: testing, definition_es: "Modelo que recomienda muchas pruebas unitarias en la base, menos de integración en el medio y pocas end-to-end en la cima.", definition_en: "Many unit tests, fewer integration tests, few end-to-end tests.", example_en: Our suite follows the test pyramid., analogy: "La base de una pirámide de acróbatas: muchos abajo sosteniendo, pocos arriba.", see_also: [ sec-integration-test, sec-e2e-test ] }, { slug: sec-integration-test, term: integration test, category: testing, definition_es: "Prueba que verifica que tu código funciona con una pieza real (base de datos, broker, otro módulo).", definition_en: A test that exercises code with real dependencies., example_en: The integration test runs against a real Postgres., analogy: "Probar el motor ya conectado a la caja de cambios, no por separado.", see_also: [ sec-testcontainers ] }, { slug: sec-testcontainers, term: Testcontainers, category: testing, definition_es: "Librería que levanta contenedores Docker desechables (Postgres, Kafka, Pub/Sub emulador) dentro de las pruebas y los destruye al terminar.", definition_en: A library that starts disposable Docker containers for tests., example_en: Testcontainers starts Postgres 16 for each test run., analogy: Una cocina de prueba que se arma para el ensayo y se desmonta al terminar., see_also: [ sec-integration-test ] }, { slug: sec-e2e-test, term: end-to-end test, category: testing, definition_es: "Prueba que recorre el sistema completo como lo haría un usuario o cliente, a través de varios servicios.", definition_en: A test that exercises the whole system., example_en: One end-to-end test covers checkout to shipment., analogy: Hacer un pedido real en la tienda para ver que llega a tu casa., see_also: [ sec-test-pyramid ] }, { slug: sec-contract-test, term: contract test, category: testing, definition_es: Prueba que verifica que productor y consumidor de una API o evento siguen respetando el formato acordado., definition_en: A test that checks an API or event contract between services., example_en: The contract test caught a renamed field., analogy: Revisar que el enchufe nuevo siga entrando en el tomacorriente de siempre., see_also: [ eda-schema-evolution ] }, { slug: sec-flaky-test, term: flaky test, category: testing, definition_es: "Prueba que a veces pasa y a veces falla sin cambios en el código (tiempos, orden, estado compartido). Destruye la confianza en la suite.", definition_en: A test that passes and fails without code changes., example_en: We quarantined the flaky test and fixed the race condition., analogy: "Una alarma de humo que suena sola de vez en cuando: pronto nadie le hace caso.", see_also: [ java-race-condition ] }, { slug: sec-load-test, term: load test, category: performance, definition_es: Prueba con el tráfico esperado (o un poco más) para confirmar que el sistema cumple sus objetivos de latencia y errores., definition_en: A test with expected traffic to verify performance goals., example_en: The load test simulates 200 orders per second., analogy: Probar el ascensor con el peso máximo indicado en la placa., see_also: [ sec-stress-test ] }, { slug: sec-stress-test, term: stress test, category: performance, definition_es: Prueba que sube la carga más allá de lo esperado hasta encontrar el punto de quiebre y ver cómo falla., definition_en: A test that pushes load until the system breaks., example_en: The stress test showed the pool saturates at 900 RPS., analogy: Seguir agregando peso al puente de prueba hasta ver dónde cede., see_also: [ sec-load-test ] }, { slug: sec-soak-test, term: soak test, category: performance, definition_es: "Prueba de resistencia: carga normal durante horas para encontrar fugas de memoria, conexiones o archivos.", definition_en: A long-running test at normal load to find leaks., example_en: The soak test revealed a connection leak after four hours., analogy: Dejar la llave del agua abierta toda la noche para ver si gotea., see_also: [ sec-load-test ] }, { slug: sec-threshold, term: threshold (k6), category: performance, definition_es: "Criterio de aprobado o fallido de una prueba de rendimiento (ej. p95 < 300 ms, errores < 1 %). Si no se cumple, k6 termina con error.", definition_en: A pass/fail criterion for a performance test., example_en: The p95 threshold failed after the change., analogy: "La nota mínima para aprobar: no basta con presentar el examen.", see_also: [ obs-percentile ] }, { slug: sec-chaos-engineering, term: chaos engineering, category: resilience, definition_es: Disciplina de hacer experimentos controlados de fallas (con hipótesis y métricas) para descubrir debilidades antes de que causen incidentes., definition_en: Controlled experiments that inject failures to find weaknesses., example_en: Our chaos experiment shut down one Cassandra node., analogy: "Un simulacro de incendio: mejor descubrir que la salida está bloqueada en el simulacro que en el incendio real.", see_also: [ sec-blast-radius, sec-steady-state ] }, { slug: sec-blast-radius, term: blast radius, category: resilience, definition_es: "Cuánto puede afectar una falla o un experimento (usuarios, servicios, datos). Se busca mantenerlo pequeño.", definition_en: How much of the system a failure can affect., example_en: We limited the blast radius to one instance., analogy: Cerrar las puertas cortafuegos para que un incendio quede en un solo cuarto., see_also: [ sec-chaos-engineering ] }, { slug: sec-steady-state, term: steady state, category: resilience, definition_es: "El comportamiento normal medible del sistema (latencia, errores, throughput) contra el que se compara un experimento.", definition_en: The measurable normal behavior of a system., example_en: Steady state is p95 under 300 ms and errors under 1%., analogy: "Tu pulso en reposo: si no lo conoces, no sabes si el ejercicio lo alteró.", see_also: [ sec-chaos-engineering ] }, { slug: sec-bola, term: BOLA (Broken Object Level Authorization), category: vulnerabilities, definition_es: "Vulnerabilidad n.º 1 de OWASP API: la API no verifica que el objeto pedido (ej. una orden) pertenezca a quien lo pide.", definition_en: An API returns objects without checking ownership., example_en: Changing the order id in the URL exposed other customers' orders (BOLA)., analogy: Un hotel donde tu tarjeta abre cualquier habitación si cambias el número de la puerta., see_also: [ sec-bfla, sec-authz ] }, { slug: sec-bfla, term: BFLA (Broken Function Level Authorization), category: vulnerabilities, definition_es: Usuarios sin permiso pueden ejecutar funciones restringidas (ej. endpoints de administración)., definition_en: "Users can call functions they shouldn't, like admin endpoints.", example_en: Any customer could call the delete endpoint (BFLA)., analogy: Un pasajero que puede entrar a la cabina del piloto porque la puerta no tiene cerradura., see_also: [ sec-bola, sec-rbac ] }, { slug: sec-sql-injection, term: SQL injection, category: vulnerabilities, definition_es: Cuando la entrada del usuario se concatena en una consulta SQL y termina ejecutándose como código. Se evita con parámetros., definition_en: User input executed as SQL because it was concatenated into a query., example_en: Parameterized queries prevent SQL injection., analogy: "Un formulario donde alguien escribe en el campo 'nombre' una orden para el cajero, y el cajero la obedece.", see_also: [ sec-threat-modeling ] }, { slug: sec-rate-limiting, term: rate limiting, category: vulnerabilities, definition_es: "Limitar cuántas peticiones o cuántos recursos puede usar un cliente en un tiempo, para evitar abusos y caídas.", definition_en: Limiting how many requests a client can make., example_en: The gateway applies rate limiting per API key., analogy: El límite de retiros diarios del cajero automático., see_also: [ gcp-api-gateway ] }, { slug: sec-threat-modeling, term: threat modeling, category: practices, definition_es: "Analizar de forma estructurada quién podría atacar un sistema, por dónde y con qué impacto, para priorizar defensas.", definition_en: A structured analysis of possible attacks and their impact., example_en: Threat modeling showed the export endpoint was the riskiest., analogy: "Recorrer tu casa pensando como un ladrón: qué ventana usaría y qué se llevaría.", see_also: [ sec-bola ] } ]
