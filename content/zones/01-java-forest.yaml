      - slug: java-3-lab-tests
        type: lab
        title: "Lab: servicio con JUnit 5 + Mockito"
        required: true
        estimated_min: 75
        skills: { testing: 0.6, java: 0.3, git: 0.1 }
        payload:
          goal: "Crear un proyecto Maven con Spring Initializr y probar un servicio de órdenes con JUnit y Mockito, sin base de datos real."
          steps:
            - title: Genera el proyecto
              body: "Spring Initializr arma el proyecto por ti. `spring-boot-starter-test` ya incluye JUnit Jupiter y Mockito."
              commands:
                - "cd $HOME\\questmap-labs; Invoke-WebRequest \"https://start.spring.io/starter.zip?type=maven-project&language=java&javaVersion=21&groupId=com.questmap&artifactId=orders&name=orders&packageName=com.questmap.orders&dependencies=web,validation\" -OutFile orders.zip"
                - "Expand-Archive orders.zip -DestinationPath orders; cd orders; git init"
            - title: Crea el dominio y el servicio
              body: "En `src/main/java/com/questmap/orders/` crea:\n\n- `Order.java`: `public record Order(String id, String customer, double total) {}`\n- `OrderRepository.java`: interfaz con `Optional<Order> findById(String id);` y `Order save(Order o);`\n- `OrderService.java`: recibe el repository por constructor y tiene:\n  - `Order create(String customer, double total)`: lanza `IllegalArgumentException` si total ≤ 0; si no, guarda una orden con id `UUID.randomUUID().toString()`.\n  - `Order get(String id)`: devuelve la orden o lanza `OrderNotFoundException` (crea esta clase extendiendo `RuntimeException`)."
            - title: Escribe las pruebas
              body: "En `src/test/java/com/questmap/orders/OrderServiceTest.java`, con `@ExtendWith(MockitoExtension.class)`, `@Mock OrderRepository repo` y `@InjectMocks OrderService service`, escribe 4 pruebas:\n1. `create` con total válido llama a `repo.save` una vez (`verify`).\n2. `create` con total 0 lanza `IllegalArgumentException` (`assertThrows`) y NUNCA llama a save (`verify(repo, never())`).\n3. `get` con id existente devuelve la orden (`when(repo.findById(...)).thenReturn(Optional.of(...))`).\n4. `get` con id inexistente lanza `OrderNotFoundException`."
            - title: Corre las pruebas y haz commit
              commands:
                - ".\\mvnw.cmd test"
                - "git add .; git commit -m \"orders: service + unit tests\""
          expected: "Al final de la salida: Tests run: 5, Failures: 0, Errors: 0 (4 tuyas + la prueba contextLoads que trae el proyecto) y BUILD SUCCESS."
          checklist:
            - "Las 4 pruebas pasan con `.\\mvnw.cmd test`"
            - "Ninguna prueba usa una base de datos real (solo mocks)"
            - "Cada prueba sigue Arrange / Act / Assert y tiene un nombre que explica el caso"
            - "Hice commit"
          hints:
            - "Para verificar que se guardó: `verify(repo).save(any(Order.class));` (importa `static org.mockito.ArgumentMatchers.any`)."
            - "Para excepciones: `assertThrows(IllegalArgumentException.class, () -> service.create(\"ana\", 0));`"
          evidence_hint: "Pega el resumen final de `.\\mvnw.cmd test` (las líneas de 'Tests run' y 'BUILD SUCCESS')."

      - slug: java-3-quiz
        type: quiz
        title: Quiz — Excepciones, concurrencia y pruebas
        required: true
        estimated_min: 15
        skills: { java: 0.6, testing: 0.4 }
        questions:
          - slug: j3-q1
            type: mcq
            prompt: "¿Cuál es una checked exception?"
            options: ["NullPointerException", "IllegalArgumentException", "IOException", "ArithmeticException"]
            answer: 2
            explanation: "`IOException` es checked: el compilador te obliga a capturarla o declararla con `throws`. Las otras heredan de `RuntimeException` (unchecked)."
            skill: java
            difficulty: 1
          - slug: j3-q2
            type: tf
            prompt: "Con try-with-resources, el recurso se cierra automáticamente aunque ocurra una excepción."
            answer: true
            explanation: "Cualquier objeto que implemente `AutoCloseable` declarado en `try (...)` se cierra al salir del bloque, haya error o no."
            skill: java
            difficulty: 1
          - slug: j3-q3
            type: mcq
            prompt: "Dos hilos incrementan `count++` sobre la misma variable sin sincronización. ¿Qué puede pasar?"
            options: ["Nada, `++` es atómico", "Se pierden incrementos (race condition)", "El programa no compila", "Se lanza siempre una excepción"]
            answer: 1
            explanation: "`count++` es leer + sumar + escribir. Si dos hilos se intercalan, ambos leen el mismo valor y se pierde un incremento. Solución: `AtomicInteger`, `synchronized` o evitar estado compartido."
            skill: java
            difficulty: 2
          - slug: j3-q4
            type: mcq
            prompt: "¿Para qué sirve un `ExecutorService`?"
            options: ["Para compilar en paralelo", "Para administrar un pool de hilos y enviarle tareas", "Para ejecutar SQL", "Para programar cron jobs en Linux"]
            answer: 1
            explanation: "En lugar de crear un `Thread` por tarea, el executor reutiliza un grupo fijo de hilos. Recuerda cerrarlo (`shutdown`)."
            skill: java
            difficulty: 1
          - slug: j3-q5
            type: mcq
            prompt: "Con CompletableFuture, ¿qué método combina dos futuros independientes cuando ambos terminan?"
            options: ["thenApply", "thenCompose", "thenCombine", "exceptionally"]
            answer: 2
            explanation: "`thenCombine` une dos resultados independientes. `thenApply` transforma un resultado; `thenCompose` encadena una operación que devuelve otro futuro; `exceptionally` maneja errores."
            skill: java
            difficulty: 3
            hint: "'Combinar' dos cosas."
          - slug: j3-q6
            type: mcq
            prompt: "En una prueba unitaria de `OrderService`, ¿por qué mockeas `OrderRepository`?"
            options:
              - "Porque Mockito es obligatorio en Spring"
              - "Para aislar la lógica del servicio y no depender de una base de datos"
              - "Para que las pruebas sean más lentas pero más reales"
              - "Para probar el repositorio"
            answer: 1
            explanation: "Una prueba unitaria prueba UNA unidad. El mock reemplaza la dependencia con un doble controlado: rápido, determinista y sin infraestructura."
            skill: testing
            difficulty: 1
          - slug: j3-q7
            type: fill
            prompt: "Para comprobar que se lanza una excepción en JUnit usas `assert______(IllegalArgumentException.class, () -> ...)`."
            answer: ["Throws"]
            explanation: "`assertThrows` ejecuta el lambda y falla si NO se lanza la excepción esperada. Además devuelve la excepción para que verifiques su mensaje."
            skill: testing
            difficulty: 1
          - slug: j3-q8
            type: order
            prompt: "Ordena las fases de una prueba unitaria bien escrita:"
            options: ["Arrange: preparar datos y mocks", "Act: ejecutar el método bajo prueba", "Assert: verificar el resultado y las interacciones"]
            answer: [0, 1, 2]
            explanation: "Arrange-Act-Assert (o Given-When-Then) hace que cada prueba se lea como una historia corta."
            skill: testing
            difficulty: 1

  # ================================================================ NIVEL 4
