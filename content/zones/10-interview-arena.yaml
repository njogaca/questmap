slug: interview-arena
title: Interview Arena
order: 10
emoji: "🎯"
unlocked_from_start: true
map: { x: 150, y: 100 }
prerequisites: []
skills: [ english, ai_tools, java, eda, cassandra, observability, bigquery_sql, microservices_gcp, security, testing, distributed_systems ]
story: >
  Sector 10. La arena donde todo se pone a prueba en inglés. Cada combate es una entrevista; cada victoria te acerca a la oferta. El primer combate es el que todos los entrevistadores abren: "Tell me about yourself".

levels:
  # ================================================================ NIVEL 1
  - slug: arena-1-novice
    number: 1
    title: "Novice — Tell me about yourself y la historia puente"
    story: "Entras a la arena. Antes de pelear, tienes que presentarte: quién eres, de dónde vienes y por qué estás aquí."
    quests:
      - slug: arena-1-learn-tmay
        type: learn
        title: "La estructura de 'Tell me about yourself'"
        required: true
        estimated_min: 30
        skills: { english: 1.0 }
        resources:
          - { ref: res-yt-tmay }
        payload:
          note_prompt: "Escribe el esqueleto de tu respuesta en 3 líneas (puede ser en español): presente (qué haces hoy), pasado (qué te trajo aquí) y futuro (por qué este puesto)."
          summary_md: |
            Estructura recomendada (60–90 segundos):
            1. Presente: tu rol actual y el impacto (sistemas críticos de banca, alto volumen de mensajes).
            2. Pasado: 1–2 logros concretos con números.
            3. El puente: lo que ya sabes de mensajería (MQ, IIB) es la base de event-driven; lo que estás aprendiendo (Java moderno, Pub/Sub, Cassandra, GCP).
            4. Futuro: por qué este equipo de Home Depot y qué aportas.
            Evita: contar tu vida desde la universidad, leer el CV o hablar más de 2 minutos.

      - slug: arena-1-learn-bridge
        type: learn
        title: "Tu historia puente: de IIB/MQ a event-driven"
        required: true
        estimated_min: 30
        skills: { english: 0.7, eda: 0.3 }
        resources:
          - { ref: res-pubsub-overview }
        payload:
          note_prompt: "Escribe 3 conceptos que ya dominas por tu experiencia con MQ/IIB y que aplican directo a sistemas event-driven en la nube (por ejemplo: entrega garantizada, reintentos, desacoplamiento). Serán tu argumento principal."
          summary_md: |
            Tu ventaja: muchos candidatos de backend nunca operaron mensajería crítica en producción. Tú sí.
            Idea fuerza para la entrevista: "I've spent eight years making sure messages between critical banking systems are never lost or processed twice. The tools are changing — from IBM MQ to Pub/Sub — but the problems are the same: delivery guarantees, retries, idempotency and observability."

      - slug: arena-1-glossary
        type: glossary
        title: Vocabulario de entrevistas
        required: true
        estimated_min: 10
        skills: { english: 1.0 }
        payload:
          terms: [ arena-tmay, arena-bridge-story, arena-behavioral, arena-star, arena-technical-screen, arena-system-design, arena-take-home, arena-hiring-manager ]

      - slug: arena-1-write-tmay
        type: micro
        title: "Escribe tu 'Tell me about yourself' (versión 1)"
        required: true
        estimated_min: 15
        skills: { english: 1.0 }
        payload:
          kind: writing
          instructions: "Escribe en inglés tu respuesta completa (150–200 palabras) siguiendo la estructura presente → pasado → puente → futuro. No busques perfección: esta es la versión 1 y la mejorarás con Claude en la Fase 5."

      - slug: arena-1-speak-tmay
        type: micro
        title: "Di tu 'Tell me about yourself' en voz alta"
        required: true
        estimated_min: 15
        skills: { english: 1.0 }
        payload:
          kind: speaking
          instructions: "Sin leer, di tu respuesta en 60–90 s mientras dictas con Win + H (también puedes grabarte con la app Grabadora de sonido de Windows para escucharte). Pega la transcripción. Compárala con tu versión escrita: ¿qué partes olvidaste o dijiste con pausas largas?"

      - slug: arena-1-quiz
        type: quiz
        title: "Quiz — Primeras impresiones en inglés"
        required: true
        estimated_min: 15
        skills: { english: 1.0 }
        questions:
          - slug: a1-q1
            type: mcq
            prompt: "¿Cuánto debería durar tu respuesta a 'Tell me about yourself'?"
            options: [ "10 segundos", "60–90 segundos", "5 minutos", "Lo que haga falta para contar todo el CV" ]
            answer: 1
            explanation: "Lo justo para despertar interés y dejar que el entrevistador pregunte. Más de 2 minutos suele perder su atención."
            skill: english
            difficulty: 1
          - slug: a1-q2
            type: mcq
            prompt: "¿Cuál es el mejor inicio?"
            options:
              - "I was born in… and I studied…"
              - "I'm an integration engineer with eight years of experience building messaging systems for a tier-one bank."
              - "Well, it's a long story…"
              - "As you can see in my resume…"
            answer: 1
            explanation: "Empieza por el presente y tu valor profesional. La biografía y 'como ves en mi CV' desperdician los primeros segundos."
            skill: english
            difficulty: 1
          - slug: a1-q3
            type: fill
            prompt: "Completa en inglés: 'I have eight years ______ experience in integration.'"
            answer: [ "of" ]
            explanation: "'years of experience in…'. Error común en hispanohablantes: 'years experience' (sin 'of') o 'experience on'."
            skill: english
            difficulty: 1
          - slug: a1-q4
            type: mcq
            prompt: "¿Qué frase es correcta?"
            options: [ "I am working here since 2018.", "I have been working here since 2018.", "I work here since 2018.", "I worked here since 2018." ]
            answer: 1
            explanation: "Para algo que empezó en el pasado y sigue hoy se usa present perfect continuous: 'I have been working… since/for…'. En español decimos 'trabajo aquí desde', y por eso el error es tan común."
            skill: english
            difficulty: 2
            hint: "Empezó en el pasado y sigue hoy."
          - slug: a1-q5
            type: tf
            prompt: "Está bien decir que estás aprendiendo una tecnología de la oferta (por ejemplo Cassandra) si explicas cómo la estás aprendiendo y qué ya construiste."
            answer: true
            explanation: "La honestidad con evidencia ('I've built a 3-node cluster and modeled time-series data') vale más que fingir experiencia. Los entrevistadores detectan cuando alguien exagera."
            skill: english
            difficulty: 1
          - slug: a1-q6
            type: mcq
            prompt: "¿Cuál es la mejor forma de conectar tu experiencia con MQ con el puesto?"
            options:
              - "MQ is old, so I want to move to modern tools."
              - "My experience with guaranteed delivery, retries and idempotency in MQ translates directly to event-driven systems like Pub/Sub."
              - "I only know MQ, but I can learn."
              - "Pub/Sub and MQ are exactly the same."
            answer: 1
            explanation: "Presenta tu experiencia como un activo transferible, nombrando conceptos concretos. No critiques tu tecnología actual ni exageres la similitud."
            skill: english
            difficulty: 1
          - slug: a1-q7
            type: mcq
            prompt: "Te hacen una pregunta y no entendiste una palabra. ¿Qué dices?"
            options: [ "Respondo cualquier cosa", "Sorry, could you rephrase the question? I want to make sure I answer what you're asking.", "What?", "Me quedo en silencio" ]
            answer: 1
            explanation: "Pedir que reformulen es profesional y común en entrevistas remotas. Responder otra cosa es mucho peor."
            skill: english
            difficulty: 1
          - slug: a1-q8
            type: order
            prompt: "Ordena las partes de un buen 'Tell me about yourself':"
            options: [ "Present: current role and impact", "Past: one or two key achievements", "Bridge: how your experience connects to this role", "Future: why this team and company" ]
            answer: [ 0, 1, 2, 3 ]
            explanation: "Presente → pasado → puente → futuro. Termina mirando hacia el puesto para que la conversación siga ahí."
            skill: english
            difficulty: 1

      - slug: arena-1-open-tmay
        type: open_answer
        title: "Claude evalúa tu 'Tell me about yourself'"
        required: false
        estimated_min: 20
        skills: { english: 1.0 }
        payload:
          prompt_en: "Tell me about yourself."
          rubric: [ correctness, depth, clarity, tradeoffs ]
  - slug: arena-2-apprentice
    number: 2
    title: Apprentice — Preguntas conductuales con STAR
    story: El primer rival no te pregunta qué sabes, sino qué hiciste. Cada respuesta debe ser una historia corta, concreta y con final.
    quests:
      - slug: arena-2-learn-star
        type: learn
        title: El método STAR
        required: true
        estimated_min: 30
        skills:
          english: 1
        resources:
          - ref: res-star-method
        payload:
          note_prompt: Elige una historia real de tu trabajo con MQ/IIB (un incidente, una mejora o un conflicto) y escribe una línea para cada parte de STAR. Puede ser en español.
          summary_md: |
            Las preguntas conductuales empiezan con "Tell me about a time…" o "Give me an example of…". Buscan evidencia de cómo trabajas, no teoría.

            **STAR** (1,5–2 minutos en total):
            - **Situation** (10 %): el contexto mínimo. "At the bank, our payment integration processed about 2 million messages a day."
            - **Task** (10 %): TU responsabilidad o el objetivo. "I was responsible for…"
            - **Action** (60 %): lo que TÚ hiciste, paso a paso. Usa "I", no "we". Aquí se gana la entrevista.
            - **Result** (20 %): el resultado con números y lo que aprendiste. "We cut incident time from 3 hours to 20 minutes."

            Errores típicos:
            - Contexto eterno y acción de una frase.
            - "We did…" todo el tiempo: el entrevistador no sabe qué hiciste tú.
            - Terminar sin resultado o sin aprendizaje.
            - Inventar: las preguntas de seguimiento ("What would you do differently?") lo delatan.

            Si el resultado fue malo, está bien: cuéntalo y di qué aprendiste y qué cambiaste después.
      - slug: arena-2-learn-story-bank
        type: learn
        title: "Tu banco de historias: 8 historias para 30 preguntas"
        required: true
        estimated_min: 45
        skills:
          english: 1
        resources:
          - ref: res-star-method
        payload:
          note_prompt: "Haz tu tabla: 8 historias (título corto) y, para cada una, qué temas cubre (incidente, conflicto, aprendizaje rápido, error, mejora, mentoría, ambigüedad, prioridades)."
          summary_md: |
            No necesitas una historia por pregunta: con **6–8 historias bien preparadas** cubres casi todo, porque cada una sirve para varios temas.

            Temas que más preguntan para un puesto backend:
            1. Un incidente crítico en producción (presión, RCA, qué cambiaste).
            2. Un desacuerdo técnico con tu equipo o tu jefe.
            3. Aprender una tecnología rápido (¡tu transición a Java, Pub/Sub y GCP es perfecta aquí!).
            4. Un error tuyo y cómo lo comunicaste.
            5. Mejorar la confiabilidad o el rendimiento, con números.
            6. Requisitos poco claros.
            7. Ayudar a un compañero a crecer.
            8. Priorizar varias urgencias.

            Para cada historia anota: los números (volumen, tiempos, porcentaje de mejora), tu acción concreta y una frase de aprendizaje. Practícalas en voz alta hasta que salgan en menos de 2 minutos sin leer.

            Conecta las historias con la oferta: confiabilidad, mensajería, debugging, trabajo remoto y aprendizaje continuo.
      - slug: arena-2-glossary
        type: glossary
        title: Vocabulario de entrevistas conductuales
        required: true
        estimated_min: 10
        skills:
          english: 1
        payload:
          terms:
            - arena-star
            - arena-story-bank
            - arena-ownership
            - arena-follow-up-question
            - arena-impact-numbers
            - arena-filler-words
      - slug: arena-2-write-star
        type: micro
        title: Escribe tu primera historia STAR
        required: true
        estimated_min: 15
        skills:
          english: 1
        payload:
          kind: writing
          instructions: "Escribe en inglés tu historia del incidente crítico (120–180 palabras) con las 4 partes marcadas: Situation, Task, Action, Result. Usa 'I' en la parte de Action y al menos un número en Result."
      - slug: arena-2-speak-star
        type: micro
        title: Cuenta tu historia STAR en voz alta
        required: true
        estimated_min: 15
        skills:
          english: 1
        payload:
          kind: speaking
          instructions: "Sin leer, cuenta la misma historia en menos de 2 minutos con Win + H y pega la transcripción. Revisa: ¿cuántas veces dijiste 'we'? ¿Cuántos 'um' o 'eh'? ¿Llegaste al resultado?"
      - slug: arena-2-quiz
        type: quiz
        title: Quiz — STAR y respuestas conductuales
        required: true
        estimated_min: 15
        skills:
          english: 1
        questions:
          - slug: a2-q1
            type: order
            prompt: "Ordena las partes del método STAR:"
            options:
              - Situation
              - Task
              - Action
              - Result
            answer:
              - 0
              - 1
              - 2
              - 3
            explanation: Contexto breve → tu responsabilidad → lo que hiciste → el resultado con números.
            skill: english
            difficulty: 1
          - slug: a2-q2
            type: mcq
            prompt: ¿En qué parte de STAR deberías pasar MÁS tiempo?
            options:
              - Situation
              - Task
              - Action
              - Result
            answer: 2
            explanation: La acción es donde el entrevistador ve cómo piensas y trabajas. Alrededor del 60 % de la respuesta.
            skill: english
            difficulty: 1
          - slug: a2-q3
            type: mcq
            prompt: ¿Qué frase es mejor en la parte de Action?
            options:
              - We fixed the issue.
              - The team decided to restart everything.
              - I analyzed the queue depth, found the poison message and moved it to a backout queue.
              - It got fixed eventually.
            answer: 2
            explanation: Concreta, en primera persona y con pasos técnicos verificables.
            skill: english
            difficulty: 1
          - slug: a2-q4
            type: mcq
            prompt: ¿Cuál es el mejor Result?
            options:
              - It went well.
              - Everyone was happy.
              - We reduced the average recovery time from three hours to twenty minutes, and the runbook is still used today.
              - I don't remember the numbers.
            answer: 2
            explanation: Números y un efecto duradero. Si no tienes el número exacto, da un orden de magnitud honesto ('about…').
            skill: english
            difficulty: 1
          - slug: a2-q5
            type: tf
            prompt: Si la historia terminó mal, es mejor no contarla en una entrevista.
            answer: false
            explanation: Las preguntas sobre errores son comunes. Lo que evalúan es cómo lo manejaste y qué aprendiste.
            skill: english
            difficulty: 1
          - slug: a2-q6
            type: fill
            prompt: "Completa: 'I was ______ for the integration between the core banking system and the payment gateway.'"
            answer:
              - responsible
              - in charge
            explanation: "'I was responsible for…' o 'I was in charge of…' son las fórmulas para la parte de Task. Ojo: 'responsible OF' es un error común."
            skill: english
            difficulty: 1
          - slug: a2-q7
            type: mcq
            prompt: "El entrevistador pregunta: 'What would you do differently?'. ¿Cuál es la mejor respuesta?"
            options:
              - Nothing, it was perfect.
              - I would have added monitoring on queue depth earlier, so we could detect the problem before customers noticed.
              - I would ask my manager.
              - I don't know.
            answer: 1
            explanation: Muestra autocrítica concreta y aprendizaje técnico.
            skill: english
            difficulty: 2
          - slug: a2-q8
            type: mcq
            prompt: ¿Qué frase es correcta en inglés?
            options:
              - I made a mistake and I told it to my manager.
              - I made a mistake, and I immediately told my manager about it.
              - I did a mistake and I said to my manager.
              - I committed an error to my manager.
            answer: 1
            explanation: "'Make a mistake' (no 'do'), y 'tell someone about something' (no 'say to someone')."
            skill: english
            difficulty: 2
          - slug: a2-q9
            type: mcq
            prompt: Necesitas unos segundos para pensar una historia. ¿Qué dices?
            options:
              - (silencio total de 30 segundos)
              - That's a good question — let me think of the best example for a second.
              - I have no examples.
              - Can we skip this one?
            answer: 1
            explanation: Pedir un momento es normal y profesional. Mejor eso que contar la primera historia que se te ocurra.
            skill: english
            difficulty: 1
      - slug: arena-2-open-star
        type: open_answer
        title: Claude evalúa tu respuesta STAR
        required: true
        estimated_min: 25
        skills:
          english: 1
        payload:
          prompt_en: Tell me about a time you had to debug a critical production issue under pressure. What was the root cause and what did you change afterwards?
          rubric:
            - correctness
            - depth
            - clarity
            - tradeoffs
      - slug: arena-2-interview-behavioral
        type: interview
        title: Mini-entrevista conductual
        required: true
        estimated_min: 30
        skills:
          english: 1
        payload:
          mode: behavioral
          template: behavioral-core
  - slug: arena-3-journeyman
    number: 3
    title: Journeyman — Screens técnicos por zona y uso responsable de IA
    story: "En la segunda ronda, cada rival domina un arte distinto: Java, mensajería, datos, métricas. Y uno de ellos te observa para ver si usas la magia de la IA con criterio o a ciegas."
    quests:
      - slug: arena-3-learn-technical
        type: learn
        title: Cómo responder preguntas técnicas en voz alta
        required: true
        estimated_min: 30
        skills:
          english: 1
        payload:
          note_prompt: Elige una pregunta técnica de cualquier zona y escribe tu respuesta con la estructura definición → ejemplo → trade-off, en inglés y en menos de 100 palabras.
          summary_md: |
            En un screen técnico (30–45 min) te hacen 5–8 preguntas cortas. No buscan un discurso, buscan claridad y criterio.

            Estructura de respuesta (30–90 segundos):
            1. **Definición en una frase.** "Idempotency means that doing an operation twice has the same effect as doing it once."
            2. **Ejemplo concreto,** de preferencia tuyo. "In my order service, the POST endpoint stores an idempotency key with the order in the same transaction."
            3. **Trade-off o detalle de producción.** "The cost is an extra table and a lookup, and you need a retention policy for the keys."

            Si no sabes algo:
            - No inventes. Di lo que sí sabes y razona en voz alta: "I haven't used X in production, but I'd expect it to work like Y because…".
            - Pregunta para aclarar: "Do you mean at the database level or at the API level?"

            Frases para pensar en voz alta (think aloud):
            - "Let me think about this out loud."
            - "There are two cases here…"
            - "The first thing I'd check is…"
            - "It depends on… If X, I'd do A; if Y, B."
