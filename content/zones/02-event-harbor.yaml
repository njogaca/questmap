  - slug: eda-5-boss
    number: 5
    title: "Boss — Diseñar un flujo de eventos"
    story: "El capitán del puerto te pide diseñar el flujo de órdenes de toda la flota, y defenderlo frente a su consejo en inglés."
    quests:
      - slug: eda-5-learn-review
        type: learn
