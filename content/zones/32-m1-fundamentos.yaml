            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 7
  - slug: m1-n7-transacciones
    number: 7
    title: "Transacciones"
    story: "Objetivo: que una operación de varios pasos quede completa o no quede."
    quests:
      - slug: m1-n7-glosario
        type: glossary
        title: "Glosario — Transacciones"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-transaction, g-p1-rollback, g-p1-atomicity, g-p1-isolation]

      - slug: m1-n7-ejercicio
        type: lab
        title: "Ejercicio — Pedido con varios productos, todo o nada"
        xp: 50
        estimated_min: 180
        skills: { sql_data: 1.0 }
        resources:
          - { ref: res-p-spring-tx, required: false }
        payload:
          proof: commit_or_hours
          goal: "Crear un pedido descuenta inventario de cada producto. Si falta inventario de uno solo, no se guarda nada."
          spec:
            context: |
              Bodega reporta que el sistema vendió 12 teclados cuando había 10. Además encontraron
              pedidos a medias: el inventario de dos productos se descontó, el tercero falló, y el
              pedido nunca apareció. A partir de ahora, crear un pedido y descontar su inventario
              es una sola operación: ocurre completa o no ocurre.
            requirements:
              - "Una migración nueva crea la tabla `inventory`."
              - "`POST /orders` descuenta de `inventory.available` la cantidad de cada línea y guarda el pedido, todo en la misma transacción."
              - "Si algún producto no tiene inventario suficiente, la API responde `409 Conflict` con Problem Details y no cambia nada en la base."
              - "El método del servicio que crea el pedido está anotado con `@Transactional`."
              - "Una prueba de integración demuestra el rollback con el ejemplo de abajo."
            inputs:
              - { name: "inventory.sku", type: "varchar(40)", desc: "Clave primaria. El mismo `sku` de las líneas del pedido." }
              - { name: "inventory.available", type: "integer NOT NULL", desc: "Unidades disponibles. Con `CHECK (available >= 0)`." }
              - { name: "cuerpo de POST /orders", type: "JSON", desc: "El mismo del nivel 5. No cambia." }
            outputs:
              - { name: "201", type: "OrderResponse", desc: "Pedido creado e inventario descontado." }
              - { name: "409", type: "Problem Details", desc: "`detail` nombra el `sku` que falló, cuánto se pidió y cuánto hay." }
            rules:
              - "Todo o nada: si falla una línea, no queda ni el pedido, ni sus líneas, ni el descuento de las líneas anteriores."
              - "Un `sku` que no existe en `inventory` se trata como inventario `0`: responde `409`."
              - "Si el mismo `sku` aparece en dos líneas del pedido, se suman sus cantidades antes de comparar."
              - "La falta de inventario es una excepción propia (`InsufficientStockException`) que el manejador del nivel 5 convierte en `409`."
              - "La restricción `CHECK (available >= 0)` se queda en la base como última defensa, aunque el servicio ya lo compruebe."
              - "La validación del cuerpo va antes: un pedido inválido responde `400` sin tocar el inventario."
            examples:
              - title: "El tercer producto no tiene inventario"
                input: |
                  inventory:  KB-001 = 5,  MS-002 = 5,  HD-003 = 0

                  POST /orders
                  {
                    "customerEmail": "ana@example.com",
                    "items": [
                      { "sku": "KB-001", "productName": "Teclado", "unitPrice": 40.00, "quantity": 2 },
                      { "sku": "MS-002", "productName": "Mouse", "unitPrice": 15.00, "quantity": 1 },
                      { "sku": "HD-003", "productName": "Disco", "unitPrice": 60.00, "quantity": 1 }
                    ]
                  }
                output: |
                  HTTP/1.1 409
                  Content-Type: application/problem+json

                  {
                    "type": "about:blank",
                    "title": "Conflict",
                    "status": 409,
                    "detail": "Insufficient stock for HD-003: requested 1, available 0",
                    "instance": "/orders"
                  }

                  Después del fallo:
                  inventory:  KB-001 = 5,  MS-002 = 5,  HD-003 = 0
                  orders: 0 filas    order_items: 0 filas
              - title: "Pedido que sí alcanza"
                input: |
                  inventory:  KB-001 = 5,  MS-002 = 5

                  POST /orders con KB-001 x 2 y MS-002 x 1
                output: |
                  HTTP/1.1 201

                  inventory:  KB-001 = 3,  MS-002 = 4
                  orders: 1 fila     order_items: 2 filas
            edge_cases:
              - "Pedir exactamente lo que hay (`available = 2`, `quantity = 2`): se acepta y queda en `0`."
              - "El mismo `sku` en dos líneas con 3 y 3 unidades y `available = 5`: `409`."
              - "Quita `@Transactional` un momento y corre la prueba del rollback: debe fallar. Si sigue en verde, la prueba no está demostrando nada."
              - "Una excepción comprobada (`extends Exception`) no hace rollback por defecto. Usa una no comprobada o decláralo en la anotación."
            out_of_scope:
              - "Dos pedidos simultáneos por la última unidad. Resolverlo exige bloqueos y aquí no se pide."
              - "Devolver inventario al borrar o al modificar un pedido."
              - "Endpoints para administrar el inventario: se carga con SQL."
          steps:
            - title: "Inventario"
              body: "Agrega una tabla de inventario por producto, con su migración."
            - title: "Una transacción"
              body: "Marca el método que crea el pedido con `@Transactional`. Descuenta el inventario de cada línea y lanza una excepción si no alcanza."
            - title: "Demuéstralo"
              body: "Escribe una prueba de integración: un pedido con tres productos donde el tercero no tiene inventario. Después de fallar, los otros dos deben seguir intactos."
          checklist:
            - "Sin inventario suficiente no queda ningún pedido guardado"
            - "El inventario de los demás productos no cambia tras el fallo"
            - "Hay una prueba que demuestra el rollback"

      - slug: m1-n7-quiz
        type: quiz
        title: "Quiz — Transacciones"
        xp: 0
        estimated_min: 12
        skills: { sql_data: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué garantiza la atomicidad?"
            options: ["Que la consulta sea rápida", "Que se aplique todo o nada", "Que nadie más lea la tabla"]
            answer: 1
            explanation: "Nunca queda la operación a medias."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "Por defecto, ¿qué excepciones provocan rollback con @Transactional?"
            options: ["Ninguna", "Las no comprobadas (RuntimeException)", "Solo las de SQL"]
            answer: 1
            explanation: "Por defecto revierte con RuntimeException y Error, no con las comprobadas."
            skill: sql_data
            difficulty: 3
          - type: tf
            prompt: "Si atrapas la excepción dentro del método transaccional y no la relanzas, la transacción se revierte igual."
            answer: false
            explanation: "Spring no se entera del fallo y confirma los cambios."
            skill: sql_data
            difficulty: 3
          - type: mcq
            prompt: "¿Dónde conviene poner @Transactional?"
            options: ["En el controlador", "En el método del servicio que agrupa los pasos", "En la entidad"]
            answer: 1
            explanation: "El servicio conoce la operación completa de negocio."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Dos compras intentan llevarse la última unidad a la vez. ¿Qué propiedad lo controla?"
            options: ["El aislamiento", "El índice", "La clave primaria"]
            answer: 0
            explanation: "El aislamiento define qué ve cada transacción de las demás."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué herramienta arranca un PostgreSQL desechable para las pruebas?"
            options: ["Maven", "Testcontainers", "Flyway"]
            answer: 1
            explanation: "Testcontainers crea y destruye el contenedor en cada ejecución."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. Cada prueba de integración debe preparar sus propios datos."
            answer: true
            explanation: "Así no depende del orden ni de otras pruebas."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 8
  - slug: m1-n8-docker
    number: 8
    title: "Docker"
    story: "Objetivo: que cualquiera levante el servicio y su base con un solo comando."
    quests:
      - slug: m1-n8-glosario
        type: glossary
        title: "Glosario — Docker"
        xp: 0
        estimated_min: 10
        skills: { delivery: 1.0 }
        payload:
          terms: [g-p1-image, g-p1-container, g-p1-dockerfile, g-p1-volume]

      - slug: m1-n8-ejercicio
        type: lab
        title: "Ejercicio — El servicio y la base con Docker Compose"
        xp: 50
        estimated_min: 150
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-spring-docker, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un `Dockerfile` para OrderBridge y un `docker-compose.yml` que levanta el servicio y PostgreSQL juntos."
          spec:
            context: |
              Entró una persona nueva al equipo y tardó un día y medio en hacer correr OrderBridge:
              versión de Java distinta, PostgreSQL mal configurado, un paso que solo estaba en tu
              cabeza. El objetivo es que el siguiente tarde cinco minutos, con Docker como único
              requisito y un solo comando.
            requirements:
              - "Un `Dockerfile` en dos etapas: la primera compila el jar con Maven y JDK 21; la segunda solo lo ejecuta sobre una imagen JRE 21."
              - "Un `docker-compose.yml` con dos servicios: `app` (construido desde el `Dockerfile`) y `db` (`postgres:16`)."
              - "`db` guarda sus datos en un volumen con nombre."
              - "`db` tiene un `healthcheck` con `pg_isready`, y `app` arranca solo cuando `db` está sana (`depends_on` con `condition: service_healthy`)."
              - "La configuración de la base llega a `app` por variables de entorno definidas en Compose, leídas de un archivo `.env`."
              - "Un `.dockerignore` deja fuera `target/`, `.git/` y los archivos del editor."
              - "`docker compose up -d --build` desde un clon limpio deja la API respondiendo en `http://localhost:8080`."
            inputs:
              - { name: "POSTGRES_DB", type: "variable de entorno", desc: "Nombre de la base, por ejemplo `orderbridge`." }
              - { name: "POSTGRES_USER", type: "variable de entorno", desc: "Usuario de la base." }
              - { name: "POSTGRES_PASSWORD", type: "variable de entorno", desc: "Contraseña. Vive en `.env`, que no se sube al repositorio." }
              - { name: "SPRING_DATASOURCE_URL", type: "variable de entorno", desc: "`jdbc:postgresql://db:5432/orderbridge`. El host es el nombre del servicio, no `localhost`." }
              - { name: "SPRING_DATASOURCE_USERNAME", type: "variable de entorno", desc: "El mismo usuario que `POSTGRES_USER`." }
              - { name: "SPRING_DATASOURCE_PASSWORD", type: "variable de entorno", desc: "La misma contraseña que `POSTGRES_PASSWORD`." }
            outputs:
              - { name: "docker compose ps", type: "consola", desc: "`db` en estado `healthy` y `app` en `running`." }
              - { name: "GET /status", type: "HTTP", desc: "`200` con `{\"service\":\"orderbridge\",\"status\":\"UP\"}`." }
              - { name: "imagen final", type: "imagen Docker", desc: "Contiene el JRE y el jar. Sin Maven, sin código fuente y sin JDK." }
            rules:
              - "El contenedor de la aplicación no corre como `root`: el `Dockerfile` crea un usuario y cambia a él con `USER`."
              - "Las etiquetas de las imágenes base llevan versión (`postgres:16`, `eclipse-temurin:21-jre`). Nunca `latest`."
              - "`.env` está en `.gitignore`. Se sube un `.env.example` con las mismas claves y valores de ejemplo."
              - "El puerto de PostgreSQL no se publica al host salvo que lo necesites para depurar. La aplicación le habla por la red interna de Compose."
              - "El `Dockerfile` copia primero el `pom.xml` y descarga dependencias, y después copia el código, para que cambiar una clase no vuelva a descargar todo."
            examples:
              - title: "Arranque desde un clon limpio"
                input: |
                  git clone https://github.com/<usuario>/orderbridge.git
                  cd orderbridge
                  cp .env.example .env
                  docker compose up -d --build
                  docker compose ps
                  curl http://localhost:8080/status
                output: |
                  NAME                 STATUS
                  orderbridge-db-1     Up (healthy)
                  orderbridge-app-1    Up

                  {"service":"orderbridge","status":"UP"}
            edge_cases:
              - "`docker compose down` y luego `up`: los pedidos siguen ahí. Con `down -v` se borran, y eso tiene que quedar avisado en el README."
              - "Primer arranque con la base vacía: Flyway crea las tablas y la aplicación no falla por arrancar antes que la base."
              - "Ejecuta `docker compose exec app whoami`: no debe responder `root`."
              - "Las pruebas de integración del nivel 6 siguen pasando: usan su propio contenedor, no el de Compose."
            out_of_scope:
              - "Kubernetes, registros de imágenes y despliegue en la nube."
              - "Reducir el tamaño de la imagen más allá de las dos etapas."
              - "HTTPS y proxy inverso."
          steps:
            - title: "Imagen"
              body: "Escribe un `Dockerfile` en dos etapas: una compila con Maven y la otra solo ejecuta el jar."
            - title: "Compose"
              body: "Define los servicios `app` y `db`. La base usa un volumen y el servicio espera a que la base esté lista."
              commands: ["docker compose up -d --build"]
            - title: "Prueba limpia"
              body: "Clona el repositorio en otra carpeta y levántalo sin instalar nada más que Docker."
          checklist:
            - "`docker compose up` levanta todo sin pasos manuales"
            - "Los datos sobreviven a `docker compose down` sin `-v`"
            - "La imagen final no incluye Maven ni el código fuente"

      - slug: m1-n8-quiz
        type: quiz
        title: "Quiz — Docker"
        xp: 0
        estimated_min: 12
        skills: { delivery: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Cuál es la diferencia entre imagen y contenedor?"
            options: ["Son lo mismo", "La imagen es el paquete y el contenedor es ese paquete en ejecución", "El contenedor es el archivo y la imagen es el proceso"]
            answer: 1
            explanation: "De una imagen puedes arrancar muchos contenedores."
            skill: delivery
