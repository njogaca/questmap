      - slug: m0-n3-ejercicio
        type: lab
        title: "Ejercicio — Clases Pedido, Producto y Cliente"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-classes, required: false }
        payload:
          proof: commit_or_hours
          goal: "Tres clases que representan el dominio de pedidos, con sus datos protegidos y un total calculado por el propio pedido."
          spec:
            context: |
              La calculadora del nivel 2 funcionó, pero ahora piden guardar quién compró y qué compró,
              y los descuentos van a cambiar cada temporada. Dos arreglos paralelos ya no alcanzan:
              el equipo quiere el dominio modelado con clases, y que agregar un descuento nuevo no
              obligue a tocar la clase `Pedido`.
            requirements:
              - "`Producto` se crea con `new Producto(String nombre, double precio)` y expone `getNombre()` y `getPrecio()`."
              - "`Cliente` se crea con `new Cliente(String nombre, String correo)` y expone `getNombre()` y `getCorreo()`."
              - "`Pedido` se crea con `new Pedido(String id, Cliente cliente, Descuento descuento)` y expone `getId()` y `getCliente()`."
              - "`Pedido.agregarLinea(Producto producto, int cantidad)` añade una línea al pedido. No devuelve nada."
              - "`Pedido.subtotal()` devuelve un `double` con la suma de precio × cantidad de sus líneas."
              - "`Pedido.total()` devuelve un `double`: el subtotal menos lo que diga su `Descuento`."
              - "`Descuento` es una interfaz con un solo método, `double calcular(double subtotal)`, que devuelve el monto a descontar."
              - "Hay dos implementaciones: `SinDescuento` (siempre `0.0`) y `DescuentoPorcentaje`, que se crea con `new DescuentoPorcentaje(double porcentaje)`."
            inputs:
              - { name: "nombre", type: "String", desc: "Nombre del producto o del cliente. No puede ser `null` ni estar en blanco." }
              - { name: "precio", type: "double", desc: "Precio unitario. Mayor o igual que `0`." }
              - { name: "correo", type: "String", desc: "Correo del cliente. Debe contener `@`." }
              - { name: "id", type: "String", desc: "Identificador del pedido, por ejemplo `P-001`. No puede estar en blanco." }
              - { name: "cantidad", type: "int", desc: "Unidades de un producto en una línea." }
              - { name: "porcentaje", type: "double", desc: "Entre `0` y `100`. `10` significa 10 %." }
            outputs:
              - { name: "subtotal()", type: "double", desc: "Suma de las líneas, sin descuento." }
              - { name: "total()", type: "double", desc: "Subtotal menos descuento. Nunca negativo." }
            rules:
              - "Todos los campos son `private`. Los de `Producto` y `Cliente` son además `final`: no hay métodos `set`."
              - "Un dato que rompe una regla de la tabla de entradas se rechaza en el constructor con `IllegalArgumentException` y un mensaje que nombra el campo."
              - "Nadie fuera de `Pedido` suma líneas. Si el total se calcula en `main`, el requisito no está cumplido."
              - "`Pedido` no pregunta qué tipo de descuento tiene (nada de `instanceof` ni `if` por tipo): solo llama a `calcular`."
              - "Un descuento nunca supera el subtotal."
            examples:
              - title: "Pedido con 10 % de descuento"
                lang: "java"
                input: |
                  Cliente ana = new Cliente("Ana", "ana@example.com");
                  Pedido pedido = new Pedido("P-001", ana, new DescuentoPorcentaje(10));
                  pedido.agregarLinea(new Producto("Teclado", 40.00), 2);
                  pedido.agregarLinea(new Producto("Mouse", 15.00), 1);
                output: |
                  pedido.subtotal()  // 95.0
                  pedido.total()     // 85.5
              - title: "El mismo pedido sin descuento"
                lang: "java"
                input: |
                  new Pedido("P-002", ana, new SinDescuento())  // mismas dos líneas
                output: |
                  pedido.subtotal()  // 95.0
                  pedido.total()     // 95.0
            edge_cases:
              - "`new Producto(\"Teclado\", -1)` lanza `IllegalArgumentException`."
              - "`new Cliente(\"Ana\", \"sin-arroba\")` lanza `IllegalArgumentException`."
              - "Un pedido sin líneas tiene subtotal y total `0.0`."
              - "Si `Pedido` expone sus líneas, devuelve una copia o una vista de solo lectura: modificar esa lista desde fuera no cambia el pedido."
            out_of_scope:
              - "Validar la cantidad de una línea. Se hace en el nivel 5 con una excepción propia."
              - "Impuestos. El total de este nivel es subtotal menos descuento."
              - "Guardar los pedidos en algún lado. Eso es el nivel 4."
          steps:
            - title: "Producto y Cliente"
              body: "Crea `Producto` (nombre, precio) y `Cliente` (nombre, correo). Campos `private`, constructor que valide y métodos de lectura."
            - title: "Pedido"
              body: "Crea `Pedido` con un cliente y sus líneas (producto y cantidad). El método `total()` lo calcula el pedido; nadie suma desde fuera."
            - title: "Una interfaz"
              body: "Define una interfaz `Descuento` con un método que reciba el subtotal. Escribe dos implementaciones y aplícalas a un pedido."
          checklist:
            - "Ningún campo es público"
            - "Un precio negativo se rechaza en el constructor"
            - "El pedido acepta cualquier implementación de `Descuento`"

      - slug: m0-n3-quiz
