      - slug: arena-5-boss-mock-loop
        type: boss
        title: "Jefe: el loop final con tu expediente"
        required: true
        estimated_min: 120
        skills:
          english: 0.7
          ai_tools: 0.1
          distributed_systems: 0.2
        payload:
          task: |
            **Final loop for: Software Engineer, Backend & Distributed Systems (remote).**

            Arma tu **expediente de candidato** (un solo documento) y pégalo aquí como entregable:
            1. Tu "Tell me about yourself" final (versión 3 o más), en inglés.
            2. Tu banco de historias: 6–8 títulos con su resultado en una línea (con números).
            3. La URL de order-platform y el pitch de 2 minutos del Capstone.
            4. Tus 5 preguntas para el panel.
            5. Tu respuesta a "What are your salary expectations?".
            6. Tu respuesta a "How do you use AI tools in your work?".

            Después, el entrevistador hará un loop condensado (unos 45 minutos) que mezcla tu presentación, preguntas conductuales sobre tus historias, preguntas técnicas sobre tu proyecto y un mini diseño. Al final, te pedirá tus preguntas y cerrará como lo haría un hiring manager.
          rubric:
            - correctness
            - depth
            - clarity
            - tradeoffs
          interview_focus:
            - tell me about yourself and the MQ-to-event-driven bridge story
            - behavioral answers with STAR and quantified impact
            - deep dive on the candidate's capstone project
            - a short system design with trade-offs
            - responsible use of AI tools
            - questions for the interviewer and a strong closing
            - clarity and confidence in English
