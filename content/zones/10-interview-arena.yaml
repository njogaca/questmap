  - slug: arena-5-boss
    number: 5
    title: Boss — Mock Loop completo, negociación y preguntas
    story: "El campeón de la arena te espera: una hora seguida de técnico, conductual y diseño. Si lo vences, todavía falta lo último, y no es menos importante: negociar tu oferta."
    quests:
      - slug: arena-5-learn-process
        type: learn
        title: El proceso de contratación en EE. UU., de punta a punta
        required: true
        estimated_min: 25
        skills:
          english: 1
        payload:
          note_prompt: "Escribe tu plan para el día de la entrevista remota: equipo, conexión, ventana con tus notas (sin leerlas), agua, y qué haces en los 10 minutos antes."
          summary_md: |
            Un proceso típico para un puesto backend en una empresa grande de EE. UU.:
            1. **Recruiter screen** (20–30 min): motivación, experiencia, autorización para trabajar, expectativas salariales, disponibilidad.
            2. **Hiring manager screen** (30–45 min): tu historia, proyectos, cómo trabajas en equipo.
            3. **Technical screen** (45–60 min): preguntas técnicas o código en vivo.
            4. **Loop final** (3–5 entrevistas el mismo día o en dos días): código, system design, conductual y, a veces, "culture fit" o valores.
            5. **Oferta** y negociación.

            Para entrevistas remotas:
            - Cámara a la altura de los ojos, buena luz y audio con audífonos.
            - Prueba Zoom/Teams/Meet antes, y comparte pantalla solo lo que quieras mostrar.
            - Ten agua y una hoja con 3–4 palabras clave (no un guion).
            - Si se corta la conexión, vuelve a entrar con calma y di "Sorry about that, where were we?".

            Después de cada entrevista: un correo corto de agradecimiento al recruiter en las siguientes 24 horas.
      - slug: arena-5-learn-negotiation
        type: learn
        title: Negociación y preguntas para el entrevistador
        required: true
        estimated_min: 45
        skills:
          english: 1
        resources:
          - ref: res-negotiation-haseeb
          - ref: res-salary-negotiation-patio11
          - ref: res-reverse-interview
        payload:
          note_prompt: Escribe tus 5 preguntas para el entrevistador (al menos una sobre el equipo, una técnica y una sobre cómo se mide el éxito en los primeros 90 días) y la frase con la que responderías '¿cuáles son tus expectativas salariales?'.
          summary_md: |
            **Preguntas para el entrevistador** (siempre te dirán "Do you have any questions for me?"). Tener 3–5 buenas preguntas muestra interés real:
            - "What does success look like in the first 90 days for this role?"
            - "What are the biggest technical challenges the team is facing this year?"
            - "How does the team handle on-call and incidents?"
            - "How do you decide between building new features and paying down technical debt?"
            - "What do you enjoy most about working on this team?"

            Evita preguntar por vacaciones o salario al ingeniero del panel: eso va con el recruiter.

            **Negociación** (las ideas clave de los recursos):
            - Investiga el rango de mercado para el puesto y la ciudad antes de la primera llamada (por ejemplo, el rango publicado en la oferta, si lo hay).
            - Si te piden un número muy temprano, puedes devolver la pregunta con amabilidad: "I'd like to learn more about the role first. Could you share the range budgeted for this position?"
            - Mantén el entusiasmo por la empresa mientras negocias: no es una pelea.
            - Da una razón para cada pedido ("Based on my experience running critical messaging systems…").
            - Mira el paquete completo: salario base, bono, acciones (RSU), 401(k), seguro médico, vacaciones, fecha de inicio.
            - Pide todo por escrito y toma tu tiempo para decidir.

            Estas son pautas generales de comunicación, no asesoría financiera ni legal: tu decisión depende de tu situación.
