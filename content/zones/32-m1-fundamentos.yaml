# Mundo 1 de la ruta plan-2027. Misma forma que el Mundo 0: glosario + ejercicio + quiz por nivel.
# Todo el mundo construye un solo proyecto: OrderBridge, un servicio de pedidos.
slug: m1-fundamentos
title: "Mundo 1 · Fundamentos"
order: 32
emoji: "🧱"
track: plan-2027
map: { x: 340, y: 300 }
unlocked_from_start: false
prerequisites:
  - { zone: m0-recuperar-horas, level: 7 }
skills: [spring_api, sql_data, delivery]
story: >
  Fase 1 del plan: de enero a marzo de 2027. El mismo dominio de pedidos, ahora como un
  servicio de verdad: Spring Boot, PostgreSQL, pruebas, Docker y CI. Doce niveles y un jefe
  el 15 de marzo: la etapa 1 de OrderBridge publicada en GitHub. Se abre al vencer al jefe
  del Mundo 0.

levels:
  # ================================================================ NIVEL 1
  - slug: m1-n1-spring-boot
    number: 1
    title: "Spring Boot, primer endpoint"
    story: "Objetivo: levantar un servicio Spring Boot y responder una petición HTTP."
    quests:
      - slug: m1-n1-glosario
        type: glossary
        title: "Glosario — Spring Boot"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-framework, g-p1-endpoint, g-p1-controller, g-p1-dependency-injection]

      - slug: m1-n1-ejercicio
        type: lab
        title: "Ejercicio — GET de estado del servicio"
        xp: 50
        estimated_min: 120
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-boot-first-app, required: false }
        payload:
          proof: commit_or_hours
          goal: "El proyecto OrderBridge creado con Spring Boot y un endpoint `GET /status` que responde con el nombre y el estado del servicio."
          spec:
            context: |
              OrderBridge es el servicio de pedidos que vas a construir durante todo este mundo.
              Antes de escribir una sola regla de negocio, el equipo de plataforma necesita un
              endpoint para saber si el servicio está vivo: el balanceador lo va a consultar cada
              pocos segundos y lo que responda decide si te manda tráfico o no.
            requirements:
              - "El proyecto es Spring Boot 3 con Maven y Java 21, `artifactId` `orderbridge`, y la dependencia `spring-boot-starter-web`."
              - "`GET /status` responde `200 OK` con `Content-Type: application/json`."
              - "El cuerpo es un objeto JSON con exactamente dos campos: `service` y `status`."
              - "El servicio escucha en el puerto `8080`."
              - "El código está en un repositorio de GitHub llamado `orderbridge`, con `.gitignore` de Maven."
            inputs:
              - { name: "GET /status", type: "petición HTTP", desc: "Sin cuerpo, sin parámetros y sin cabeceras obligatorias." }
            outputs:
              - { name: "service", type: "string", desc: "Nombre del servicio. Siempre `orderbridge`." }
              - { name: "status", type: "string", desc: "`UP` mientras el servicio atiende peticiones." }
            rules:
              - "La respuesta sale de un tipo propio (un `record StatusResponse(String service, String status)`), no de un `Map` ni de un texto armado a mano."
              - "El nombre del servicio se lee de `spring.application.name`; no está repetido dentro del controlador."
              - "El controlador solo atiende `GET`. Otro método sobre `/status` responde `405`."
            examples:
              - title: "Servicio arriba"
                input: |
                  curl -i http://localhost:8080/status
                output: |
                  HTTP/1.1 200
                  Content-Type: application/json

                  {"service":"orderbridge","status":"UP"}
            edge_cases:
              - "`POST /status` responde `405 Method Not Allowed`."
              - "`GET /no-existe` responde `404`, no `200` ni una página en blanco."
              - "Si el puerto 8080 está ocupado, el arranque falla con un mensaje claro. Identifica qué proceso lo usa en vez de cambiar el puerto en el código."
            out_of_scope:
              - "Spring Boot Actuator. Es la herramienta real para esto, pero aquí escribes el endpoint a mano para entender un controlador."
              - "Base de datos, seguridad y pruebas. Cada una tiene su nivel."
          steps:
            - title: "Crea el proyecto"
              body: "Genera un proyecto Spring Boot con Maven y la dependencia web. Arráncalo."
              commands: ["mvn spring-boot:run"]
            - title: "El endpoint"
              body: "Crea un controlador con `GET /status` que devuelva un JSON con `service` y `status`."
              commands: ["curl http://localhost:8080/status"]
            - title: "Repositorio"
              body: "Crea el repositorio `orderbridge` en GitHub y sube este primer avance."
          checklist:
            - "El servicio arranca sin errores"
            - "`GET /status` responde 200 con un JSON"
            - "El código está en el repositorio"

      - slug: m1-n1-quiz
        type: quiz
        title: "Quiz — Spring Boot"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué anotación convierte una clase en un controlador que devuelve datos y no páginas?"
            options: ["@Service", "@RestController", "@Entity"]
            answer: 1
            explanation: "@RestController recibe peticiones y serializa la respuesta, normalmente a JSON."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿En qué puerto escucha Spring Boot si no configuras nada?"
            options: ["8080", "80", "3000"]
            answer: 0
            explanation: "El valor por defecto es 8080. Se cambia con server.port."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Con inyección de dependencias, cada clase crea con new los objetos que necesita."
            answer: false
            explanation: "Es al revés: Spring construye los objetos y se los entrega a la clase."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué hace @SpringBootApplication en la clase principal?"
            options: ["Crea la base de datos", "Activa la configuración automática y la búsqueda de componentes", "Publica el servicio en internet"]
            answer: 1
            explanation: "Es el punto de arranque: configura Spring según las dependencias y encuentra tus clases."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué define a un endpoint?"
            options: ["Solo la ruta", "El método HTTP y la ruta", "El nombre de la clase"]
            answer: 1
            explanation: "GET /status y POST /status son endpoints distintos."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 2
  - slug: m1-n2-rest
    number: 2
    title: "REST completo"
    story: "Objetivo: exponer las cuatro operaciones básicas sobre pedidos con los métodos y códigos HTTP correctos."
    quests:
      - slug: m1-n2-glosario
        type: glossary
        title: "Glosario — REST"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-rest, g-p1-http-method, g-p1-status-code, g-p1-request-body]

      - slug: m1-n2-ejercicio
        type: lab
        title: "Ejercicio — Crear, leer, actualizar y borrar pedidos"
        xp: 50
        estimated_min: 180
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-spring-rest, required: false }
        payload:
          proof: commit_or_hours
          goal: "Los endpoints de `/orders` para crear, leer, actualizar y borrar, con los pedidos guardados en memoria por ahora."
          spec:
            context: |
              El equipo de la tienda web necesita registrar pedidos desde su frontend y consultarlos
              después. Tú eres dueño de la API: este requerimiento es el contrato que ellos van a
              programar contra ti, así que los nombres de los campos, los tipos y los códigos HTTP
              no son detalles. Si cambian después, les rompes la integración.
            requirements:
              - "`POST /orders` crea un pedido. Responde `201 Created`, la cabecera `Location: /orders/{id}` y el pedido creado en el cuerpo."
              - "`GET /orders` responde `200` con un arreglo JSON de todos los pedidos. Sin pedidos, responde `[]`."
              - "`GET /orders/{id}` responde `200` con el pedido, o `404` si no existe."
              - "`PUT /orders/{id}` reemplaza `customerEmail` e `items` del pedido. Responde `200` con el pedido actualizado, o `404` si no existe."
              - "`DELETE /orders/{id}` borra el pedido. Responde `204` sin cuerpo, o `404` si no existe."
              - "El código está en tres capas: `OrderController` (HTTP), `OrderService` (reglas) y `OrderRepository` (almacén en memoria)."
            inputs:
              - { name: "customerEmail", type: "string", desc: "Correo del cliente que hace el pedido." }
              - { name: "items", type: "array", desc: "Líneas del pedido." }
              - { name: "items[].sku", type: "string", desc: "Código del producto, por ejemplo `KB-001`." }
              - { name: "items[].productName", type: "string", desc: "Nombre del producto tal como se mostró al cliente." }
              - { name: "items[].unitPrice", type: "number", desc: "Precio unitario con dos decimales. En Java, `BigDecimal`." }
              - { name: "items[].quantity", type: "integer", desc: "Unidades. En Java, `int`." }
              - { name: "id (ruta)", type: "UUID", desc: "Identificador del pedido en `/orders/{id}`." }
            outputs:
              - { name: "id", type: "string (UUID)", desc: "Lo genera el servidor al crear. El cliente nunca lo envía." }
              - { name: "customerEmail", type: "string", desc: "El mismo que se recibió." }
              - { name: "items", type: "array", desc: "Las mismas líneas, con los mismos cuatro campos." }
              - { name: "total", type: "number", desc: "Lo calcula el servidor. En Java, `BigDecimal` con dos decimales." }
              - { name: "createdAt", type: "string (ISO-8601, UTC)", desc: "Momento de creación, por ejemplo `2027-01-12T15:04:05Z`. En Java, `Instant`." }
            rules:
              - "`total` = suma de `unitPrice × quantity` de todas las líneas. Si el cliente manda un `total` en el cuerpo, se ignora."
              - "El dinero es `BigDecimal`, nunca `double`."
              - "`PUT` recalcula `total` y conserva `id` y `createdAt`."
              - "El controlador no tiene reglas de negocio: traduce HTTP a llamadas del servicio y de vuelta."
              - "La petición y la respuesta son tipos distintos (`OrderRequest` y `OrderResponse`). La clase interna `Order` no se expone directamente."
            examples:
              - title: "Crear un pedido"
                input: |
                  POST /orders
                  Content-Type: application/json

                  {
                    "customerEmail": "ana@example.com",
                    "items": [
                      { "sku": "KB-001", "productName": "Teclado", "unitPrice": 40.00, "quantity": 2 },
                      { "sku": "MS-002", "productName": "Mouse", "unitPrice": 15.00, "quantity": 1 }
                    ]
                  }
                output: |
                  HTTP/1.1 201
                  Location: /orders/3f2b8c1e-6a4d-4e0b-9c7a-2d5e8f1a0b3c
                  Content-Type: application/json

                  {
                    "id": "3f2b8c1e-6a4d-4e0b-9c7a-2d5e8f1a0b3c",
                    "customerEmail": "ana@example.com",
                    "items": [
                      { "sku": "KB-001", "productName": "Teclado", "unitPrice": 40.00, "quantity": 2 },
                      { "sku": "MS-002", "productName": "Mouse", "unitPrice": 15.00, "quantity": 1 }
                    ],
                    "total": 95.00,
                    "createdAt": "2027-01-12T15:04:05Z"
                  }
              - title: "Pedir un id que no existe"
                input: |
                  GET /orders/00000000-0000-0000-0000-000000000000
                output: |
                  HTTP/1.1 404
            edge_cases:
              - "Borrar dos veces el mismo pedido: la primera responde `204`, la segunda `404`."
              - "Un id que no es UUID (`GET /orders/abc`) responde `400`, no `500`."
              - "`PUT` sobre un id inexistente responde `404`. No crea el pedido."
              - "Dos `POST` con el mismo cuerpo crean dos pedidos con ids distintos."
            out_of_scope:
              - "Validar el contenido del cuerpo. Es el nivel 5."
              - "Base de datos. Es el nivel 3: al reiniciar el servicio, los pedidos se pierden."
              - "Paginación, filtros y `PATCH`."
          steps:
            - title: "Capas"
              body: "Separa controlador, servicio y un almacén en memoria. El controlador no tiene reglas de negocio."
            - title: "Los cinco endpoints"
              body: "`POST /orders`, `GET /orders`, `GET /orders/{id}`, `PUT /orders/{id}` y `DELETE /orders/{id}`."
            - title: "Códigos"
              body: "Crear responde 201, borrar responde 204 y un id inexistente responde 404."
          checklist:
            - "Los cinco endpoints responden"
            - "Los códigos HTTP son los correctos"
            - "El controlador solo delega en el servicio"

      - slug: m1-n2-quiz
        type: quiz
        title: "Quiz — REST"
        xp: 0
        estimated_min: 12
        skills: { spring_api: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué código devuelve un POST que creó un pedido?"
            options: ["200", "201", "204"]
            answer: 1
            explanation: "201 Created indica que se creó un recurso nuevo."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué método HTTP se usa para borrar el pedido 7?"
            options: ["DELETE /orders/7", "GET /orders/7/delete", "POST /orders/delete"]
            answer: 0
            explanation: "En REST el verbo va en el método, no en la ruta."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Llamar dos veces al mismo GET debe dejar los datos igual que llamarlo una vez."
            answer: true
            explanation: "GET solo lee. No debe cambiar nada en el servidor."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "Piden el pedido 99 y no existe. ¿Qué respondes?"
            options: ["200 con cuerpo vacío", "500", "404"]
            answer: 2
            explanation: "404 dice que el recurso no existe. 500 sería un fallo del servidor, que no es el caso."
            skill: spring_api
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación toma el id de la ruta /orders/{id}?"
            options: ["@RequestBody", "@PathVariable", "@Autowired"]
            answer: 1
            explanation: "@PathVariable lee partes de la ruta. @RequestBody lee el cuerpo."
            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Quién construye los objetos que un controlador necesita?"
            options: ["El propio controlador con new", "Spring", "El navegador"]
            answer: 1
            explanation: "Eso es la inyección de dependencias."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. @RestController devuelve datos, normalmente en JSON."
            answer: true
            explanation: "Spring serializa el objeto de retorno a JSON."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 3
  - slug: m1-n3-jpa
    number: 3
    title: "PostgreSQL con JPA"
    story: "Objetivo: que los pedidos sobrevivan a un reinicio, guardados en PostgreSQL."
    quests:
      - slug: m1-n3-glosario
        type: glossary
        title: "Glosario — Persistencia"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-entity, g-p1-orm, g-p1-primary-key, g-p1-migration]

      - slug: m1-n3-ejercicio
        type: lab
        title: "Ejercicio — Pedidos guardados en base de datos"
        xp: 50
        estimated_min: 180
        skills: { sql_data: 1.0 }
        resources:
          - { ref: res-p-spring-jpa, required: false }
        payload:
          proof: commit_or_hours
          goal: "El almacén en memoria reemplazado por PostgreSQL con Spring Data JPA."
          spec:
            context: |
              Ayer reiniciaron el servicio para desplegar un cambio y se perdieron todos los pedidos
              del día. Hay que guardarlos en PostgreSQL. La condición del equipo web es que no se
              enteren: la API debe responder exactamente igual que en el nivel 2.
            requirements:
              - "Los pedidos y sus líneas se guardan en PostgreSQL 16."
              - "`Order` y `OrderItem` son entidades JPA, con una relación de uno a muchos."
              - "`OrderRepository` pasa a ser una interfaz de Spring Data (`JpaRepository<Order, UUID>`). El servicio y el controlador no cambian su contrato."
              - "Las tablas las crea una migración de Flyway, `V1__create_orders.sql`."
              - "Los cinco endpoints del nivel 2 responden con los mismos cuerpos y los mismos códigos."
            inputs:
              - { name: "spring.datasource.url", type: "string", desc: "URL JDBC, por ejemplo `jdbc:postgresql://localhost:5432/orderbridge`." }
              - { name: "spring.datasource.username", type: "string", desc: "Usuario de la base. Por ahora en `application.yml`; sale del código en el nivel 10." }
              - { name: "spring.datasource.password", type: "string", desc: "Contraseña de la base. Igual que el usuario." }
            outputs:
              - { name: "orders.id", type: "uuid", desc: "Clave primaria." }
              - { name: "orders.customer_email", type: "varchar(255) NOT NULL", desc: "Correo del cliente." }
              - { name: "orders.total", type: "numeric(12,2) NOT NULL", desc: "Total calculado por el servicio." }
              - { name: "orders.created_at", type: "timestamptz NOT NULL", desc: "Momento de creación." }
              - { name: "order_items.id", type: "bigint", desc: "Clave primaria generada por la base." }
              - { name: "order_items.order_id", type: "uuid NOT NULL", desc: "Clave foránea a `orders(id)` con `ON DELETE CASCADE`." }
              - { name: "order_items.sku", type: "varchar(40) NOT NULL", desc: "Código del producto." }
              - { name: "order_items.product_name", type: "varchar(120) NOT NULL", desc: "Nombre del producto." }
              - { name: "order_items.unit_price", type: "numeric(12,2) NOT NULL", desc: "Precio unitario." }
              - { name: "order_items.quantity", type: "integer NOT NULL", desc: "Unidades." }
            rules:
              - "`spring.jpa.hibernate.ddl-auto` vale `validate`. Hibernate comprueba el esquema; no lo crea ni lo modifica."
              - "Una migración ya aplicada no se edita. Un cambio de esquema es un archivo nuevo (`V2__...`)."
              - "Borrar un pedido borra sus líneas."
              - "Las entidades no salen por la API: el controlador sigue devolviendo `OrderResponse`."
              - "El dinero es `numeric` en la base y `BigDecimal` en Java. Nunca `float`, `double` ni `real`."
            examples:
              - title: "Los datos sobreviven al reinicio"
                input: |
                  1. POST /orders          (el pedido de Ana del nivel 2)
                  2. Detén el servicio y vuelve a arrancarlo
                  3. GET /orders
                output: |
                  HTTP/1.1 200

                  [ { "id": "3f2b8c1e-...", "customerEmail": "ana@example.com", "total": 95.00, ... } ]
              - title: "Lo que quedó en la base"
                lang: "sql"
                input: |
                  SELECT sku, unit_price, quantity FROM order_items ORDER BY id;
                output: |
                  sku    | unit_price | quantity
                  -------+------------+---------
                  KB-001 |      40.00 |        2
                  MS-002 |      15.00 |        1
            edge_cases:
              - "Arrancar con la base apagada: el servicio falla al iniciar con un error de conexión legible. No arranca a medias."
              - "Arrancar contra una base vacía: Flyway crea las tablas solo, sin pasos manuales."
              - "`DELETE /orders/{id}` no deja filas huérfanas en `order_items`."
              - "`GET /orders/{id}` devuelve las líneas sin lanzar `LazyInitializationException`."
            out_of_scope:
              - "Tablas de clientes o de productos: el pedido guarda el correo y el nombre del producto como texto."
              - "Índices y rendimiento. Es el nivel 4."
              - "Docker. Por ahora PostgreSQL corre como lo tengas instalado; el nivel 8 lo mete en Compose."
          steps:
            - title: "Base de datos"
              body: "Levanta PostgreSQL en local y configura la conexión en el proyecto."
            - title: "Entidades y repositorio"
              body: "Convierte `Order` y sus líneas en entidades. Crea un repositorio de Spring Data y úsalo desde el servicio."
            - title: "Esquema versionado"
              body: "Crea las tablas con una migración de Flyway en lugar de dejar que Hibernate las genere."
          checklist:
            - "Los pedidos siguen ahí después de reiniciar el servicio"
            - "Las tablas se crean con una migración"
            - "Los endpoints del nivel 2 siguen funcionando igual"

      - slug: m1-n3-quiz
        type: quiz
        title: "Quiz — Persistencia"
        xp: 0
        estimated_min: 12
        skills: { sql_data: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué anotación marca una clase como tabla en JPA?"
            options: ["@Entity", "@Table", "@Repository"]
            answer: 0
            explanation: "@Entity hace que JPA la trate como tabla. @Table solo ajusta el nombre."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "¿Qué anotación marca el campo que es clave primaria?"
            options: ["@Key", "@Primary", "@Id"]
            answer: 2
            explanation: "@Id identifica la clave primaria de la entidad."
            skill: sql_data
            difficulty: 1
          - type: tf
            prompt: "Con Spring Data JPA tienes que escribir a mano la implementación de findById."
            answer: false
            explanation: "Basta declarar la interfaz del repositorio. Spring genera la implementación."
            skill: sql_data
            difficulty: 1
          - type: mcq
            prompt: "¿Por qué usar migraciones en lugar de dejar que Hibernate cree las tablas?"
            options: ["Porque es más rápido al arrancar", "Porque cada cambio del esquema queda versionado y repetible", "Porque Hibernate no puede crear tablas"]
            answer: 1
            explanation: "Con migraciones todos los entornos pasan por los mismos cambios, en el mismo orden."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Un pedido tiene muchas líneas. ¿Qué relación es desde el pedido?"
            options: ["@ManyToOne", "@OneToMany", "@OneToOne"]
            answer: 1
            explanation: "Un pedido, muchas líneas. Desde la línea hacia el pedido es @ManyToOne."
            skill: sql_data
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué código responde un DELETE correcto que no devuelve contenido?"
            options: ["204", "201", "404"]
            answer: 0
            explanation: "204 No Content: salió bien y no hay cuerpo."
            skill: spring_api
            difficulty: 1
          - type: tf
            prompt: "Repaso. PUT sirve para reemplazar un recurso existente."
            answer: true
            explanation: "PUT envía la versión completa del recurso."
            skill: spring_api
            difficulty: 1

  # ================================================================ NIVEL 4
  - slug: m1-n4-sql
    number: 4
    title: "SQL a mano"
    story: "Objetivo: leer y escribir SQL sin depender del ORM, y saber cuándo una consulta es lenta."
    quests:
      - slug: m1-n4-glosario
        type: glossary
        title: "Glosario — SQL"
        xp: 0
        estimated_min: 10
        skills: { sql_data: 1.0 }
        payload:
          terms: [g-p1-join, g-p1-foreign-key, g-p1-index, g-p1-query-plan]

      - slug: m1-n4-ejercicio
        type: lab
        title: "Ejercicio — Consultas con joins e índices"
        xp: 50
        estimated_min: 180
        skills: { sql_data: 1.0 }
        resources:
          - { ref: res-p-spring-jdbc, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un archivo `queries.sql` con consultas escritas a mano sobre pedidos, y un índice justificado con el plan de la consulta."
          spec:
            context: |
              Operaciones pide cinco reportes y el panel de «pedidos recientes» tarda varios segundos
              en producción. El ORM no te va a resolver ninguna de las dos cosas: toca escribir SQL
              a mano, medir, y demostrar con números que el índice que propones sirve.
            requirements:
              - "`db/queries.sql` contiene cinco consultas, cada una precedida por un comentario con su número y lo que responde."
              - "Q1: cada pedido con sus líneas (una fila por línea)."
              - "Q2: total vendido y número de pedidos por cliente."
              - "Q3: los tres productos más vendidos por unidades."
              - "Q4: pedidos que no tienen ninguna línea."
              - "Q5: pedidos creados en los últimos 7 días, del más reciente al más antiguo."
              - "`db/seed.sql` carga datos de prueba: al menos 100 000 pedidos repartidos en el último año, con 1 a 5 líneas cada uno."
              - "Una migración `V2__...sql` agrega un índice que mejora Q5."
              - "El README tiene una sección «Performance» con el plan de Q5 antes y después del índice."
            inputs:
              - { name: "orders", type: "tabla", desc: "La del nivel 3: `id`, `customer_email`, `total`, `created_at`." }
              - { name: "order_items", type: "tabla", desc: "La del nivel 3: `order_id`, `sku`, `product_name`, `unit_price`, `quantity`." }
            outputs:
              - { name: "Q1", type: "filas", desc: "`order_id`, `customer_email`, `sku`, `quantity`, `unit_price`, ordenado por `order_id` y `sku`." }
              - { name: "Q2", type: "filas", desc: "`customer_email`, `orders_count`, `total_spent`, de mayor a menor gasto." }
              - { name: "Q3", type: "3 filas", desc: "`sku`, `units_sold`, de mayor a menor." }
              - { name: "Q4", type: "filas", desc: "`id`, `customer_email`, `created_at` de los pedidos sin líneas." }
              - { name: "Q5", type: "filas", desc: "`id`, `customer_email`, `total`, `created_at`." }
              - { name: "medición", type: "tabla en el README", desc: "Tipo de nodo (`Seq Scan` o `Index Scan`) y `Execution Time` en ms, antes y después." }
            rules:
              - "Ninguna consulta usa `SELECT *`: se nombran las columnas."
              - "Q1 usa `JOIN`, Q2 y Q3 usan `GROUP BY`, y Q4 se resuelve con `LEFT JOIN ... IS NULL` o con `NOT EXISTS`."
              - "Toda consulta con `ORDER BY` desempata con una segunda columna, para que el resultado sea siempre el mismo."
              - "Q5 calcula la fecha con `now() - interval '7 days'`. No lleva una fecha escrita a mano."
              - "El índice se justifica con `EXPLAIN ANALYZE`, medido sobre los datos del seed. «Debería ir más rápido» no cuenta."
              - "El seed es un script repetible (usa `generate_series`), no un volcado de un millón de `INSERT`."
            examples:
              - title: "Forma del resultado de Q2"
                lang: "sql"
                output: |
                  customer_email   | orders_count | total_spent
                  -----------------+--------------+------------
                  luis@example.com |            1 |      200.00
                  ana@example.com  |            2 |      100.00
              - title: "Sección Performance del README"
                lang: "markdown"
                output: |
                  | Q5 (last 7 days) | Plan node  | Execution time |
                  |------------------|------------|----------------|
                  | Before index     | Seq Scan   | (tu medición) ms |
                  | After index      | Index Scan | (tu medición) ms |
            edge_cases:
              - "Inserta a mano un pedido sin líneas y comprueba que Q4 lo devuelve y que Q1 no."
              - "Dos productos empatados en unidades en Q3: el orden debe ser el mismo en cada ejecución."
              - "Con pocos datos PostgreSQL ignora el índice y sigue con `Seq Scan`. No es un error: por eso se mide con 100 000 pedidos."
              - "Después de cargar el seed, ejecuta `ANALYZE` antes de medir."
            out_of_scope:
              - "Reescribir los endpoints con SQL nativo. La API sigue usando JPA."
              - "Particiones, vistas materializadas y réplicas."
          steps:
            - title: "Consultas"
              body: "Escribe las cinco consultas del requerimiento en `db/queries.sql` y pruébalas con pocos datos, donde puedas comprobar el resultado a ojo."
            - title: "Mide"
              body: "Carga datos de prueba suficientes y mira el plan de una consulta lenta con `EXPLAIN ANALYZE`."
            - title: "Índice"
              body: "Agrega un índice con una migración, vuelve a medir y anota el antes y el después en el README."
          checklist:
            - "Las cinco consultas devuelven el resultado correcto"
            - "Hay al menos un `JOIN` y un `GROUP BY`"
            - "El índice está en una migración y su efecto está anotado"

      - slug: m1-n4-quiz
        type: quiz
