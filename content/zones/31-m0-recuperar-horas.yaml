        type: glossary
        title: "Glosario — Colecciones"
        xp: 0
        estimated_min: 10
        skills: { core_java: 1.0 }
        payload:
          terms: [g-p0-collection, g-p0-list, g-p0-map, g-p0-generics]

      - slug: m0-n4-ejercicio
        type: lab
        title: "Ejercicio — Lista de pedidos con búsqueda y filtro"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-collections, required: false }
        payload:
          proof: commit_or_hours
          goal: "Una clase que guarda pedidos en memoria y permite buscarlos por id y filtrarlos."
          steps:
            - title: "Almacén de pedidos"
              body: "Crea `RepositorioPedidos` con un `Map<String, Pedido>` por id. Métodos para agregar, buscar por id y listar todos."
            - title: "Filtros"
              body: "Agrega filtros por cliente y por total mínimo. Devuelven una `List<Pedido>` nueva; no modifican el almacén."
            - title: "Casos límite"
              body: "Decide qué pasa con un id repetido y con un id que no existe, y hazlo explícito en el código."
          checklist:
            - "Buscar por id no recorre toda la lista"
            - "Los filtros devuelven listas nuevas"
            - "Un id inexistente no rompe el programa"

      - slug: m0-n4-quiz
        type: quiz
        title: "Quiz — Colecciones"
        xp: 0
        estimated_min: 12
        skills: { core_java: 1.0 }
        questions:
          - type: mcq
            prompt: "Necesitas encontrar un pedido por su id muchas veces. ¿Qué colección conviene?"
            options: ["List", "Map", "Un arreglo"]
            answer: 1
            explanation: "Un Map busca por clave directamente. En una lista habría que recorrer los elementos."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Una List permite elementos repetidos."
            answer: true
            explanation: "La lista conserva el orden y admite repetidos. El que no los admite es Set."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Qué gana el código al declarar List<Pedido> en lugar de List a secas?"
            options: ["Va más rápido", "El compilador impide meter otro tipo", "Ocupa menos memoria"]
            answer: 1
            explanation: "Los genéricos mueven el error al momento de compilar, antes de ejecutar."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "¿Qué devuelve map.get(clave) si la clave no existe?"
            options: ["Una excepción", "null", "Una cadena vacía"]
            answer: 1
            explanation: "get devuelve null. Por eso hay que decidir qué hacer cuando el id no está."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "¿Qué pasa al guardar en un Map dos valores con la misma clave?"
            options: ["Se guardan los dos", "El segundo reemplaza al primero", "El programa no compila"]
            answer: 1
            explanation: "Cada clave tiene un solo valor. put con una clave existente sustituye el anterior."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué es una interfaz?"
            options: ["Un contrato de métodos", "Un tipo de ciclo", "Una colección"]
            answer: 0
            explanation: "La interfaz lista métodos que las clases prometen implementar."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Repaso. Un campo private puede modificarse directamente desde otra clase."
            answer: false
            explanation: "Solo la propia clase accede a sus campos private."
            skill: core_java
            difficulty: 1

  # ================================================================ NIVEL 5
  - slug: m0-n5-excepciones-streams
    number: 5
    title: "Excepciones, lambdas y streams"
    story: "Objetivo: manejar errores a propósito y procesar colecciones sin escribir cada ciclo a mano."
    quests:
      - slug: m0-n5-glosario
        type: glossary
        title: "Glosario — Errores y streams"
        xp: 0
        estimated_min: 10
        skills: { core_java: 1.0 }
        payload:
          terms: [g-p0-exception, g-p0-stack-trace, g-p0-lambda, g-p0-stream]

      - slug: m0-n5-ejercicio
        type: lab
        title: "Ejercicio — Validaciones y reporte de pedidos"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-streams, required: false }
        payload:
          proof: commit_or_hours
          goal: "Pedidos que se validan con excepciones propias y un reporte calculado con streams."
          steps:
            - title: "Validaciones"
              body: "Crea una excepción `PedidoInvalidoException`. Lánzala cuando el pedido no tenga líneas o una cantidad sea menor que 1, con un mensaje que diga qué falló."
            - title: "Reporte"
              body: "Con streams calcula el total vendido, el pedido más grande y el total por cliente."
            - title: "Atrapar donde toca"
              body: "Atrapa la excepción en `main` y muestra un mensaje claro. No la atrapes en medio para ignorarla."
          checklist:
            - "Un pedido inválido lanza la excepción propia"
            - "El reporte no usa ciclos for"
            - "Ningún `catch` está vacío"

      - slug: m0-n5-quiz
        type: quiz
        title: "Quiz — Errores y streams"
        xp: 0
        estimated_min: 12
        skills: { core_java: 1.0 }
        questions:
          - type: mcq
            prompt: "¿Qué pasa si se lanza una excepción y nadie la atrapa?"
            options: ["El programa la ignora", "El programa se detiene y muestra el stack trace", "Java la corrige sola"]
            answer: 1
            explanation: "Una excepción sin atrapar sube hasta main y termina el programa."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Qué hace filter en un stream?"
            options: ["Transforma cada elemento", "Deja pasar solo los que cumplen una condición", "Ordena los elementos"]
            answer: 1
            explanation: "filter conserva los elementos que cumplen. El que transforma es map."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Un bloque catch vacío es una buena forma de manejar un error."
            answer: false
            explanation: "Un catch vacío esconde el problema. Después nadie sabe por qué fallan los datos."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿Qué es p -> p.total() > 100?"
            options: ["Una clase", "Una expresión lambda", "Un ciclo"]
            answer: 1
            explanation: "Es una función sin nombre que recibe p y devuelve verdadero o falso."
            skill: core_java
            difficulty: 1
          - type: mcq
            prompt: "¿En qué parte del stack trace suele estar la línea donde falló tu código?"
            options: ["Al final", "En las primeras líneas", "No aparece"]
            answer: 1
            explanation: "La parte de arriba muestra el punto del fallo; lo de abajo es cómo se llegó hasta ahí."
            skill: core_java
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué colección busca un valor por su clave?"
            options: ["List", "Map", "Set"]
            answer: 1
            explanation: "Map guarda pares clave y valor."
            skill: core_java
            difficulty: 1
          - type: tf
            prompt: "Repaso. List<Pedido> acepta que agregues un String."
            answer: false
            explanation: "El tipo genérico hace que el compilador lo rechace."
            skill: core_java
            difficulty: 1

