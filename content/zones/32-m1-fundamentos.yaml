            skill: spring_api
            difficulty: 2
          - type: mcq
            prompt: "¿Qué diferencia hay entre un 400 y un 500?"
            options: ["Ninguna", "400 es error de quien llama y 500 es error del servidor", "400 es más grave"]
            answer: 1
