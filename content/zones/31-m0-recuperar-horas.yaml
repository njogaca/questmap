      - slug: m0-n6-ejercicio
        type: lab
        title: "Ejercicio — Pruebas de todo lo anterior"
        xp: 50
        estimated_min: 180
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-junit-guide, required: false }
        payload:
          proof: commit_or_hours
          goal: "Pruebas con JUnit para el total, los descuentos, las validaciones, la búsqueda y el reporte de los niveles 2 a 5."
          spec:
            context: |
              El equipo no acepta código sin pruebas: cada regla escrita en los requerimientos de los
              niveles 2 a 5 debe tener una prueba que falle si alguien la rompe. Quien revise tu
              código va a leer primero las pruebas para entender qué hace el programa.
            requirements:
              - "JUnit 5 (`junit-jupiter`) está declarado en el `pom.xml` con `<scope>test</scope>`."
              - "Hay una clase de prueba por clase probada, en `src/test/java`: `PedidoTest`, `DescuentoTest`, `RepositorioPedidosTest`, `ReportePedidosTest` y la de la calculadora del nivel 2."
              - "Cada regla de negocio (RN) de los niveles 2 a 5 tiene al menos una prueba."
              - "Cada caso límite listado en los niveles 2 a 5 tiene su prueba."
              - "`mvn test` corre todas las pruebas y termina en `BUILD SUCCESS`."
            outputs:
              - { name: "mvn test", type: "consola", desc: "`Tests run: N, Failures: 0, Errors: 0, Skipped: 0` con N de 15 o más, y `BUILD SUCCESS`." }
            rules:
              - "El nombre de cada prueba dice el comportamiento, no el método: `totalAplicaDiezPorCientoDeDescuento`, no `testTotal2`."
              - "Cada prueba comprueba una sola cosa y sigue el orden preparar, ejecutar, comprobar."
              - "Los `double` se comparan con margen: `assertEquals(85.50, pedido.total(), 0.001)`."
              - "Las excepciones se prueban con `assertThrows`, y se comprueba también el mensaje."
              - "Ninguna prueba depende de otra ni del orden: cada una crea sus propios objetos."
              - "Las pruebas no imprimen en consola ni usan `main`."
            examples:
              - title: "Casos mínimos que deben existir"
                lang: "casos"
                output: |
                  Calculadora (nivel 2)
                    subtotal 140.00  -> descuento 14.00, impuesto 23.94, total 149.94
                    subtotal 100.00  -> descuento 0.00 (umbral exacto)
                    arreglos vacíos  -> subtotal 0.00
                  Pedido y Descuento (nivel 3)
                    Teclado 40.00 x 2 + Mouse 15.00 x 1 con 10 %  -> total 85.50
                    mismo pedido con SinDescuento                  -> total 95.00
                    precio negativo                                -> IllegalArgumentException
                    correo sin arroba                              -> IllegalArgumentException
                  RepositorioPedidos (nivel 4)
                    id existente      -> Optional con el pedido
                    id inexistente    -> Optional.empty
                    id repetido       -> IllegalArgumentException y cantidad() no cambia
                    total mínimo 85.50 incluye el pedido de 85.50
                    modificar la lista devuelta no cambia el repositorio
                  Validaciones y reporte (nivel 5)
                    pedido sin líneas -> PedidoInvalidoException con el id en el mensaje
                    cantidad 0        -> PedidoInvalidoException
                    reporte de la lista vacía -> 0.0, Optional.empty, mapa vacío
                    totalPorCliente suma los dos pedidos de ana -> 100.00
            edge_cases:
              - "Cambia a propósito el umbral del descuento de 100 a 90 en el código: al menos una prueba debe fallar. Si todas siguen en verde, falta la prueba del umbral."
              - "Ejecuta una sola clase con `mvn test -Dtest=PedidoTest`: debe pasar sin las demás."
            out_of_scope:
              - "Mocks y Mockito. Aquí todo se prueba con objetos reales."
              - "Medir cobertura con JaCoCo."
              - "Probar `main` o lo que se imprime en consola."
          steps:
            - title: "Agrega JUnit"
              body: "Declara JUnit como dependencia de pruebas en `pom.xml` y crea las clases de prueba en `src/test/java`."
              commands: ["mvn test"]
            - title: "Casos normales"
              body: "Una prueba por regla: total, descuento, búsqueda por id, filtros y reporte."
            - title: "Casos límite"
              body: "Prueba el pedido vacío, la cantidad cero, el id inexistente y el precio negativo. Usa `assertThrows` para las excepciones."
          checklist:
            - "`mvn test` pasa en verde"
            - "Cada regla tiene al menos una prueba"
            - "Hay pruebas de casos límite con `assertThrows`"

