      - slug: ds-4-lab-retry-storm
        type: lab
        title: "Lab: simulador de tormenta de reintentos"
        required: true
        estimated_min: 60
        skills:
          distributed_systems: 0.8
          java: 0.2
        payload:
          goal: "Simular un servicio que se degrada durante 1 segundo y comparar cuánto tarda en recuperarse según cómo reintentan sus clientes: inmediato, backoff con jitter, y backoff con retry budget."
          steps:
            - title: Crea RetryStorm.java en $HOME\\ds-labs
              body: |
                Cada "tick" son 100 ms. El servicio atiende 100 peticiones por tick y recibe 80 nuevas por tick (80 % de su capacidad). Entre los ticks 20 y 30 su capacidad baja a 30.

                ```java
                import java.util.*;

                public class RetryStorm {
                    static final int CAPACITY = 100;      // peticiones que el servicio atiende por tick
                    static final int NEW_PER_TICK = 80;   // carga normal: 80 % de la capacidad
                    static final int TICKS = 70;
                    static final int MAX_ATTEMPTS = 4;    // 1 original + 3 reintentos

                    public static void main(String[] args) {
                        String policy = args.length > 0 ? args[0] : "immediate";
                        if (!List.of("immediate", "backoff", "budget").contains(policy))
                            throw new IllegalArgumentException("usa immediate | backoff | budget");

                        Random rnd = new Random(7);
                        // pending[t][a] = peticiones que llegan en el tick t y van por su intento a
                        int[][] pending = new int[TICKS + 100][MAX_ATTEMPTS + 1];
                        long served = 0, gaveUp = 0;
                        double budget = 0;
                        int recoveredAt = -1;

                        System.out.println("politica = " + policy);
                        for (int t = 0; t < TICKS; t++) {
                            int capacity = (t >= 20 && t < 30) ? 30 : CAPACITY;
                            pending[t][1] += NEW_PER_TICK;

                            int offered = Arrays.stream(pending[t]).sum();
                            double okRatio = offered == 0 ? 1 : Math.min(1.0, (double) capacity / offered);
                            int ok = Math.min(offered, capacity);
                            served += ok;
                            budget = Math.min(budget + ok * 0.1, 100);   // retry budget: 10 % del tráfico exitoso

                            for (int a = 1; a <= MAX_ATTEMPTS; a++) {
                                int failedHere = (int) Math.round(pending[t][a] * (1 - okRatio));
                                for (int i = 0; i < failedHere; i++) {
                                    if (policy.equals("immediate")) {
                                        // Reintenta en el siguiente tick, siempre, sin límite de intentos
                                        pending[t + 1][Math.min(a + 1, MAX_ATTEMPTS)]++;
                                        continue;
                                    }
                                    if (a == MAX_ATTEMPTS) { gaveUp++; continue; }
                                    if (policy.equals("budget")) {
                                        if (budget < 1) { gaveUp++; continue; }
                                        budget -= 1;
                                    }
                                    // Backoff exponencial con "full jitter": espera aleatoria entre 1 y 2^a ticks
                                    int delay = 1 + rnd.nextInt(1 << a);
                                    pending[t + delay][a + 1]++;
                                }
                            }

                            if (t >= 30 && recoveredAt < 0 && offered <= CAPACITY) recoveredAt = t;
                            if (t % 5 == 0 || (t >= 18 && t <= 40 && t % 2 == 0))
                                System.out.printf("t=%2d cap=%3d ofrecido=%4d ok=%3d %s%n",
                                    t, capacity, offered, ok, "#".repeat(Math.min(offered / 10, 60)));
                        }
                        System.out.printf("Atendidas=%d  abandonadas=%d  recuperado en t=%s (la falla termino en t=30)%n",
                            served, gaveUp, recoveredAt < 0 ? "NUNCA" : String.valueOf(recoveredAt));
                    }
                }
                ```
            - title: Corre las tres políticas
              commands:
                - Set-Location $HOME\ds-labs
                - java RetryStorm.java immediate
                - java RetryStorm.java backoff
                - java RetryStorm.java budget
            - title: Analiza
              body: |
                Para cada política anota: la carga máxima ofrecida (el pico de `#`), en qué tick se recuperó y cuántas peticiones se abandonaron.

                Luego experimenta:
                - Sube `NEW_PER_TICK` a 95 (el servicio trabaja al 95 %). ¿Qué pasa con `immediate`?
                - Cambia el retry budget de 0.1 a 0.5 (`ok * 0.5`). ¿Cambian mucho la recuperación y las abandonadas? ¿Por qué el pico sigue bajo?
            - title: Llévalo a Spring (opcional)
              body: Con Resilience4j, `Retry` admite `IntervalFunction.ofExponentialRandomBackoff(...)` para backoff con jitter, y se combina con `CircuitBreaker` y `TimeLimiter`. Revisa el recurso de circuit breaker de la Zona 6.
          expected: "immediate: la carga ofrecida llega a ~580 por tick (7 veces la normal) y tarda hasta t≈55 en recuperarse, 25 ticks DESPUÉS de que terminó la falla. backoff: el pico baja a ~240 y se recupera en t≈43. budget: casi no hay pico (~85–140) y se recupera en t=30, a cambio de abandonar más peticiones. Con NEW_PER_TICK=95, immediate NO se recupera en los 70 ticks (sigue con ~570 por tick al final) y backoff tarda hasta t≈69: con solo 5 % de margen, los reintentos casi no se drenan."
          checklist:
            - Corrí las tres políticas y comparé pico, recuperación y abandonadas
            - Puedo explicar por qué los reintentos inmediatos prolongan la caída
            - Probé con 95 % de carga y entendí el riesgo de operar sin margen
            - Sé qué es el trade-off del retry budget (menos amplificación, más errores visibles)
          hints:
            - "El simulador es simplificado: no modela timeouts ni clientes que abandonan por cansancio. En la vida real, la política 'immediate' puede no recuperarse nunca (falla metaestable)."
          evidence_hint: Pega la última línea de cada política y el pico de carga ofrecida que viste.
