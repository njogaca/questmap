zone: distributed-citadel
terms: [ { slug: ds-distributed-system, term: distributed system, category: fundamentals, definition_es: Varias computadoras que se comunican por red y cooperan para que el usuario las vea como un solo sistema., definition_en: Multiple computers that communicate over a network and appear to users as one system., example_en: Our order platform is a distributed system of a dozen services., analogy: "Una orquesta: muchos músicos separados que, coordinados, suenan como una sola pieza. Si uno se desafina, se nota.", see_also: [ ds-partial-failure ] }, { slug: ds-partial-failure, term: partial failure, category: fundamentals, definition_es: Cuando una parte del sistema falla mientras el resto sigue funcionando. Es lo que hace difícil a los sistemas distribuidos., definition_en: When some components fail while others keep working., example_en: "Payments was down, but orders kept accepting requests: a partial failure.", analogy: "Se funde un foco de la casa, pero los demás siguen prendidos: tienes que averiguar cuál fue.", see_also: [ ds-distributed-system, ds-gray-failure ] }, { slug: ds-fallacies, term: fallacies of distributed computing, category: fundamentals, definition_es: "Ocho suposiciones falsas que se hacen al diseñar sistemas en red: que la red es confiable, que la latencia es cero, que el ancho de banda es infinito, etc.", definition_en: Eight false assumptions developers make about networks., example_en: Assuming the network is reliable is the first fallacy of distributed computing., analogy: "Planear un viaje suponiendo que nunca hay tráfico, que el avión nunca se retrasa y que la maleta siempre llega.", see_also: [ ds-latency ] }, { slug: ds-latency, term: latency, category: performance, definition_es: El tiempo que tarda una petición en recibir respuesta (o un mensaje en llegar). Se mide en milisegundos y se analiza con percentiles., definition_en: The time it takes for a request to get a response., example_en: Cross-region calls add around 100 milliseconds of latency., analogy: "Lo que tarda en llegar una carta, sin importar cuántas hojas lleve dentro (eso sería el ancho de banda).", see_also: [ ds-tail-latency, obs-percentile ] }, { slug: ds-tail-latency, term: tail latency, category: performance, definition_es: "La latencia de las peticiones más lentas (p99, p99.9). Cuando una petición toca muchos servicios, la cola de cada uno se suma y afecta a casi todos.", definition_en: "The latency of the slowest requests, like the p99.", example_en: Fan-out to twenty shards made our tail latency much worse., analogy: "En una fila de supermercado, no importa que casi todos paguen rápido: si te toca el cliente que paga con monedas, esperas mucho.", see_also: [ ds-latency, obs-percentile ] }, { slug: ds-timeout, term: timeout, category: fundamentals, definition_es: "Tiempo máximo que un cliente espera una respuesta antes de rendirse. Es la única forma de detectar fallos, y siempre es una suposición.", definition_en: The maximum time to wait for a response before giving up., example_en: We set a two-second timeout based on the p99 plus a margin., analogy: "Esperar a un amigo 15 minutos en el café: si no llega, te vas, pero no sabes si se enfermó o está en el tráfico.", see_also: [ ds-partial-failure, eda-retry-backoff ] }, { slug: ds-network-partition, term: network partition, category: failures, definition_es: Falla de red que divide un cluster en grupos de nodos que siguen vivos pero no pueden comunicarse entre sí., definition_en: A network failure that splits nodes into groups that can't talk to each other., example_en: "During the network partition, both data centers kept accepting writes.", analogy: "Un puente que se cae y deja un pueblo dividido en dos orillas: ambas siguen funcionando, pero no se enteran de lo que pasa en la otra.", see_also: [ cass-cap, ds-split-brain ] }, { slug: ds-gray-failure, term: gray failure, category: failures, definition_es: "Fallo parcial y sutil: el componente sigue respondiendo (y pasa health checks) pero está lento o falla a veces. Difícil de detectar.", definition_en: A subtle failure where a component looks healthy but performs badly., example_en: A gray failure in one node slowed the whole cluster., analogy: "Un empleado que llega a trabajar todos los días pero hace todo a medias: nadie lo nota hasta que se acumula el trabajo.", see_also: [ ds-partial-failure, ds-tail-latency ] }, { slug: ds-pacelc, term: PACELC, category: consistency, definition_es: "Extensión de CAP: si hay Partición, eliges Availability o Consistency; En otro caso (Else), eliges Latency o Consistency.", definition_en: "If partitioned, choose availability or consistency; else, choose latency or consistency.", example_en: "Under PACELC, Cassandra is PA/EL by default.", analogy: En una tormenta (partición) decides si el avión sale o espera; con buen clima igual decides si haces todos los chequeos lentos o sales rápido., see_also: [ cass-cap, ds-linearizability ] }, { slug: ds-linearizability, term: linearizability (strong consistency), category: consistency, definition_es: "El sistema se comporta como si hubiera una sola copia de los datos: en cuanto una escritura termina, todas las lecturas posteriores la ven.", definition_en: The system behaves as if there were a single copy of the data., example_en: Inventory reservations need linearizability to avoid overselling., analogy: "Un único pizarrón en el centro de la oficina: todos leen y escriben en el mismo y nadie ve una versión vieja.", see_also: [ ds-pacelc, ds-causal-consistency ] }, { slug: ds-causal-consistency, term: causal consistency, category: consistency, definition_es: "Si un evento causó otro, todos los ven en ese orden. Los eventos sin relación pueden verse en órdenes distintos.", definition_en: Causally related operations are seen by everyone in the same order., example_en: "With causal consistency, nobody sees a reply before the original comment.", analogy: "En un chat nadie debería ver la respuesta '¡sí, claro!' antes de la pregunta que la provocó.", see_also: [ ds-linearizability, ds-lamport-clock ] }, { slug: ds-read-your-writes, term: read-your-writes, category: consistency, definition_es: "Garantía de sesión: un usuario siempre ve sus propias escrituras, aunque otros usuarios puedan ver datos un poco viejos.", definition_en: A user always sees their own updates., example_en: We route reads to the leader for a few seconds after a write to guarantee read-your-writes., analogy: "Después de mandar un mensaje, al menos tú lo ves en tu pantalla, aunque a tu amigo todavía no le llegue.", see_also: [ ds-monotonic-reads, ds-replication-lag ] }, { slug: ds-monotonic-reads, term: monotonic reads, category: consistency, definition_es: "Garantía de sesión: si viste un valor, nunca verás después uno más viejo (no 'retrocedes en el tiempo').", definition_en: "Once you've seen a value, you never see an older one.", example_en: Pinning a user to one replica gives monotonic reads., analogy: "Leer un libro sin que nadie te arranque páginas: nunca vuelves a un capítulo anterior sin querer.", see_also: [ ds-read-your-writes ] }, { slug: ds-quorum-overlap, term: quorum overlap (R + W > N), category: consistency, definition_es: "Con N réplicas, si cada escritura confirma en W y cada lectura consulta R, y R + W > N, toda lectura toca al menos una réplica actualizada.", definition_en: "If R + W > N, read and write sets always overlap in at least one replica.", example_en: "With RF three, QUORUM reads and writes give R plus W greater than N.", analogy: "Si 2 de 3 amigos saben el plan y preguntas a 2, al menos uno de los que preguntes lo sabe.", see_also: [ cass-quorum, cass-consistency-level ] }, { slug: ds-leader-follower, term: leader-follower replication, category: replication, definition_es: Esquema donde un nodo (líder) recibe todas las escrituras y los seguidores copian su log de cambios. Los seguidores pueden atender lecturas., definition_en: One node accepts writes and followers replicate its log., example_en: PostgreSQL uses leader-follower replication with streaming WAL., analogy: "Un profesor escribe en el pizarrón y los alumnos copian en sus cuadernos, cada uno a su ritmo.", see_also: [ ds-replication-lag, ds-failover ] }, { slug: ds-sync-replication, term: synchronous vs asynchronous replication, category: replication, definition_es: "Síncrona: el líder espera la confirmación de la réplica antes de responder (no pierde datos, pero puede bloquearse). Asíncrona: responde enseguida (rápida, pero puede perder las últimas escrituras).", definition_en: Synchronous waits for replicas to confirm; asynchronous doesn't., example_en: We use synchronous replication within the region and asynchronous across regions., analogy: "Síncrona: no te vas de la tienda hasta que el cajero te da el recibo. Asíncrona: pagas y te vas; el recibo llega por correo después.", see_also: [ ds-leader-follower, ds-pacelc ] }, { slug: ds-replication-lag, term: replication lag, category: replication, definition_es: El retraso entre que el líder aplica un cambio y que una réplica lo refleja. Causa lecturas viejas., definition_en: The delay before a replica reflects a change made on the leader., example_en: Replication lag spiked to five seconds during the batch import., analogy: "El eco en una montaña: tu voz llega, pero un momento después.", see_also: [ ds-read-your-writes, ds-sync-replication ] }, { slug: ds-failover, term: failover, category: replication, definition_es: Cuando el líder cae y otro nodo pasa a ser el nuevo líder. Debe evitar que haya dos líderes a la vez., definition_en: Promoting a new leader when the current one fails., example_en: Failover took thirty seconds and some writes were lost., analogy: Cuando el capitán del equipo se lesiona y el subcapitán toma la banda., see_also: [ ds-split-brain, ds-leader-election ] }, { slug: ds-sharding, term: partitioning / sharding, category: partitioning, definition_es: Dividir los datos en partes (shards) para que cada nodo guarde y atienda solo una parte. Permite escalar más allá de una máquina., definition_en: Splitting data so each node stores only a subset., example_en: We shard orders by customer ID., analogy: "Una biblioteca con varios edificios: A–F en uno, G–M en otro. Ningún edificio tiene todos los libros.", see_also: [ ds-consistent-hashing, cass-partition-key, cass-hot-partition ] }, { slug: ds-consistent-hashing, term: consistent hashing, category: partitioning, definition_es: "Técnica que ubica nodos y claves en un anillo; cada clave pertenece al siguiente nodo. Al agregar o quitar un nodo, solo se mueve una pequeña parte de los datos.", definition_en: Placing nodes and keys on a ring so that adding a node moves only a few keys., example_en: Consistent hashing with virtual nodes keeps the load balanced., analogy: "Una mesa redonda donde cada invitado atiende los platos que quedan a su derecha; si llega uno nuevo, solo le pasan los platos de su vecino.", see_also: [ ds-sharding, cass-ring, cass-token ] }, { slug: ds-clock-skew, term: clock skew, category: time, definition_es: "La diferencia entre los relojes de dos máquinas. NTP la reduce, pero nunca la elimina.", definition_en: The difference between clocks on different machines., example_en: Clock skew between nodes caused events to appear out of order., analogy: Dos relojes de pared en la misma casa que nunca marcan exactamente la misma hora., see_also: [ ds-last-write-wins, ds-lamport-clock ] }, { slug: ds-last-write-wins, term: last-write-wins (LWW), category: time, definition_es: "Estrategia de resolución de conflictos donde gana la escritura con el timestamp más alto. Simple, pero puede perder escrituras por la desviación de relojes.", definition_en: Conflict resolution where the latest timestamp wins., example_en: Cassandra uses last-write-wins per cell., analogy: "Dos personas editan la misma lista de compras en papel y se queda la que tenga la hora más tardía anotada, aunque su reloj estuviera adelantado.", see_also: [ ds-clock-skew, ds-vector-clock ] }, { slug: ds-lamport-clock, term: Lamport clock, category: time, definition_es: "Reloj lógico: un contador por nodo que se incrementa en cada evento y se sincroniza al recibir mensajes (max + 1). Si A causó B, A tiene número menor.", definition_en: A logical counter that orders events consistently with causality., example_en: We attach a Lamport timestamp to every message., analogy: "Numerar las cartas de una conversación: si respondes a la carta 7, la tuya será la 8 o más, aunque no sepas qué hora es.", see_also: [ ds-vector-clock, ds-causal-consistency ] }, { slug: ds-vector-clock, term: vector clock, category: time, definition_es: Reloj lógico con un contador por nodo. Permite saber si un evento causó otro o si fueron concurrentes (un conflicto real)., definition_en: "A set of counters, one per node, that detects concurrent updates.", example_en: Vector clocks showed the two cart updates were concurrent., analogy: "Un registro donde cada miembro de la familia anota cuántas veces modificó la lista: comparando registros sabes si alguien editó sin ver los cambios del otro.", see_also: [ ds-lamport-clock, ds-last-write-wins ] }, { slug: ds-consensus, term: consensus, category: coordination, definition_es: Que varios nodos acuerden un mismo valor (o el orden de un log) aunque algunos fallen. Se logra con mayorías., definition_en: Getting multiple nodes to agree on a value despite failures., example_en: etcd uses consensus to store Kubernetes cluster state., analogy: "Un jurado que necesita mayoría para dar el veredicto: si faltan algunos, igual decide; si falta más de la mitad, no.", see_also: [ ds-raft, ds-leader-election ] }, { slug: ds-raft, term: Raft, category: coordination, definition_es: "Algoritmo de consenso diseñado para ser fácil de entender: elige un líder por mayoría y replica un log; una entrada se confirma cuando la tiene la mayoría.", definition_en: A consensus algorithm based on leader election and log replication., example_en: Kafka's KRaft mode uses a Raft-based controller quorum., analogy: Un club que elige presidente por votación; el presidente anota las decisiones y vale lo que la mayoría ya copió en su libreta., see_also: [ ds-consensus, ds-leader-election ] }, { slug: ds-leader-election, term: leader election, category: coordination, definition_es: Proceso para elegir qué nodo coordina (el líder). Debe garantizar que no haya dos líderes a la vez., definition_en: Choosing one node to act as coordinator., example_en: Leader election finished in under a second after the node failed., analogy: "Cuando el profesor falta, el grupo vota quién toma la lista; si votan dos salones por separado, tendrías dos 'profesores'.", see_also: [ ds-split-brain, ds-failover ] }, { slug: ds-split-brain, term: split-brain, category: coordination, definition_es: "Situación en que dos nodos creen ser el líder y aceptan escrituras distintas a la vez, normalmente por una partición. Corrompe datos.", definition_en: Two nodes both act as leader and accept conflicting writes., example_en: Quorum-based election prevents split-brain., analogy: "Dos gerentes que, sin saber del otro, venden el mismo departamento a dos compradores distintos.", see_also: [ ds-network-partition, ds-leader-election ] }, { slug: ds-two-phase-commit, term: two-phase commit (2PC), category: transactions, definition_es: "Protocolo de transacción distribuida: un coordinador pide a todos 'preparar' y luego 'confirmar'. Atómico, pero se bloquea si el coordinador cae.", definition_en: A protocol where a coordinator asks participants to prepare and then commit., example_en: We avoided two-phase commit and used a saga instead., analogy: "Una boda: el juez pregunta '¿aceptas?' a los dos (preparar) y solo después los declara casados (confirmar). Si el juez se desmaya entre medio, nadie sabe si están casados.", see_also: [ gcp-saga ] }, { slug: ds-saga-orchestration, term: saga orchestration vs choreography, category: transactions, definition_es: "Orquestación: un coordinador central dice a cada servicio qué paso ejecutar. Coreografía: cada servicio reacciona a los eventos del anterior, sin coordinador.", definition_en: Orchestration uses a central coordinator; choreography uses events between services., example_en: We moved from choreography to orchestration because the flow was hard to trace., analogy: "Orquestación: un director de orquesta marca cada entrada. Coreografía: bailarines que se guían por los movimientos del compañero.", see_also: [ gcp-saga, gcp-compensating-action ] }, { slug: ds-load-shedding, term: load shedding, category: resilience, definition_es: "Rechazar a propósito parte de las peticiones (503/429) cuando el servicio está saturado, para poder atender bien al resto.", definition_en: Deliberately rejecting some requests to protect the service under overload., example_en: Load shedding kept checkout alive during the traffic spike., analogy: "Un restaurante lleno que dice 'no hay mesa' en la puerta, en lugar de sentar a todos y servir mal a todos.", see_also: [ eda-backpressure, ds-cascading-failure ] }, { slug: ds-cascading-failure, term: cascading failure, category: resilience, definition_es: "Falla que se propaga: un componente lento o caído sobrecarga a los demás, que a su vez fallan.", definition_en: A failure that spreads as overloaded components fail one after another., example_en: A slow database caused a cascading failure across three services., analogy: "Fichas de dominó: la primera cae y empuja a todas las siguientes.", see_also: [ ds-retry-storm, gcp-circuit-breaker ] }, { slug: ds-retry-storm, term: retry storm, category: resilience, definition_es: "Cuando muchos clientes reintentan a la vez contra un servicio con problemas, multiplicando su carga e impidiendo que se recupere.", definition_en: A flood of retries that overwhelms a struggling service., example_en: The outage lasted longer because of a retry storm., analogy: "Se cae la página de venta de boletos y todos presionan F5 sin parar: así nunca se levanta.", see_also: [ ds-jitter, ds-retry-budget, eda-retry-backoff ] }, { slug: ds-jitter, term: jitter, category: resilience, definition_es: Aleatoriedad que se agrega a los tiempos de espera entre reintentos para que los clientes no vuelvan todos al mismo tiempo., definition_en: Randomness added to retry delays so clients don't retry in sync., example_en: Exponential backoff with full jitter spread the retries out., analogy: "Si todos salen de la oficina a las 5:00 en punto hay embotellamiento; si cada uno sale en algún momento entre 5:00 y 5:30, el tráfico fluye.", see_also: [ ds-retry-storm, eda-retry-backoff ] }, { slug: ds-retry-budget, term: retry budget, category: resilience, definition_es: Límite a los reintentos como porcentaje del tráfico exitoso (ej. 10 %). Evita que los reintentos multipliquen la carga durante una falla., definition_en: A cap on retries as a percentage of successful traffic., example_en: Our client library enforces a ten percent retry budget., analogy: "Una tarjeta de crédito con límite: puedes 'pedir prestado' reintentos, pero solo hasta cierto monto.", see_also: [ ds-retry-storm, ds-jitter ] }, { slug: ds-back-of-envelope, term: back-of-the-envelope estimate, category: design, definition_es: "Cálculo rápido y aproximado (peticiones por segundo, almacenamiento, ancho de banda) para dimensionar un diseño. Importa el orden de magnitud, no la exactitud.", definition_en: "A quick, rough calculation to size a system.", example_en: A back-of-the-envelope estimate gave us about five hundred requests per second., analogy: "Calcular en la servilleta cuántas pizzas pedir para una fiesta: no necesitas el número exacto, solo no quedarte corto.", see_also: [ ds-functional-requirements ] }, { slug: ds-functional-requirements, term: functional vs non-functional requirements, category: design, definition_es: "Funcionales: qué hace el sistema (reservar un producto). No funcionales: cómo de bien lo hace (latencia, disponibilidad, consistencia, escala, seguridad).", definition_en: What the system does versus how well it does it., example_en: Our key non-functional requirement is a p99 under two hundred milliseconds., analogy: "Funcional: el auto te lleva del punto A al B. No funcional: qué tan rápido, seguro y cómodo.", see_also: [ ds-back-of-envelope, obs-slo ] }, { slug: ds-hot-key, term: hot key, category: design, definition_es: "Una clave que recibe muchísimo más tráfico que las demás (un producto en oferta) y satura su partición. Se mitiga con caché, réplicas de lectura o dividiendo la clave.", definition_en: A single key receiving a disproportionate share of traffic., example_en: The doorbuster deal became a hot key on Black Friday., analogy: "Una sola caja abierta en el supermercado mientras las demás están vacías: todos hacen fila en el mismo lugar.", see_also: [ cass-hot-partition, ds-sharding ] }, { slug: ds-fencing-token, term: fencing token, category: coordination, definition_es: "Número que aumenta cada vez que se otorga un lock o un liderazgo. El recurso rechaza escrituras con un token más viejo que el último visto, frenando a 'líderes zombis'.", definition_en: An increasing number that lets storage reject writes from stale lock holders., example_en: The storage layer checks the fencing token on every write., analogy: "Cambiar la cerradura cuando se va un inquilino: la llave vieja ya no abre, aunque el inquilino vuelva.", see_also: [ ds-split-brain, ds-leader-election ] }, { slug: ds-read-replica-cache, term: read path vs write path, category: design, definition_es: "Separar el camino de lectura (rápido, escalable, puede usar caché o réplicas con datos un poco viejos) del camino de escritura (va a la fuente de verdad con consistencia fuerte).", definition_en: "Designing reads and writes separately, with different consistency needs.", example_en: Reads are served from cache; the write path goes to the source of truth., analogy: El menú en la puerta del restaurante puede estar algo desactualizado; el pedido que haces al mesero tiene que ser exacto., see_also: [ ds-replication-lag, ds-pacelc ] } ]
