      - slug: java-2-lab-streams
        type: lab
        title: "Lab: estadísticas de órdenes con records y streams"
        required: true
        estimated_min: 45
        skills: { java: 0.9, git: 0.1 }
        payload:
          goal: "Procesar una lista de órdenes con records y streams, sin bucles `for`."
          steps:
            - title: Crea OrderStats.java en tu carpeta de labs
              body: |
                ```java
                import java.util.*;
                import java.util.stream.*;

                public class OrderStats {
                    record Order(String id, String customer, String status, double total) {}

                    public static void main(String[] args) {
                        List<Order> orders = List.of(
                            new Order("o1", "ana", "PAID", 120.0),
                            new Order("o2", "luis", "PENDING", 35.5),
                            new Order("o3", "ana", "PAID", 80.0),
                            new Order("o4", "marta", "CANCELLED", 200.0),
                            new Order("o5", "luis", "PAID", 15.0));

                        // 1) Total pagado
                        double paid = orders.stream()
                            .filter(o -> o.status().equals("PAID"))
                            .mapToDouble(Order::total)
                            .sum();
                        System.out.println("Total PAID: " + paid);

                        // 2) TODO: cantidad de órdenes por status  -> Map<String, Long>
                        // 3) TODO: clientes únicos ordenados alfabéticamente -> List<String>
                        // 4) TODO: la orden más cara que NO esté cancelada -> Optional<Order>
                    }
                }
                ```
            - title: Completa los TODO
              body: "Usa `Collectors.groupingBy(Order::status, Collectors.counting())`, `.map(...).distinct().sorted().toList()` y `.max(Comparator.comparingDouble(Order::total))`."
            - title: Ejecuta y haz commit
              commands:
                - "java OrderStats.java"
                - "git add OrderStats.java; git commit -m \"java-forest: streams lab\""
          expected: "Total PAID: 215.0\nUn mapa con PAID=3, PENDING=1, CANCELLED=1 (el orden puede variar)\n[ana, luis, marta]\nLa orden o1 (120.0) como la más cara no cancelada"
          checklist:
            - "Los 4 resultados salen correctos"
            - "No usé ningún bucle `for` ni `while`"
            - "Usé un `Optional` y lo imprimí con `ifPresent` u `orElse`"
            - "Hice commit"
          hints:
            - "Para el punto 2: `Map<String, Long> byStatus = orders.stream().collect(Collectors.groupingBy(Order::status, Collectors.counting()));`"
            - "Para el punto 4: filtra primero `!o.status().equals(\"CANCELLED\")` y luego `.max(...)`."
          evidence_hint: "Pega la salida completa de `java OrderStats.java`."

      - slug: java-2-quiz
        type: quiz
        title: Quiz — Colecciones y streams
        required: true
        estimated_min: 15
        skills: { java: 1.0 }
        questions:
          - slug: j2-q1
            type: mcq
            prompt: "Necesitas guardar correos de clientes SIN duplicados. ¿Qué colección usas?"
            options: ["ArrayList", "HashSet", "LinkedList", "Array"]
            answer: 1
            explanation: "Un `Set` no admite elementos repetidos. `HashSet` es la implementación más común (no garantiza orden)."
            skill: java
            difficulty: 1
          - slug: j2-q2
            type: mcq
            prompt: "¿Qué devuelve `Map.get(key)` si la clave no existe?"
            options: ["Lanza una excepción", "null", "Un Optional vacío", "0"]
            answer: 1
            explanation: "`get` devuelve `null`. Si quieres un valor por defecto usa `getOrDefault(key, valor)`."
            skill: java
            difficulty: 1
          - slug: j2-q3
            type: tf
            prompt: "Una operación intermedia de un stream (como `filter` o `map`) no se ejecuta hasta que se llama una operación terminal (como `toList` o `count`)."
            answer: true
            explanation: "Los streams son perezosos (lazy): las operaciones intermedias solo describen el trabajo; la terminal lo dispara."
            skill: java
            difficulty: 2
          - slug: j2-q4
            type: mcq
            prompt: "¿Qué es un `record` en Java (16+)?"
            options: ["Un tipo de colección", "Una clase inmutable concisa para transportar datos", "Un log de eventos", "Una interfaz funcional"]
            answer: 1
            explanation: "`record Order(String id, double total)` genera constructor, getters (`id()`), `equals`, `hashCode` y `toString`. Sus campos son `final`."
            skill: java
            difficulty: 1
          - slug: j2-q5
            type: mcq
            prompt: "¿Cuál es el uso correcto de `Optional`?"
            options:
              - "Como tipo de campo en todas las entidades"
              - "Como tipo de retorno cuando un resultado puede no existir"
              - "Para reemplazar todas las excepciones"
              - "Como parámetro de todos los métodos"
            answer: 1
            explanation: "`Optional` comunica 'puede que no haya valor' en el retorno de un método (ej. `findById`). Usarlo en campos o parámetros suele considerarse mala práctica."
            skill: java
            difficulty: 2
          - slug: j2-q6
            type: fill
            prompt: "Completa: `List<String> names = customers.stream().map(Customer::name).______();` (para obtener una lista, Java 16+)"
            answer: ["toList"]
            explanation: "`toList()` es la operación terminal más corta para obtener una lista inmutable. Antes se usaba `collect(Collectors.toList())`."
            skill: java
            difficulty: 1
          - slug: j2-q7
            type: mcq
            prompt: "¿Qué ventaja da usar generics (`List<Order>` en vez de `List`)?"
            options: ["El programa corre más rápido", "El compilador detecta errores de tipo y evitas casts", "Usa menos memoria", "Permite herencia múltiple"]
            answer: 1
            explanation: "Con generics el compilador sabe que la lista solo contiene `Order`: detecta errores antes de ejecutar y no necesitas `(Order) list.get(0)`."
            skill: java
            difficulty: 1
          - slug: j2-q8
            type: order
            prompt: "Ordena las operaciones para obtener los nombres únicos, en mayúsculas y ordenados, de clientes con órdenes > 100:"
            options: ["filter(o -> o.total() > 100)", "map(o -> o.customer().toUpperCase())", "distinct()", "sorted()", "toList()"]
            answer: [0, 1, 2, 3, 4]
            explanation: "Primero filtras (reduce el trabajo), luego transformas, quitas duplicados, ordenas y al final la operación terminal."
            skill: java
            difficulty: 2
            hint: "La operación terminal siempre va al final."

  # ================================================================ NIVEL 3
  - slug: java-3-journeyman
    number: 3
    title: Journeyman — Excepciones, concurrencia y pruebas
    story: "Algunas ramas se rompen y otras crecen en paralelo. Aprende a manejar fallos, a trabajar en varios hilos y a probar que todo sigue en pie."
