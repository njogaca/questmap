    story: "Entras al bosque. Los árboles son clases y los frutos, objetos. Primero aprende sus nombres y prepara tu equipo."
    quests:
      - slug: java-1-learn-basics
        type: learn
        title: Sintaxis básica de Java
        required: true
        estimated_min: 60
        skills: { java: 1.0 }
        resources:
          - { ref: res-java-mooc-part1 }
        payload:
          note_prompt: "Con tus palabras: ¿qué diferencias ves entre Java y los lenguajes que ya usas (ESQL, scripts, etc.)? Menciona tipos de datos y cómo se declara una variable."

      - slug: java-1-learn-oop
        type: learn
        title: Clases, objetos, herencia e interfaces
        required: true
        estimated_min: 60
