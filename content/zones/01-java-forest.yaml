slug: java-forest
title: Java Forest
order: 1
emoji: "🌲"
unlocked_from_start: true
map: { x: 170, y: 320 }
prerequisites: []
skills: [java, git, testing]
story: >
  Sector 01. Un bosque de datos donde cada árbol es una clase y cada hoja un objeto.
  Para infiltrarte en el reino necesitas hablar su lenguaje: Java. Al final del bosque
  te espera un guardián que solo deja pasar a quien construye un servicio REST con pruebas.

levels:
  # ================================================================ NIVEL 1
  - slug: java-1-novice
    number: 1
