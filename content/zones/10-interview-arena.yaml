  - slug: arena-4-expert
    number: 4
    title: Expert — System design y mini take-home
    story: El tercer rival te da una pizarra y un reloj de arena. No gana quien dibuja más cajas, sino quien pregunta, decide y explica por qué.
    quests:
      - slug: arena-4-learn-design
        type: learn
        title: Cómo abordar una entrevista de system design
        required: true
        estimated_min: 45
        skills:
          english: 0.6
          distributed_systems: 0.4
        resources:
          - ref: res-system-design-primer
        payload:
          note_prompt: Escribe en inglés las 5 preguntas de aclaración que harías para 'Design the order events pipeline for a large retailer' y la respuesta que supondrías para cada una.
          summary_md: |
            Ya viste el guion completo en la Distributed Systems Citadel. Aquí lo practicas **hablando**, con el reloj corriendo.

            Cómo se ve una entrevista de 45 minutos:
            - **0–5 min:** preguntas de aclaración. Escribe los requisitos en la pizarra (o en el editor compartido).
            - **5–8 min:** estimaciones en voz alta. "3,000 orders per second at peak, about 1 KB each, so roughly 3 MB per second…"
            - **8–20 min:** diseño de alto nivel. Narra mientras dibujas: "The client calls the orders service, which writes to PostgreSQL and the outbox…"
            - **20–38 min:** profundiza donde el entrevistador te lleve (o propón tú lo más difícil).
            - **38–45 min:** fallos, monitoreo, trade-offs, y qué harías con más tiempo.

            Señales que suman:
            - Preguntas antes de dibujar.
            - Números, aunque sean aproximados.
            - Decir "the trade-off is…" en cada decisión importante.
            - Hablar de qué pasa cuando algo falla.
            - Escuchar las pistas del entrevistador y ajustar.

            Señales que restan: lanzar nombres de tecnologías sin razones ("Kafka, Kubernetes, microservices…"), quedarte callado mucho tiempo, o defender una decisión cuando el entrevistador te muestra un problema real.
      - slug: arena-4-learn-takehome
        type: learn
        title: "Take-home bajo tiempo: cómo entregar algo bueno en 90 minutos"
        required: true
        estimated_min: 30
        skills:
          english: 0.5
          java: 0.3
          testing: 0.2
        payload:
          note_prompt: "Haz tu checklist personal para un take-home de 90 minutos: qué haces en los primeros 10 minutos, qué dejas fuera a propósito y qué va siempre en el README."
          summary_md: |
            Un take-home (o una tarea de código en vivo) evalúa cómo trabajas, no solo si funciona.

            Plan para 90 minutos:
            - **0–10:** lee todo, escribe las dudas y supuestos, decide el alcance mínimo. Si puedes preguntar, pregunta.
            - **10–60:** el camino feliz funcionando con pruebas. Commits pequeños con buenos mensajes.
            - **60–80:** errores y casos borde (validación, 404, idempotencia), y una prueba para cada uno.
            - **80–90:** README: cómo correrlo, decisiones, supuestos, qué harías para producción.

            Reglas:
            - **Mejor pequeño y sólido que grande y roto.** Lo que no hagas, escríbelo en "What I'd do next".
            - Pruebas que demuestren el comportamiento importante, no 100 % de cobertura.
            - Nada de secretos en el repo; configuración por variables de entorno.
            - Si usas IA, sigue tu proceso de verificación del nivel 3 y menciónalo con honestidad si te preguntan.

            En la entrevista de seguimiento te pedirán cambiar algo en vivo ("add pagination", "what if two requests arrive at the same time?"): por eso tienes que entender cada línea.
