      - slug: java-1-lab-setup
        type: lab
        title: "Lab: instala el JDK y ejecuta tu primera clase"
        required: true
        estimated_min: 30
        skills: { java: 0.8, git: 0.2 }
        payload:
          goal: "Tener Java 21 funcionando en tu PC y ejecutar un programa con una clase, una interfaz y herencia."
          steps:
            - title: Instala el JDK 21 (Temurin)
              body: "Abre PowerShell. Si `winget` no encuentra el paquete, descárgalo desde adoptium.net. Cierra y abre PowerShell después de instalar."
              commands:
                - "winget install --id EclipseAdoptium.Temurin.21.JDK -e"
                - "java -version"
            - title: Crea una carpeta de práctica con Git
              commands:
                - "mkdir $HOME\\questmap-labs\\java-forest; cd $HOME\\questmap-labs\\java-forest; git init"
            - title: Escribe Zoo.java
              body: |
                Crea el archivo `Zoo.java` con este contenido (puedes usar VS Code: `code Zoo.java`):

                ```java
                import java.util.List;

                interface Speaker { String speak(); }

                abstract class Animal implements Speaker {
                    protected final String name;
                    Animal(String name) { this.name = name; }
                }

                class Dog extends Animal {
                    Dog(String name) { super(name); }
                    public String speak() { return name + " says woof"; }
                }

                class Cat extends Animal {
                    Cat(String name) { super(name); }
                    public String speak() { return name + " says meow"; }
                }

                public class Zoo {
                    public static void main(String[] args) {
                        List<Speaker> animals = List.of(new Dog("Rex"), new Cat("Mia"));
                        for (Speaker s : animals) System.out.println(s.speak());
                    }
                }
                ```
            - title: Ejecútalo sin compilar a mano
              body: "Desde Java 11 puedes ejecutar un archivo .java directamente."
              commands:
                - "java Zoo.java"
            - title: Haz commit
              commands:
                - "git add Zoo.java; git commit -m \"java-forest: primer programa OOP\""
          expected: "Rex says woof\nMia says meow"
          checklist:
            - "`java -version` muestra la versión 21"
            - "`java Zoo.java` imprime las dos líneas esperadas"
            - "Agregué un tercer animal (por ejemplo `Cow`) y funcionó sin tocar el bucle (eso es polimorfismo)"
            - "Hice commit en mi carpeta de labs"
          hints:
            - "Si `java` no se reconoce, cierra y vuelve a abrir PowerShell para que tome el nuevo PATH."
            - "Para el tercer animal, copia la clase `Cat`, cambia el nombre y el sonido, y agrégalo a `List.of(...)`."
          evidence_hint: "Pega la salida de `java -version` y de `java Zoo.java` (con tu tercer animal)."

      - slug: java-1-quiz
        type: quiz
        title: Quiz — Java y OOP básico
        required: true
        estimated_min: 15
        skills: { java: 1.0 }
        questions:
          - slug: j1-q1
            type: mcq
            prompt: "¿Qué es un objeto en Java?"
            options: ["Una instancia concreta de una clase", "Un archivo .java", "Un tipo primitivo como int", "Un paquete de clases"]
            answer: 0
            explanation: "La clase es el molde; el objeto es una instancia creada con `new` a partir de ese molde, con sus propios valores."
            skill: java
            difficulty: 1
            hint: "Piensa en molde vs. pieza."
          - slug: j1-q2
            type: tf
            prompt: "En Java una clase puede implementar varias interfaces."
            answer: true
            explanation: "Java no permite heredar de varias clases (`extends` solo una), pero sí implementar varias interfaces con `implements A, B`."
            skill: java
            difficulty: 1
            hint: "La restricción es con `extends`, no con `implements`."
          - slug: j1-q3
            type: mcq
            prompt: "¿Cuál de estos es un tipo primitivo en Java?"
            options: ["String", "Integer", "int", "List"]
            answer: 2
            explanation: "`int` es primitivo (guarda el valor directamente). `Integer` es su clase envoltorio (wrapper) y `String`/`List` son tipos referencia."
            skill: java
            difficulty: 1
            hint: "Los primitivos empiezan con minúscula."
          - slug: j1-q4
            type: mcq
            prompt: "¿Qué hace la palabra clave `private` en un campo?"
            options: ["Lo hace constante", "Solo se puede acceder desde dentro de la misma clase", "Lo comparte entre todas las instancias", "Lo hace visible para el mismo paquete"]
            answer: 1
            explanation: "`private` es la base de la encapsulación: nadie fuera de la clase puede leer ni cambiar ese campo directamente. Constante es `final`; compartido es `static`."
            skill: java
            difficulty: 1
            hint: "Encapsulación."
          - slug: j1-q5
            type: fill
            prompt: "Para que la clase `Dog` herede de `Animal` escribes: `class Dog ______ Animal`."
            answer: ["extends"]
            explanation: "`extends` se usa para heredar de una clase; `implements` para implementar interfaces."
            skill: java
            difficulty: 1
          - slug: j1-q6
            type: mcq
            prompt: "Tienes `List<Speaker> animals` con un Dog y un Cat. Llamas `s.speak()` para cada uno y cada objeto responde distinto. ¿Cómo se llama esto?"
            options: ["Encapsulación", "Sobrecarga (overloading)", "Polimorfismo", "Composición"]
            answer: 2
            explanation: "Polimorfismo: el mismo mensaje (`speak()`) produce comportamientos diferentes según el tipo real del objeto. La sobrecarga es tener varios métodos con el mismo nombre y distintos parámetros."
            skill: java
            difficulty: 2
          - slug: j1-q7
            type: tf
            prompt: "Una clase abstracta se puede instanciar directamente con `new`."
            answer: false
            explanation: "No: una clase abstracta existe para ser heredada. Puedes crear objetos de sus subclases concretas, pero no de ella."
            skill: java
            difficulty: 2
          - slug: j1-q8
            type: order
            prompt: "Ordena lo que pasa cuando ejecutas `new Dog(\"Rex\")` donde `Dog extends Animal`:"
            options:
              - "Se reserva memoria para el objeto"
              - "Se ejecuta el constructor de Animal (vía super)"
              - "Se ejecuta el resto del constructor de Dog"
              - "Se devuelve la referencia al nuevo objeto"
            answer: [0, 1, 2, 3]
            explanation: "Java reserva memoria, luego el constructor de la subclase llama primero a `super(...)` (constructor del padre), después termina el suyo y finalmente `new` devuelve la referencia."
            skill: java
            difficulty: 2
            hint: "El padre se construye antes que el hijo."

      - slug: java-1-micro-flashcards
        type: micro
        title: Repaso rápido de flashcards de OOP
        required: false
        estimated_min: 10
        skills: { java: 1.0 }
        payload:
          kind: flashcards
          terms: [java-class, java-object, java-interface, java-inheritance, java-polymorphism]

