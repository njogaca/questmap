# Rutas de estudio. Cada una es un mundo propio: sus zonas, sus skills, su XP y su readiness.
#
# Una zona o una skill con `track: null` es TRANSVERSAL y aparece en todas las rutas
# (inglés, entrevistas, Linux). Si el YAML de una zona no trae `track`, el seed no toca
# la ruta que ya tenga asignada en la base.
#
# `ui` es la interfaz por defecto de la ruta y se aplica al activarla. Cada interfaz trae
# su propia paleta, así que no se eligen por separado: `hud` dibuja el mapa como hexágonos,
# `terminal` como un escaneo nmap, `retro` como un POST de BIOS y `animus` como memorias.
# Es un valor por defecto, no una imposición: puedes cambiarlo en Ajustes → Efectos.

tracks:
  - slug: backend-gcp
    title: Backend & GCP
    emoji: "🗺️"
    ui: hud
    order: 1
    description: >
      La ruta original: Java, event-driven, Cassandra, BigQuery y nube hasta estar
      listo para aplicar a backend.

  - slug: cybersecurity
    title: Cyber Range
    emoji: "🛡️"
    ui: terminal
    order: 2
    description: >
      De cero a analista de seguridad: redes y sistemas, un SOC donde triar alertas de
      verdad, detección con ATT&CK, ofensiva con OWASP y respuesta a incidentes.

  # Ruta de esfuerzo: aquí los puntos salen SOLO de horas anotadas y de commits
  # (ver EFFORT_TRACK_SLUG en src/lib/rules.ts). Sus zonas son los 5 mundos del plan.
  - slug: plan-2027
    title: Plan 2027
    emoji: "🧭"
    ui: hud
    order: 3
    description: >
      Cinco mundos, uno por fase del plan: recuperar horas con Java, fundamentos con
      Spring Boot y PostgreSQL, sistemas distribuidos, entrevistas y decisión.
      Solo cuentan las horas hechas y los commits.
