          task: "Modela en Cassandra un sistema de órdenes con estas consultas: (1) orden por id, (2) últimas órdenes de un cliente, (3) eventos de una tienda por día, (4) órdenes pendientes de envío por centro de distribución. Entrega los CREATE TABLE, el keyspace (RF y estrategia), los niveles de consistencia por operación y qué pasa con cada consulta si cae un nodo de tres. Luego defiéndelo en inglés."
          rubric: [correctness, depth, clarity, tradeoffs]
          interview_focus: ["query-first modeling", "partition sizing and hot partitions", "consistency levels under failure", "tombstones and anti-patterns"]

