slug: incident-keep
title: Incident Keep
order: 25
emoji: "🏰"
track: cybersecurity
status: outline
map: { x: 770, y: 500 }
unlocked_from_start: false
prerequisites:
  - { zone: blue-harbor, level: 2 }
skills: [ir_forensics, blue_ops]
story: >
  La fortaleza a la que se corre cuando ya pasó. Aquí no se discute si hubo incidente: se
  contiene, se erradica, se recupera y se escribe qué falló, sin buscar a quién culpar.
  El informe es parte del trabajo, no el papeleo de después.

