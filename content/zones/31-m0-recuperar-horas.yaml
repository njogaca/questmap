      - slug: m0-n1-ejercicio
        type: lab
        title: "Ejercicio — Hola mundo subido al repositorio"
        xp: 50
        estimated_min: 90
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-java-getting-started, required: false }
        payload:
          proof: commit_or_hours
          goal: "Un proyecto Maven que imprime un saludo, subido a un repositorio tuyo en GitHub."
          spec:
            context: |
              Es tu primer día en un equipo. Antes de darte una tarea de verdad, el líder técnico pide
              lo mismo a todo el que entra: demostrar que tu máquina compila, ejecuta y publica código.
              Si otra persona clona tu repositorio, debe poder correrlo sin preguntarte nada.
            requirements:
              - "El proyecto es Maven, con `pom.xml` en la raíz y el código en `src/main/java`."
              - "La clase `Main` tiene un método `public static void main(String[] args)` que imprime una sola línea de saludo."
              - "El proyecto compila y se ejecuta con el comando del paso 2, sin abrir el editor."
              - "El repositorio en GitHub es tuyo, se llama `pedidos-consola` y tiene al menos un commit con mensaje descriptivo."
              - "Existe un `.gitignore` que excluye `target/` y los archivos del editor (`.idea/`, `.vscode/`, `*.iml`)."
            inputs:
              - { name: "(ninguna)", type: "—", desc: "El programa no lee argumentos ni teclado." }
            outputs:
              - { name: "salida estándar", type: "String", desc: "Una línea con el saludo, terminada en salto de línea." }
              - { name: "código de salida", type: "int", desc: "`0`: el programa termina sin error." }
            rules:
              - "La versión de Java se fija en el `pom.xml` con `<maven.compiler.release>21</maven.compiler.release>`; no depende de lo que tenga instalado cada quien."
              - "El `groupId` sigue la convención de dominio invertido, por ejemplo `dev.tunombre`."
              - "El mensaje del commit dice qué se hizo («Proyecto Maven inicial con saludo»), no «cambios» ni «prueba»."
            examples:
              - title: "Ejecución"
                input: |
                  mvn -q compile exec:java "-Dexec.mainClass=Main"
                output: |
                  Hola, OrderBridge
            edge_cases:
              - "Clona el repositorio en otra carpeta y ejecútalo ahí. Si solo funciona en la carpeta original, falta subir algo."
              - "`git status` justo después de compilar no debe mostrar `target/` como pendiente."
            out_of_scope:
              - "Paquetes, pruebas y lectura de argumentos. Llegan en los niveles siguientes."
          steps:
            - title: "Instala y comprueba"
              body: "Instala el JDK 21, Maven y tu editor. Comprueba las versiones desde la terminal."
              commands: ["java -version", "mvn -version", "git --version"]
            - title: "Crea el proyecto"
              body: "Crea un proyecto Maven con una clase `Main` que imprima un saludo. Compílalo y ejecútalo."
              commands: ["mvn -q compile exec:java \"-Dexec.mainClass=Main\""]
            - title: "Súbelo a GitHub"
              body: "Crea el repositorio en GitHub, agrega un `.gitignore` que excluya `target/` y sube tu primer commit."
          checklist:
            - "`java -version` y `mvn -version` responden sin error"
            - "El programa imprime el saludo"
            - "El repositorio está en GitHub y `target/` no se subió"

