      - slug: java-5-quiz-final
        type: quiz
        title: Examen final — Java Forest
        required: true
        estimated_min: 20
        skills: { java: 0.8, testing: 0.2 }
        questions:
          - slug: j5-q1
            type: mcq
            prompt: "`HashMap` vs `ConcurrentHashMap`: ¿cuándo necesitas el segundo?"
            options: ["Siempre", "Cuando varios hilos leen y escriben el mismo mapa", "Cuando hay más de 1000 elementos", "Cuando las claves son String"]
            answer: 1
            explanation: "`HashMap` no es thread-safe; con escrituras concurrentes puede corromperse. Un controller de Spring atiende peticiones en varios hilos, por eso tu repositorio en memoria usó `ConcurrentHashMap`."
            skill: java
            difficulty: 2
          - slug: j5-q2
            type: mcq
            prompt: "Si sobrescribes `equals` en una clase, ¿qué más debes sobrescribir?"
            options: ["toString", "hashCode", "compareTo", "clone"]
            answer: 1
            explanation: "Si dos objetos son `equals`, deben tener el mismo `hashCode`; si no, `HashMap`/`HashSet` fallan. Los records lo hacen por ti."
            skill: java
            difficulty: 2
          - slug: j5-q3
            type: tf
            prompt: "Por defecto, los beans de Spring son singletons: hay una sola instancia compartida por todas las peticiones."
            answer: true
            explanation: "Por eso un `@Service` no debe guardar estado mutable por petición en sus campos: varios hilos lo comparten."
            skill: java
            difficulty: 2
          - slug: j5-q4
            type: mcq
            prompt: "Tu prueba con `@SpringBootTest` tarda 15 s y solo quieres probar el controller. ¿Qué usas?"
            options: ["@DataJpaTest", "@WebMvcTest", "@Disabled", "@RepeatedTest"]
            answer: 1
            explanation: "`@WebMvcTest` levanta solo la capa web (controllers, advice, validación) y mockeas los servicios con `@MockitoBean`/`@MockBean`: mucho más rápido."
            skill: testing
            difficulty: 2
          - slug: j5-q5
            type: mcq
            prompt: "`CompletableFuture.supplyAsync(...)` sin especificar executor usa:"
            options: ["Un hilo nuevo por tarea", "El ForkJoinPool común", "El hilo del servidor web", "Un executor de Spring"]
            answer: 1
            explanation: "Usa `ForkJoinPool.commonPool()`. Para llamadas I/O (HTTP, BD) conviene pasar tu propio executor para no bloquear el pool común (o usar virtual threads en Java 21)."
            skill: java
            difficulty: 3
          - slug: j5-q6
            type: mcq
            prompt: "Un endpoint lanza `NullPointerException` y el cliente recibe 500. ¿Qué es lo más profesional?"
            options:
              - "Capturar Exception en el controller y devolver 200"
              - "Encontrar la causa raíz, corregirla y agregar una prueba que reproduzca el caso"
              - "Desactivar los logs"
              - "Reiniciar el servicio"
            answer: 1
            explanation: "RCA: reproducir, entender, corregir y dejar una prueba de regresión. Ocultar el error con un 200 empeora el debugging de todos."
            skill: java
            difficulty: 1
          - slug: j5-q7
            type: fill
            prompt: "La anotación de Mockito que crea el objeto bajo prueba e inyecta los mocks es `@Inject______`."
            answer: ["Mocks"]
            explanation: "`@InjectMocks` crea el servicio y le pasa los campos `@Mock` por constructor (o setters/campos)."
            skill: testing
            difficulty: 2
          - slug: j5-q8
            type: mcq
            prompt: "¿Qué hace `Optional.map(...).orElseThrow(...)` en `repo.findById(id).map(this::toDto).orElseThrow(OrderNotFoundException::new)`?"
            options:
              - "Lanza siempre la excepción"
              - "Si hay orden, la convierte a DTO; si no, lanza OrderNotFoundException"
              - "Devuelve null si no hay orden"
              - "No compila"
            answer: 1
            explanation: "`map` solo se aplica si hay valor; `orElseThrow` lanza la excepción cuando está vacío. Es la forma idiomática de un 'get or 404'."
            skill: java
            difficulty: 2

