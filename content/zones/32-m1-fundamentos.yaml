            difficulty: 1

  # ================================================================ NIVEL 6
  - slug: m1-n6-integracion
    number: 6
    title: "Pruebas de integración"
    story: "Objetivo: probar la API de punta a punta contra un PostgreSQL de verdad, no contra uno simulado."
    quests:
      - slug: m1-n6-glosario
        type: glossary
        title: "Glosario — Pruebas de integración"
        xp: 0
        estimated_min: 10
        skills: { spring_api: 1.0 }
        payload:
          terms: [g-p1-integration-test, g-p1-test-container, g-p1-test-fixture, g-p1-flaky-test]

      - slug: m1-n6-ejercicio
        type: lab
        title: "Ejercicio — Pruebas contra una base de datos real"
        xp: 50
        estimated_min: 180
        skills: { spring_api: 1.0 }
        resources:
          - { ref: res-p-boot-testcontainers, required: false }
        payload:
          proof: commit_or_hours
          goal: "Pruebas de integración que arrancan el servicio y un PostgreSQL en contenedor, y recorren los endpoints de pedidos."
          spec:
            context: |
              Un compañero cambió el tipo de una columna, las pruebas unitarias siguieron en verde y
              la API se rompió en producción. Las pruebas con una base simulada no ven ese tipo de
              fallo. El equipo quiere pruebas que levanten el servicio entero contra un PostgreSQL
              real, y que corran igual en tu máquina y en CI sin instalar nada a mano.
            requirements:
              - "Las pruebas de integración arrancan la aplicación completa con `@SpringBootTest(webEnvironment = RANDOM_PORT)`."
              - "La base es un contenedor `postgres:16` gestionado por Testcontainers, y sobre él corren las migraciones de Flyway."
              - "Las peticiones son HTTP reales contra el puerto de la prueba (con `TestRestTemplate`, `RestClient` o RestAssured), no llamadas directas al servicio."
              - "Hay al menos una prueba por cada caso de la lista de ejemplos."
              - "`mvn verify` corre todo y termina en `BUILD SUCCESS` sin un PostgreSQL instalado ni levantado a mano."
            inputs:
              - { name: "Docker", type: "requisito", desc: "Tiene que estar en marcha: Testcontainers lo usa para crear la base." }
              - { name: "cuerpos de prueba", type: "JSON", desc: "Cada prueba arma el pedido que necesita. No hay datos compartidos." }
            outputs:
              - { name: "mvn verify", type: "consola", desc: "`Tests run: N, Failures: 0, Errors: 0` y `BUILD SUCCESS`." }
            rules:
              - "Nada de H2 ni de bases en memoria: la base de las pruebas es el mismo motor y la misma versión que la real."
              - "Cada prueba crea sus datos y no depende de lo que dejó otra. Pasan en cualquier orden y también una sola."
              - "Se comprueba el código HTTP, las cabeceras que importan y el cuerpo. Comprobar solo el `200` no es una prueba."
              - "Las clases de integración terminan en `IT` (`OrderApiIT`) y las unitarias en `Test`, para poder correrlas por separado."
              - "El contenedor se comparte entre las pruebas de una clase. No se levanta uno por método."
            examples:
              - title: "Casos que deben existir"
                lang: "casos"
                output: |
                  Camino feliz
                    POST /orders válido        -> 201, cabecera Location, total 95.00
                    GET /orders/{id}           -> 200 con el mismo pedido y sus 2 líneas
                    GET /orders                -> 200 y la lista contiene el pedido creado
                    PUT /orders/{id}           -> 200, total recalculado, mismo id y createdAt
                    DELETE /orders/{id}        -> 204; el GET siguiente -> 404
                  Errores
                    POST con quantity 0        -> 400 application/problem+json con items[0].quantity en errors
                    POST con correo inválido   -> 400 y el pedido no se guarda
                    GET de un id inexistente   -> 404 con Problem Details
                    GET /orders/abc            -> 400
                  Persistencia
                    tras el POST hay 1 fila en orders y 2 en order_items
                    tras el DELETE no queda ninguna fila en order_items
            edge_cases:
              - "Ejecuta una sola prueba (`mvn verify -Dit.test=OrderApiIT#deleteReturns204`): debe pasar sola."
              - "Con Docker apagado, el fallo dice que no encuentra Docker. No es un error de tu código."
              - "Ejecuta dos veces seguidas: la segunda no falla por datos de la primera."
            out_of_scope:
              - "Pruebas de carga y de rendimiento."
              - "Mocks de la base o del repositorio."
              - "Probar la consola o el frontend."
          steps:
            - title: "Testcontainers"
              body: "Agrega Testcontainers y configura un contenedor de PostgreSQL para las pruebas."
            - title: "Camino feliz"
              body: "Prueba crear un pedido, leerlo, actualizarlo y borrarlo a través de HTTP."
            - title: "Errores"
              body: "Prueba el 400 de un pedido inválido y el 404 de un id inexistente. Cada prueba prepara sus propios datos."
          checklist:
            - "Las pruebas corren con `mvn verify` sin una base instalada a mano"
            - "Hay pruebas del camino feliz y de los errores"
            - "Las pruebas pasan en cualquier orden"

      - slug: m1-n6-quiz
