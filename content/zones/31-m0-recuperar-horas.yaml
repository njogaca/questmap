  # ================================================================ JEFE
  - slug: m0-n7-jefe
    number: 7
    title: "Jefe — App de consola de pedidos"
    story: "Fecha: 31 de diciembre de 2026. Todo lo del mundo junto en un solo programa que funciona y tiene pruebas. Vencerlo abre el Mundo 1."
    quests:
      - slug: m0-jefe-app-consola
        type: lab
        title: "Jefe (31 dic) — App de consola de pedidos con pruebas"
        xp: 150
        estimated_min: 480
        skills: { core_java: 1.0 }
        payload:
          proof: commit_or_hours
          goal: "Una app de consola para crear, listar, buscar y reportar pedidos, con pruebas que pasan."
          spec:
            context: |
              La tienda quiere dejar la hoja de cálculo ya. Mientras llega el sistema web del Mundo 1,
              la persona de mostrador va a usar un programa de consola para registrar y consultar
              los pedidos del día. No sabe programar: si escribe algo mal, el programa le explica el
              error y sigue funcionando.
            requirements:
              - "Al arrancar muestra el menú y espera una opción. Después de cada operación vuelve a mostrarlo, hasta que se elige salir."
              - "Opción 1, crear pedido: pide id, nombre y correo del cliente, las líneas una por una y el porcentaje de descuento. Guarda el pedido y muestra su total."
              - "Opción 2, listar: una línea por pedido con id, correo, número de líneas y total, en el orden en que se crearon."
              - "Opción 3, buscar por id: muestra el detalle del pedido (cliente, cada línea, subtotal, descuento y total) o avisa que no existe."
              - "Opción 4, reporte: total vendido, pedido más grande y total por cliente."
              - "Opción 5, salir: imprime `Hasta luego` y termina con código de salida `0`."
              - "Reutiliza `Pedido`, `Descuento`, `RepositorioPedidos`, `PedidoInvalidoException` y `ReportePedidos` de los niveles 3 a 5. No se duplica lógica en la clase del menú."
              - "El repositorio tiene un `README.md` con requisitos, cómo ejecutar, cómo correr las pruebas y un ejemplo de uso."
            inputs:
              - { name: "opción", type: "String → int", desc: "Un número del 1 al 5, leído como texto y convertido." }
              - { name: "id", type: "String", desc: "No vacío y no repetido, por ejemplo `P-001`." }
              - { name: "cliente", type: "String", desc: "Nombre, no vacío." }
              - { name: "correo", type: "String", desc: "Debe contener `@`." }
              - { name: "línea", type: "String", desc: "`nombre,precio,cantidad` separados por coma, por ejemplo `Teclado,40.00,2`. Una línea vacía termina la captura." }
              - { name: "descuento", type: "String → double", desc: "Porcentaje de `0` a `100`. `0` significa sin descuento." }
            outputs:
              - { name: "consola", type: "String", desc: "Menú, preguntas, resultados y errores. Los importes con dos decimales y punto decimal." }
              - { name: "errores", type: "String", desc: "Siempre empiezan por `Error: ` y dicen qué dato falló." }
              - { name: "código de salida", type: "int", desc: "`0` al salir por el menú." }
            rules:
              - "Toda la entrada se lee como texto (`Scanner.nextLine()`) y se convierte después. Un `NumberFormatException` nunca llega al usuario."
              - "Una entrada inválida muestra su error y vuelve al menú. Ningún dato equivocado cierra el programa ni muestra un stack trace."
              - "Si la creación falla a mitad de camino, no queda nada guardado."
              - "La lógica del menú es una clase aparte de `main`, que recibe de dónde lee y dónde escribe, para poder probarla sin teclado."
              - "`mvn test` pasa en verde, con las pruebas del nivel 6 más al menos tres del menú: crear y listar, opción inválida, y línea mal escrita."
            examples:
              - title: "Crear un pedido"
                lang: "sesión de consola"
                output: |
                  === Pedidos ===
                  1) Crear pedido
                  2) Listar pedidos
                  3) Buscar por id
                  4) Reporte
                  5) Salir
                  > 1
                  Id: P-001
                  Cliente: Ana
                  Correo: ana@example.com
                  Línea (nombre,precio,cantidad) o vacío para terminar: Teclado,40.00,2
                  Línea (nombre,precio,cantidad) o vacío para terminar: Mouse,15.00,1
                  Línea (nombre,precio,cantidad) o vacío para terminar:
                  Descuento % (0 si no aplica): 10
                  Pedido P-001 creado. Total: 85.50
              - title: "Listar y buscar"
                lang: "sesión de consola"
                output: |
                  > 2
                  P-001  ana@example.com  2 líneas  85.50
                  > 3
                  Id: P-001
                  Pedido P-001 — Ana <ana@example.com>
                    Teclado  40.00 x 2 = 80.00
                    Mouse    15.00 x 1 = 15.00
                  Subtotal: 95.00
                  Descuento: 9.50
                  Total: 85.50
              - title: "Entradas inválidas"
                lang: "sesión de consola"
                output: |
                  > 9
                  Error: opción no válida, elige un número del 1 al 5
                  > abc
                  Error: opción no válida, elige un número del 1 al 5
                  > 3
                  Id: P-999
                  Error: no existe el pedido P-999
                  > 1
                  Id: P-001
                  Error: ya existe el pedido P-001
            edge_cases:
              - "Línea con formato incorrecto (`Teclado;40;2`, `Teclado,abc,2`, faltan campos): muestra el error y vuelve a pedir esa línea, sin perder las anteriores."
              - "Terminar las líneas sin haber agregado ninguna: `Error: El pedido P-002 no tiene líneas` y no se guarda."
              - "Cantidad `0` o negativa: el error de `PedidoInvalidoException` y no se guarda."
              - "Listar o pedir el reporte sin pedidos: `No hay pedidos todavía`, no una pantalla vacía ni un error."
              - "Descuento fuera de 0 a 100 o con letras: error y vuelve al menú."
              - "Fin de la entrada (Ctrl+Z en Windows, Ctrl+D en Linux): el programa termina sin stack trace."
            out_of_scope:
              - "Guardar los pedidos entre ejecuciones. Al cerrar, se pierden."
              - "Editar o borrar pedidos."
              - "Impuestos, colores en consola y varios idiomas."
          steps:
            - title: "Menú"
              body: "Un menú de texto con las opciones: crear pedido, listar, buscar por id, reporte y salir."
            - title: "Reglas y errores"
              body: "Usa las clases, el almacén, las validaciones y el reporte de los niveles anteriores. Una entrada inválida muestra un mensaje y el programa sigue."
            - title: "Pruebas y entrega"
              body: "Todas las pruebas pasan con `mvn test`. Sube el código con un README corto que diga cómo ejecutarlo."
          checklist:
            - "El menú completo funciona de principio a fin"
            - "Una entrada inválida no detiene el programa"
            - "`mvn test` pasa en verde"
            - "El repositorio tiene un README con los pasos para ejecutar"
