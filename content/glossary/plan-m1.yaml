# Glosario del Mundo 1 (ruta plan-2027). Término en inglés, explicación corta en español.
zone: m1-fundamentos
terms:
  # ------------------------------------------------- Nivel 1: Spring Boot
  - slug: g-p1-framework
    term: Framework
    category: spring
    definition_es: "Base de código ya hecha que organiza tu aplicación y llama a tu código cuando toca. Spring Boot es uno."
    definition_en: "A ready-made code base that structures your application and calls your code at the right time."
    example_en: "Spring Boot is the framework for this service."
  - slug: g-p1-endpoint
    term: Endpoint
    category: spring
    definition_es: "Una dirección de tu servicio (método HTTP más ruta) que responde a una petición, como GET /status."
    definition_en: "An address of your service, an HTTP method plus a path, that answers a request."
    example_en: "The health endpoint returns 200."
  - slug: g-p1-controller
    term: Controller
    category: spring
    definition_es: "La clase que recibe las peticiones HTTP y devuelve las respuestas. En Spring se marca con @RestController."
    definition_en: "The class that receives HTTP requests and returns responses."
    example_en: "Keep the controller thin."
  - slug: g-p1-dependency-injection
    term: Dependency injection
    category: spring
    definition_es: "En vez de crear tú los objetos que una clase necesita, Spring se los entrega ya construidos."
    definition_en: "Instead of creating the objects a class needs, the framework hands them over already built."
    example_en: "The service gets its repository through dependency injection."

  # ------------------------------------------------- Nivel 2: REST completo
  - slug: g-p1-rest
    term: REST
    category: api
    definition_es: "Estilo para diseñar APIs sobre HTTP en el que cada cosa (un pedido) es un recurso con su dirección, y los métodos HTTP dicen qué hacer con él."
    definition_en: "A style for designing HTTP APIs where each thing is a resource with its own address."
    example_en: "The API follows REST conventions."
  - slug: g-p1-http-method
    term: HTTP method
    category: api
    definition_es: "El verbo de la petición. GET lee, POST crea, PUT reemplaza y DELETE borra."
    definition_en: "The verb of the request. GET reads, POST creates, PUT replaces, DELETE removes."
    example_en: "Use the POST HTTP method to create an order."
  - slug: g-p1-status-code
    term: Status code
    category: api
    definition_es: "Número de tres cifras con el que el servidor resume el resultado. 200 bien, 201 creado, 404 no existe, 500 fallo del servidor."
    definition_en: "A three-digit number that sums up the result of the request."
    example_en: "A missing order returns status code 404."
  - slug: g-p1-request-body
    term: Request body
    category: api
    definition_es: "Los datos que viajan dentro de la petición, normalmente en JSON, por ejemplo el pedido que se quiere crear."
    definition_en: "The data sent inside the request, usually as JSON."
    example_en: "The request body contains the order items."

  # ------------------------------------------------- Nivel 3: PostgreSQL con JPA
  - slug: g-p1-entity
    term: Entity
    category: datos
    definition_es: "Clase de Java que representa una tabla. Cada objeto es una fila."
    definition_en: "A Java class that maps to a table. Each object is a row."
    example_en: "Order is an entity mapped to the orders table."
  - slug: g-p1-orm
    term: ORM
    category: datos
    definition_es: "Object-Relational Mapping. Herramienta que traduce entre objetos y tablas para que no escribas todo el SQL. JPA con Hibernate es el de Java."
    definition_en: "A tool that translates between objects and tables so you do not write all the SQL."
    example_en: "The ORM generated that query."
  - slug: g-p1-primary-key
    term: Primary key
    category: datos
    definition_es: "La columna que identifica cada fila de forma única. Suele llamarse id."
    definition_en: "The column that uniquely identifies each row."
    example_en: "The primary key is generated by the database."
  - slug: g-p1-migration
    term: Migration
    category: datos
    definition_es: "Archivo versionado con un cambio al esquema de la base, como crear una tabla. Se aplican en orden y quedan en el repositorio."
    definition_en: "A versioned file with one change to the database schema."
    example_en: "Add a migration for the new column."

  # ------------------------------------------------- Nivel 4: SQL a mano
  - slug: g-p1-join
    term: Join
    category: datos
    definition_es: "Consulta que une filas de dos tablas por una columna en común, por ejemplo pedidos con sus clientes."
    definition_en: "A query that combines rows from two tables through a shared column."
    example_en: "Use a join to get each order with its customer."
  - slug: g-p1-foreign-key
    term: Foreign key
    category: datos
    definition_es: "Columna que apunta a la clave primaria de otra tabla. La base impide que apunte a algo que no existe."
    definition_en: "A column that points to the primary key of another table."
    example_en: "customer_id is a foreign key."
  - slug: g-p1-index
    term: Index
    category: datos
    definition_es: "Estructura extra que acelera las búsquedas por una columna, a cambio de escrituras algo más lentas."
    definition_en: "An extra structure that speeds up lookups on a column, at the cost of slower writes."
    example_en: "Add an index on customer_id."
  - slug: g-p1-query-plan
    term: Query plan
    category: datos
    definition_es: "Los pasos que la base decide seguir para resolver una consulta. Se ve con EXPLAIN."
    definition_en: "The steps the database chooses to run a query. You see it with EXPLAIN."
    example_en: "The query plan shows a full table scan."

  # ------------------------------------------------- Nivel 5: validación y errores
  - slug: g-p1-validation
    term: Validation
    category: api
    definition_es: "Comprobar que los datos de entrada cumplen las reglas antes de usarlos."
    definition_en: "Checking that input data follows the rules before using it."
    example_en: "Validation rejects an empty item list."
  - slug: g-p1-bad-request
    term: Bad request
    category: api
    definition_es: "Respuesta 400. La petición está mal formada o le faltan datos, y es culpa de quien la envió."
    definition_en: "A 400 response. The request is malformed or missing data."
    example_en: "A negative quantity returns a bad request."
  - slug: g-p1-exception-handler
    term: Exception handler
    category: api
    definition_es: "Código central que convierte las excepciones en respuestas HTTP ordenadas, en lugar de dejar que el usuario vea un error crudo."
    definition_en: "Central code that turns exceptions into clean HTTP responses."
    example_en: "The exception handler maps not found errors to 404."
  - slug: g-p1-problem-details
    term: Problem details
    category: api
    definition_es: "Formato estándar de JSON para respuestas de error, con campos como title, status y detail."
    definition_en: "A standard JSON format for error responses, with fields such as title, status and detail."
    example_en: "Errors are returned as problem details."

  # ------------------------------------------------- Nivel 6: pruebas de integración
  - slug: g-p1-integration-test
    term: Integration test
    category: pruebas
    definition_es: "Prueba que comprueba varias piezas juntas, como el endpoint con la base de datos real."
    definition_en: "A test that checks several pieces working together."
    example_en: "The integration test calls the API and reads the table."
  - slug: g-p1-test-container
    term: Test container
    category: pruebas
    definition_es: "Contenedor Docker que la prueba arranca y destruye sola, por ejemplo un PostgreSQL limpio para cada ejecución."
    definition_en: "A Docker container that the test starts and removes by itself."
    example_en: "Each run uses a fresh test container."
  - slug: g-p1-test-fixture
    term: Test fixture
    category: pruebas
    definition_es: "Los datos y el estado que se preparan antes de una prueba para que siempre arranque igual."
    definition_en: "The data and state prepared before a test so it always starts the same way."
    example_en: "The fixture inserts two customers."
  - slug: g-p1-flaky-test
    term: Flaky test
    category: pruebas
    definition_es: "Prueba que a veces pasa y a veces falla sin que cambie el código. Casi siempre depende del orden, del tiempo o de datos compartidos."
    definition_en: "A test that sometimes passes and sometimes fails with no code change."
    example_en: "That flaky test depends on the clock."

  # ------------------------------------------------- Nivel 7: transacciones
  - slug: g-p1-transaction
    term: Transaction
    category: datos
    definition_es: "Grupo de operaciones en la base que se aplican todas o ninguna."
    definition_en: "A group of database operations that are applied all together or not at all."
    example_en: "Creating the order and its items is one transaction."
  - slug: g-p1-rollback
    term: Rollback
    category: datos
    definition_es: "Deshacer todo lo hecho dentro de una transacción cuando algo falla."
    definition_en: "Undoing everything done inside a transaction when something fails."
    example_en: "The failed insert caused a rollback."
  - slug: g-p1-atomicity
    term: Atomicity
    category: datos
    definition_es: "La garantía de todo o nada. Nunca queda un pedido guardado a medias."
    definition_en: "The all-or-nothing guarantee."
    example_en: "Atomicity prevents half-saved orders."
  - slug: g-p1-isolation
    term: Isolation
    category: datos
    definition_es: "Qué tanto ve una transacción los cambios sin confirmar de otra que corre al mismo tiempo."
    definition_en: "How much one transaction sees the uncommitted changes of another running at the same time."
    example_en: "Isolation stops two buyers from taking the last unit."

  # ------------------------------------------------- Nivel 8: Docker
  - slug: g-p1-image
    term: Image
    category: entrega
    definition_es: "El paquete inmóvil con tu aplicación y todo lo que necesita para correr. Es la receta ya cocinada."
    definition_en: "The fixed package with your application and everything it needs to run."
    example_en: "Build the image before you deploy."
  - slug: g-p1-container
    term: Container
    category: entrega
    definition_es: "Una imagen en ejecución, aislada del resto de la máquina."
    definition_en: "A running image, isolated from the rest of the machine."
    example_en: "The database runs in a container."
  - slug: g-p1-dockerfile
    term: Dockerfile
    category: entrega
    definition_es: "Archivo de texto con los pasos para construir una imagen."
    definition_en: "A text file with the steps to build an image."
    example_en: "The Dockerfile copies the jar and runs it."
  - slug: g-p1-volume
    term: Volume
    category: entrega
    definition_es: "Almacenamiento que sobrevive cuando el contenedor se borra. Ahí viven los datos de la base."
    definition_en: "Storage that survives when the container is removed."
    example_en: "The database data lives in a volume."

  # ------------------------------------------------- Nivel 9: CI
  - slug: g-p1-ci
    term: Continuous integration
    category: entrega
    definition_es: "Práctica de compilar y probar el proyecto de forma automática en cada cambio que se sube."
    definition_en: "The practice of building and testing the project automatically on every pushed change."
    example_en: "Continuous integration caught the broken test."
  - slug: g-p1-pipeline
    term: Pipeline
    category: entrega
    definition_es: "La serie de pasos automáticos que corre en cada cambio, como compilar, probar y empaquetar."
    definition_en: "The series of automatic steps that run on each change."
    example_en: "The pipeline failed at the test step."
  - slug: g-p1-workflow
    term: Workflow
    category: entrega
    definition_es: "En GitHub Actions, el archivo YAML que define cuándo y cómo corre un pipeline."
    definition_en: "In GitHub Actions, the YAML file that defines when and how a pipeline runs."
    example_en: "The workflow runs on every push."
  - slug: g-p1-build-status
    term: Build status
    category: entrega
    definition_es: "El resultado del último pipeline, verde o rojo. Suele mostrarse como una insignia en el README."
    definition_en: "The result of the latest pipeline run, green or red."
    example_en: "The build status badge is green."

  # ------------------------------------------------- Nivel 10: configuración y seguridad
  - slug: g-p1-environment-variable
    term: Environment variable
    category: entrega
    definition_es: "Valor que el sistema le pasa al programa desde fuera del código, como la contraseña de la base."
    definition_en: "A value the system passes to the program from outside the code."
    example_en: "Read the password from an environment variable."
  - slug: g-p1-profile
    term: Profile
    category: entrega
    definition_es: "En Spring, un juego de configuración con nombre (dev, test, prod) que se activa según dónde corre el servicio."
    definition_en: "In Spring, a named set of configuration that is activated depending on where the service runs."
    example_en: "The test profile uses a different database."
  - slug: g-p1-secret
    term: Secret
    category: entrega
    definition_es: "Dato que no debe verse, como contraseñas, tokens y llaves. Nunca va en el repositorio."
    definition_en: "Data that must stay hidden, such as passwords, tokens and keys."
    example_en: "Never commit a secret."
  - slug: g-p1-authentication
    term: Authentication
    category: entrega
    definition_es: "Comprobar quién eres. No es lo mismo que authorization, que decide qué puedes hacer."
    definition_en: "Checking who you are. Authorization decides what you can do."
    example_en: "The endpoint requires authentication."

  # ------------------------------------------------- Nivel 11: documentación
  - slug: g-p1-readme
    term: README
    category: entrega
    definition_es: "El archivo que se ve al abrir el repositorio. Dice qué es el proyecto, cómo se ejecuta y cómo se prueba."
    definition_en: "The file shown when you open the repository. It says what the project is and how to run it."
    example_en: "The README explains how to start the service."
  - slug: g-p1-architecture-diagram
    term: Architecture diagram
    category: entrega
    definition_es: "Dibujo con las piezas del sistema y cómo se comunican entre sí."
    definition_en: "A drawing of the parts of the system and how they talk to each other."
    example_en: "The architecture diagram shows the API and the database."
  - slug: g-p1-prerequisite
    term: Prerequisite
    category: entrega
    definition_es: "Lo que hay que tener instalado antes de empezar, con su versión."
    definition_en: "What must be installed before you start, with its version."
    example_en: "Docker is a prerequisite."
  - slug: g-p1-trade-off
    term: Trade-off
    category: entrega
    definition_es: "Lo que ganas y lo que pierdes al elegir una opción sobre otra. Explicarlo es lo que más pesa en una entrevista."
    definition_en: "What you gain and what you lose when you choose one option over another."
    example_en: "The trade-off is simpler code for slower writes."

  # ------------------------------------------------- Nivel 12: repaso
  - slug: g-p1-walkthrough
    term: Walkthrough
    category: entrevista
    definition_es: "Explicar algo paso a paso mientras lo muestras, por ejemplo recorrer tu código frente al entrevistador."
    definition_en: "Explaining something step by step while you show it."
    example_en: "Give me a walkthrough of your service."
  - slug: g-p1-follow-up-question
    term: Follow-up question
    category: entrevista
    definition_es: "La pregunta que el entrevistador hace a partir de tu respuesta para ver qué tan a fondo lo entiendes."
    definition_en: "The question the interviewer asks after your answer to see how deep your understanding goes."
    example_en: "Expect a follow-up question about transactions."
  - slug: g-p1-bottleneck
    term: Bottleneck
    category: entrevista
    definition_es: "La parte del sistema que limita al resto, como una consulta lenta que frena todo el endpoint."
    definition_en: "The part of the system that limits everything else."
    example_en: "The database is the bottleneck."
