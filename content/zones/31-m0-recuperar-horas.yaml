      - slug: m0-n4-ejercicio
        type: lab
        title: "Ejercicio — Lista de pedidos con búsqueda y filtro"
        xp: 50
        estimated_min: 150
        skills: { core_java: 1.0 }
        resources:
          - { ref: res-p-java-collections, required: false }
        payload:
          proof: commit_or_hours
          goal: "Una clase que guarda pedidos en memoria y permite buscarlos por id y filtrarlos."
          spec:
            context: |
              Atención al cliente necesita encontrar un pedido en cuanto alguien llama con su número,
              y ver todos los pedidos de una persona. Todavía no hay base de datos: los pedidos viven
              en memoria mientras corre el programa. Lo que se defina aquí es el contrato que más
              adelante cumplirá el repositorio de verdad.
            requirements:
              - "`RepositorioPedidos.agregar(Pedido pedido)` guarda el pedido. No devuelve nada."
              - "`buscarPorId(String id)` devuelve un `Optional<Pedido>`."
              - "`listarTodos()` devuelve una `List<Pedido>` con todos los pedidos, en el orden en que se agregaron."
              - "`filtrarPorCliente(String correo)` devuelve una `List<Pedido>` con los pedidos de ese cliente."
              - "`filtrarPorTotalMinimo(double minimo)` devuelve una `List<Pedido>` con los pedidos cuyo `total()` es mayor o igual que `minimo`."
              - "`cantidad()` devuelve un `int` con el número de pedidos guardados."
            inputs:
              - { name: "pedido", type: "Pedido", desc: "El pedido del nivel 3. Su `getId()` es la clave." }
              - { name: "id", type: "String", desc: "Identificador exacto, por ejemplo `P-001`. Distingue mayúsculas." }
              - { name: "correo", type: "String", desc: "Correo del cliente. La comparación ignora mayúsculas y minúsculas." }
              - { name: "minimo", type: "double", desc: "Total mínimo, incluido: un pedido de 85.50 entra con `minimo = 85.50`." }
            outputs:
              - { name: "buscarPorId", type: "Optional<Pedido>", desc: "Con valor si existe; `Optional.empty()` si no. Nunca `null`." }
              - { name: "listas", type: "List<Pedido>", desc: "Lista nueva en cada llamada. Vacía si nada cumple, nunca `null`." }
            rules:
              - "El almacén interno es un `Map<String, Pedido>` privado. Buscar por id usa `get` del mapa; no recorre los pedidos."
              - "Un id repetido se rechaza: `agregar` lanza `IllegalArgumentException` con el id en el mensaje y el pedido original queda intacto."
              - "Las listas devueltas son independientes del almacén: agregarles o quitarles elementos no cambia el repositorio."
              - "El orden de `listarTodos()` y de los filtros es el de inserción. Elige la implementación de `Map` que lo garantice."
            examples:
              - title: "Tres pedidos guardados"
                input: |
                  P-001  ana@example.com   total 85.50
                  P-002  luis@example.com  total 200.00
                  P-003  ana@example.com   total 14.50
                output: |
                  buscarPorId("P-002")               -> Optional[P-002]
                  buscarPorId("P-999")               -> Optional.empty
                  filtrarPorCliente("ANA@example.com") -> [P-001, P-003]
                  filtrarPorTotalMinimo(85.50)       -> [P-001, P-002]
                  filtrarPorTotalMinimo(500.00)      -> []
                  cantidad()                         -> 3
            edge_cases:
              - "`agregar(null)` o `buscarPorId(null)` lanzan `IllegalArgumentException`; no un `NullPointerException` tres líneas más abajo."
              - "Agregar `P-001` dos veces: la segunda lanza la excepción y `cantidad()` sigue igual."
              - "`listarTodos().clear()` no vacía el repositorio."
              - "Repositorio vacío: todos los métodos de consulta devuelven vacío sin fallar."
            out_of_scope:
              - "Borrar o modificar pedidos."
              - "Guardar en archivo o en base de datos."
              - "Uso desde varios hilos a la vez."
          steps:
            - title: "Almacén de pedidos"
              body: "Crea `RepositorioPedidos` con un `Map<String, Pedido>` por id. Métodos para agregar, buscar por id y listar todos."
            - title: "Filtros"
              body: "Agrega filtros por cliente y por total mínimo. Devuelven una `List<Pedido>` nueva; no modifican el almacén."
            - title: "Casos límite"
              body: "Implementa lo que el requerimiento decide para un id repetido, un id que no existe y un argumento `null`. Que se lea en el código, no que ocurra por accidente."
          checklist:
            - "Buscar por id no recorre toda la lista"
            - "Los filtros devuelven listas nuevas"
            - "Un id inexistente no rompe el programa"

