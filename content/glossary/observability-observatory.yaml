zone: observability-observatory
terms: [ { slug: obs-metric, term: metric, category: basics, definition_es: "Un número medido en el tiempo (ej. peticiones por segundo, memoria usada). Se guarda como serie de tiempo y es barato de almacenar y consultar.", definition_en: A numeric measurement recorded over time., example_en: The request rate metric doubled after the release., analogy: "El velocímetro de un carro: no te cuenta el viaje, pero en un vistazo sabes si vas demasiado rápido.", see_also: [ obs-log, obs-trace ] }, { slug: obs-log, term: log, category: basics, definition_es: "Registro de un evento puntual con texto y contexto (qué pasó, cuándo, con qué datos). Ideal para el detalle de un problema.", definition_en: A timestamped record of a single event with details., example_en: The log shows why order o-100 was rejected., analogy: "La bitácora de un barco: cada entrada cuenta qué pasó y a qué hora.", see_also: [ obs-metric ] }, { slug: obs-trace, term: trace, category: basics, definition_es: "El recorrido completo de UNA petición a través de varios servicios, dividido en spans con su duración.", definition_en: "The path of one request across services, made of spans.", example_en: The trace showed that 90% of the time was spent in the payment call., analogy: "El rastreo de un paquete: ves cada bodega por la que pasó y cuánto tiempo estuvo en cada una.", see_also: [ obs-span ] }, { slug: obs-span, term: span, category: basics, definition_es: "Una unidad de trabajo dentro de una traza (una llamada HTTP, una consulta a la BD) con inicio, duración y atributos.", definition_en: A single unit of work inside a trace., example_en: The database span took 1.8 seconds., analogy: "Cada escala de un vuelo con conexiones: el viaje completo es la traza.", see_also: [ obs-trace ] }, { slug: obs-golden-signals, term: golden signals, category: basics, definition_es: "Las 4 señales del libro de SRE de Google para vigilar un servicio: Latency, Traffic, Errors y Saturation.", definition_en: "Latency, traffic, errors and saturation.", example_en: Our dashboard starts with the four golden signals., analogy: "Los signos vitales en un hospital: pulso, presión, temperatura y respiración.", see_also: [ obs-red, obs-use ] }, { slug: obs-red, term: RED method, category: basics, definition_es: "Método para servicios: Rate (peticiones por segundo), Errors (cuántas fallan) y Duration (cuánto tardan).", definition_en: "Rate, Errors, Duration — a checklist for services.", example_en: Every service dashboard follows the RED method., analogy: "En un restaurante: cuántos pedidos llegan, cuántos salen mal y cuánto tardan.", see_also: [ obs-use ] }, { slug: obs-use, term: USE method, category: basics, definition_es: "Método para recursos (CPU, disco, pool de conexiones): Utilization, Saturation y Errors.", definition_en: "Utilization, Saturation, Errors — a checklist for resources.", example_en: The USE method showed the connection pool was saturated., analogy: "Un estacionamiento: qué tan lleno está, cuántos carros esperan afuera y cuántas barreras fallan.", see_also: [ obs-red ] }, { slug: obs-cardinality, term: cardinality, category: prometheus, definition_es: Cantidad de series de tiempo distintas que genera una métrica (una por cada combinación de labels). Muy alta = Prometheus lento o sin memoria., definition_en: The number of unique time series created by label combinations., example_en: Adding the user id as a label caused a cardinality explosion., analogy: "Abrir un cajón nuevo por cada cliente en vez de uno por cada tienda: pronto no caben en la oficina.", see_also: [ obs-label ] }, { slug: obs-percentile, term: "percentile (p95, p99)", category: basics, definition_es: Valor bajo el cual cae ese porcentaje de las mediciones. p99 = 500 ms significa que el 99 % de las peticiones tardó 500 ms o menos., definition_en: The value below which a given percentage of measurements fall., example_en: The p99 latency is more useful than the average., analogy: "En una carrera, el tiempo en que llegó el corredor número 99 de 100: te habla de los más lentos.", see_also: [ obs-histogram ] }, { slug: obs-counter, term: counter, category: prometheus, definition_es: "Métrica que solo sube (o vuelve a 0 al reiniciar): total de peticiones, de órdenes, de errores. Se consulta con rate() o increase().", definition_en: "A metric that only goes up, like a total count.", example_en: http_server_requests_seconds_count is a counter., analogy: "El cuentakilómetros de un carro: nunca baja.", see_also: [ obs-gauge, obs-rate ] }, { slug: obs-gauge, term: gauge, category: prometheus, definition_es: "Métrica que sube y baja y representa un valor actual: memoria usada, conexiones activas, mensajes en cola.", definition_en: "A metric that can go up and down, like a current value.", example_en: Active connections is a gauge., analogy: "El indicador de gasolina: sube cuando cargas y baja cuando manejas.", see_also: [ obs-counter ] }, { slug: obs-histogram, term: histogram, category: prometheus, definition_es: "Métrica que cuenta observaciones por rangos (buckets) para estudiar distribuciones, como latencias. Permite calcular percentiles agregados.", definition_en: A metric that counts observations in buckets to measure distributions., example_en: We use a histogram to calculate the p99 latency., analogy: "Clasificar a los corredores por cuántos llegaron antes de 1 h, antes de 2 h, antes de 3 h…", see_also: [ obs-histogram-quantile, obs-percentile ] }, { slug: obs-scrape, term: scrape, category: prometheus, definition_es: La visita periódica de Prometheus al endpoint de métricas de un servicio para leer sus valores (modelo pull)., definition_en: Prometheus periodically pulling metrics from an endpoint., example_en: Prometheus scrapes the service every 15 seconds., analogy: El lector de medidores que pasa casa por casa anotando el consumo de luz., see_also: [ obs-exporter ] }, { slug: obs-exporter, term: exporter, category: prometheus, definition_es: "Programa que traduce las métricas de un sistema que no habla Prometheus (Postgres, Linux, Cassandra) al formato que Prometheus puede leer.", definition_en: A program that exposes another system's metrics in Prometheus format., example_en: We run the node exporter on every VM., analogy: Un intérprete que traduce lo que dice la máquina al idioma de Prometheus., see_also: [ obs-scrape ] }, { slug: obs-label, term: label, category: prometheus, definition_es: 'Par clave-valor que identifica una serie de tiempo (method="POST", status="500"). Permite filtrar y agrupar; cada combinación es una serie distinta.', definition_en: A key-value pair that identifies a time series., example_en: Filter the errors with the label status=~"5.."., analogy: "Las etiquetas de colores en carpetas: te permiten agrupar, pero si inventas una etiqueta por cada hoja, ya no sirven.", see_also: [ obs-cardinality ] }, { slug: obs-micrometer, term: Micrometer, category: java, definition_es: "Librería de Java para instrumentar métricas con una API neutral; exporta a Prometheus, Datadog, CloudWatch, etc. Spring Boot la usa por defecto.", definition_en: A vendor-neutral metrics library for the JVM., example_en: We count created orders with a Micrometer counter., analogy: "Un enchufe universal de viaje: tu aparato no cambia, solo el adaptador del país.", see_also: [ obs-counter ] }, { slug: obs-promql, term: PromQL, category: prometheus, definition_es: "El lenguaje de consultas de Prometheus: selecciona series por nombre y labels y las transforma con funciones (rate, sum, histogram_quantile).", definition_en: The Prometheus query language., example_en: Write a PromQL query for the error ratio., analogy: "Como SQL, pero pensado para series de tiempo en lugar de tablas.", see_also: [ obs-rate ] }, { slug: obs-rate, term: rate(), category: prometheus, definition_es: "Función que convierte un counter en 'cuánto sube por segundo' dentro de una ventana, manejando los reinicios del contador.", definition_en: Per-second average increase of a counter over a time window., example_en: Use rate() before summing counters., analogy: Pasar del cuentakilómetros total a la velocidad actual., see_also: [ obs-counter, obs-range-vector ] }, { slug: obs-histogram-quantile, term: histogram_quantile(), category: prometheus, definition_es: "Función que estima un percentil (p95, p99) a partir de los buckets de un histograma; necesita el label `le`.", definition_en: Estimates a quantile from histogram buckets., example_en: "histogram_quantile(0.99, ...) gives the p99 latency.", analogy: Estimar en qué minuto llegó el corredor 99 sabiendo cuántos llegaron en cada franja de tiempo., see_also: [ obs-histogram, obs-percentile ] }, { slug: obs-range-vector, term: range vector, category: prometheus, definition_es: "Conjunto de muestras de cada serie dentro de una ventana de tiempo, escrito con corchetes: `x[5m]`.", definition_en: All samples of each series within a time window., example_en: rate() needs a range vector., analogy: "Un video corto en lugar de una foto: ves cómo cambió en ese rato.", see_also: [ obs-rate ] }, { slug: obs-dashboard, term: dashboard, category: grafana, definition_es: "Pantalla con paneles (gráficos, números) que resumen la salud de un sistema. Bien diseñado, responde en segundos '¿estamos bien?'.", definition_en: A screen of panels that summarize a system's health., example_en: The on-call engineer opened the orders dashboard first., analogy: "El tablero de un avión: lo importante a la vista, los detalles en paneles secundarios.", see_also: [ obs-golden-signals ] }, { slug: obs-recording-rule, term: recording rule, category: prometheus, definition_es: "Regla que Prometheus evalúa periódicamente para precalcular una consulta y guardarla como serie nueva, más barata de consultar.", definition_en: A rule that precomputes a query and stores the result as a new series., example_en: We use a recording rule for the error ratio., analogy: Tener la suma del mes ya calculada en la libreta en vez de sumar todos los recibos cada vez., see_also: [ obs-promql ] }, { slug: obs-alert-rule, term: alerting rule, category: alerting, definition_es: "Regla de Prometheus con una expresión PromQL; si se cumple durante el tiempo `for`, la alerta pasa de pending a firing.", definition_en: A PromQL condition that fires an alert after it holds for a duration., example_en: The alerting rule fires when the error ratio exceeds 5% for 5 minutes., analogy: "Una alarma de humo con retardo: no suena por una tostada quemada de 2 segundos.", see_also: [ obs-alertmanager ] }, { slug: obs-alertmanager, term: Alertmanager, category: alerting, definition_es: "Componente que recibe las alertas de Prometheus y las agrupa, deduplica, silencia, inhibe y envía al canal correcto.", definition_en: "Groups, routes, silences and sends alerts from Prometheus.", example_en: Alertmanager routes critical alerts to PagerDuty., analogy: "La central de emergencias: recibe muchas llamadas del mismo incendio y manda un solo camión.", see_also: [ obs-alert-rule ] }, { slug: obs-sli, term: SLI (service level indicator), category: reliability, definition_es: "Medida cuantitativa del servicio que le importa al usuario, ej. proporción de peticiones exitosas o con latencia < 300 ms.", definition_en: A measurement of service behavior that users care about., example_en: Our SLI is the ratio of successful requests., analogy: "La nota de un examen: el número que te dice cómo te fue.", see_also: [ obs-slo ] }, { slug: obs-slo, term: SLO (service level objective), category: reliability, definition_es: "La meta sobre un SLI en una ventana de tiempo, ej. 99,5 % de peticiones exitosas en 30 días.", definition_en: A target value for an SLI over a time window., example_en: The orders API has a 99.5% availability SLO., analogy: La nota mínima para aprobar el curso., see_also: [ obs-sli, obs-error-budget ] }, { slug: obs-error-budget, term: error budget, category: reliability, definition_es: "Cuánto puedes fallar sin romper el SLO: 100 % − SLO. Si se agota, se prioriza estabilidad sobre funciones nuevas.", definition_en: The amount of failure allowed by the SLO., example_en: We froze releases after burning the error budget., analogy: "El presupuesto mensual para gustos: si lo gastas en la primera semana, el resto del mes toca ahorrar.", see_also: [ obs-burn-rate ] }, { slug: obs-burn-rate, term: burn rate, category: reliability, definition_es: "Qué tan rápido se gasta el error budget comparado con lo permitido. 1 = justo a tiempo; 14,4 = el 2 % del presupuesto mensual en 1 hora.", definition_en: How fast the error budget is being consumed., example_en: A burn rate of 14.4 pages the on-call engineer., analogy: La velocidad a la que vacías el tanque de gasolina comparada con la que te permite llegar al destino., see_also: [ obs-error-budget ] }, { slug: obs-runbook, term: runbook, category: operations, definition_es: "Guía corta para la persona de guardia: qué significa la alerta, qué revisar primero y cómo mitigar.", definition_en: Step-by-step instructions for handling an alert., example_en: Every paging alert links to its runbook., analogy: El manual de emergencia pegado junto al extintor., see_also: [ obs-alert-rule ] }, { slug: obs-rca, term: root cause analysis (RCA), category: incidents, definition_es: "Proceso de encontrar la causa de fondo de un incidente (no solo el síntoma), con evidencia, para corregirla de forma permanente.", definition_en: "Finding the underlying cause of an incident, with evidence.", example_en: The RCA showed a missing index on the new query., analogy: "Un médico que no se queda en bajar la fiebre: busca la infección que la causa.", see_also: [ obs-five-whys, obs-postmortem ] }, { slug: obs-mttr, term: MTTR (mean time to recovery), category: incidents, definition_es: "Tiempo promedio desde que empieza un incidente hasta que el servicio se recupera. Se reduce con buena detección, runbooks y rollbacks rápidos.", definition_en: Average time to restore service after an incident., example_en: Automated rollbacks cut our MTTR in half., analogy: Cuánto tarda en promedio el mecánico en devolverte el carro funcionando., see_also: [ obs-runbook ] }, { slug: obs-postmortem, term: postmortem (blameless), category: incidents, definition_es: "Documento después de un incidente: impacto, línea de tiempo, causa raíz y acciones preventivas, sin culpar a personas.", definition_en: "A written review of an incident focused on learning, not blame.", example_en: The postmortem listed five action items with owners., analogy: "La revisión después de un partido: se analiza la jugada, no se humilla al jugador.", see_also: [ obs-rca ] }, { slug: obs-five-whys, term: five whys, category: incidents, definition_es: Técnica de preguntar '¿por qué?' repetidamente para pasar del síntoma a la causa de fondo del sistema o del proceso., definition_en: Asking 'why' repeatedly to reach the root cause., example_en: "After five whys, we found the load test didn't cover the new endpoint.", analogy: Como un niño curioso que pregunta '¿y por qué?' hasta llegar al fondo., see_also: [ obs-rca ] }, { slug: obs-saturation, term: saturation, category: basics, definition_es: "Qué tan 'lleno' está un recurso y cuánto trabajo espera por él (ej. conexiones pendientes del pool, mensajes en cola). Suele anticipar la caída.", definition_en: How full a resource is and how much work is waiting for it., example_en: Pool saturation caused the timeouts., analogy: "La fila afuera de un restaurante lleno: antes de que cierren la puerta, ya hay gente esperando.", see_also: [ obs-use, obs-golden-signals ] } ]
