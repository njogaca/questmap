          - type: mcq
            prompt: "¿Por qué usar caché de dependencias en el workflow?"
            options: ["Para no descargar todo Maven en cada ejecución", "Para guardar contraseñas", "Para saltarse las pruebas"]
            answer: 0
            explanation: "El caché acorta cada ejecución al reutilizar las dependencias ya descargadas."
            skill: delivery
            difficulty: 2
          - type: mcq
            prompt: "Repaso. ¿Qué archivo describe cómo construir una imagen?"
            options: ["pom.xml", "Dockerfile", "README"]
            answer: 1
            explanation: "El Dockerfile lista los pasos de construcción."
            skill: delivery
            difficulty: 1
          - type: tf
            prompt: "Repaso. Un volumen conserva los datos aunque se borre el contenedor."
            answer: true
            explanation: "Para eso existe."
            skill: delivery
            difficulty: 1

  # ================================================================ NIVEL 10
  - slug: m1-n10-configuracion
    number: 10
    title: "Configuración y seguridad básica"
    story: "Objetivo: el mismo código corre en cualquier entorno y ningún secreto vive en el repositorio."
    quests:
      - slug: m1-n10-glosario
        type: glossary
        title: "Glosario — Configuración y seguridad"
        xp: 0
        estimated_min: 10
        skills: { delivery: 1.0 }
        payload:
          terms: [g-p1-environment-variable, g-p1-profile, g-p1-secret, g-p1-authentication]

      - slug: m1-n10-ejercicio
        type: lab
        title: "Ejercicio — Perfiles y secretos fuera del código"
        xp: 50
        estimated_min: 150
        skills: { delivery: 1.0 }
        resources:
          - { ref: res-p-boot-config, required: false }
        payload:
          proof: commit_or_hours
          goal: "Perfiles `dev` y `prod`, credenciales leídas de variables de entorno y los endpoints de escritura protegidos."
          spec:
            context: |
              Seguridad revisó el repositorio antes de hacerlo público y dejó tres hallazgos: la
              contraseña de la base está en `application.yml`, la misma configuración se usa en
              desarrollo y en producción, y cualquiera que conozca la URL puede borrar pedidos.
              El repositorio no se publica hasta cerrar los tres.
            requirements:
              - "Hay dos perfiles de Spring: `dev` y `prod`, con `application-dev.yml` y `application-prod.yml`. Lo común queda en `application.yml`."
              - "Las credenciales de la base y las de la API se leen de variables de entorno. No hay ninguna escrita en archivos versionados."
              - "`POST`, `PUT` y `DELETE` sobre `/orders` exigen autenticación HTTP Basic."
              - "`GET /status`, `GET /orders` y `GET /orders/{id}` siguen abiertos."
              - "Existe un `.env.example` con todas las variables y valores de ejemplo, y `.env` está en `.gitignore`."
              - "El historial de Git no contiene ninguna contraseña real."
              - "Las pruebas de integración se actualizan: mandan credenciales en las escrituras y hay pruebas nuevas para el `401`."
            inputs:
              - { name: "SPRING_PROFILES_ACTIVE", type: "variable de entorno", desc: "`dev` o `prod`." }
              - { name: "DB_URL", type: "variable de entorno", desc: "URL JDBC de la base." }
              - { name: "DB_USER", type: "variable de entorno", desc: "Usuario de la base." }
              - { name: "DB_PASSWORD", type: "variable de entorno", desc: "Contraseña de la base." }
              - { name: "API_USER", type: "variable de entorno", desc: "Usuario que puede escribir en la API." }
              - { name: "API_PASSWORD", type: "variable de entorno", desc: "Su contraseña." }
              - { name: "Authorization", type: "cabecera HTTP", desc: "`Basic <base64 de usuario:contraseña>` en las peticiones de escritura." }
            outputs:
              - { name: "401", type: "HTTP", desc: "Escritura sin credenciales o con credenciales incorrectas. Incluye la cabecera `WWW-Authenticate: Basic`." }
              - { name: "201 / 200 / 204", type: "HTTP", desc: "Escritura con credenciales correctas: los mismos códigos de siempre." }
              - { name: "200", type: "HTTP", desc: "Lecturas y `/status`, sin credenciales." }
            rules:
              - "En `prod` no hay valores por defecto para los secretos: si falta una variable, el servicio no arranca y el error dice cuál falta."
              - "En `dev` se permiten valores por defecto solo para apuntar a la base local de Compose."
              - "La API no guarda sesión (`SessionCreationPolicy.STATELESS`) y CSRF está desactivado, porque no hay navegador con cookies."
              - "La contraseña de la API se compara contra un hash (`BCryptPasswordEncoder`), no en texto plano."
              - "En `prod` el nivel de log es `INFO` y no se imprimen las consultas SQL. En `dev` sí puedes verlas."
              - "Si una contraseña real llegó alguna vez al historial, se cambia. Borrarla del último commit no la quita del historial."
            examples:
              - title: "Escribir sin credenciales"
                input: |
                  curl -i -X DELETE http://localhost:8080/orders/3f2b8c1e-6a4d-4e0b-9c7a-2d5e8f1a0b3c
                output: |
                  HTTP/1.1 401
                  WWW-Authenticate: Basic realm="Realm"
              - title: "Escribir con credenciales"
                input: |
                  curl -i -u "$API_USER:$API_PASSWORD" -X DELETE http://localhost:8080/orders/3f2b8c1e-6a4d-4e0b-9c7a-2d5e8f1a0b3c
                output: |
                  HTTP/1.1 204
              - title: "Buscar secretos en el historial"
                input: |
                  git log -p --all -S "password" -- "*.yml" "*.properties"
                output: |
                  (solo referencias a variables como ${DB_PASSWORD}; ningún valor real)
            edge_cases:
              - "Usuario correcto con contraseña equivocada: `401`, no `403` ni `500`."
              - "`GET /orders` sin credenciales: `200`."
              - "Arrancar con `prod` sin `DB_PASSWORD`: el servicio no levanta."
              - "Un `POST` inválido sin credenciales responde `401`, no `400`: la autenticación va antes que la validación."
              - "El `docker-compose.yml` del nivel 8 sigue funcionando con los nombres nuevos de las variables."
            out_of_scope:
              - "JWT, OAuth2 y proveedores de identidad."
              - "Roles y permisos distintos por usuario: hay un solo usuario de escritura."
              - "HTTPS. En producción iría delante del servicio; aquí no se configura."
              - "Gestores de secretos (Vault, Secret Manager)."
          steps:
            - title: "Perfiles"
              body: "Separa la configuración en `application-dev.yml` y `application-prod.yml`."
            - title: "Secretos fuera"
              body: "Lee usuario y contraseña de la base desde variables de entorno. Agrega un `.env.example` sin valores reales y revisa el historial de Git."
            - title: "Protege la escritura"
              body: "Con Spring Security, exige autenticación en `POST`, `PUT` y `DELETE`. `GET /status` queda abierto."
          checklist:
            - "No hay ninguna contraseña en el repositorio ni en su historial"
            - "El servicio arranca con cada perfil"
            - "Escribir sin credenciales responde 401"

